# mise (https://mise.jdx.dev) — codified toolchain for this repo.
#
# Run `mise install` to provision the exact versions used in CI and on
# Sebastien's Mac. Matches the toolchain at HEAD; bump alongside any
# matrix change in .github/workflows/ci.yml.

[tools]
python = "3.12"
node   = "22"

# Rust is deliberately NOT declared here: rustup owns the toolchain.
# A mise `rust` entry exports RUSTUP_TOOLCHAIN, which overrides rustup's
# own selection, and on a rustup-backed workstation mise sees its
# symlinked rust install as missing, so `cargo:ssg` (which depends on the
# configured rust) refused to install. Without the entry, `cargo:ssg`
# builds with the cargo rustup puts on PATH.

# pandoc renders the lead-magnet PDFs in build.sh (build_lead_magnets.py).
# It must be declared here, not merely installed globally: mise puts a
# `pandoc` shim on PATH regardless, but the shim exits non-zero unless a
# version is bound for *this* directory. An unbound shim looks present and
# fails on use, which broke `./build.sh` at the lead-magnet step.
pandoc = "3.10"

# JS CLI tools managed by mise's npm backend — pinned to the SAME exact
# versions CI uses (`.github/workflows/ci.yml`: `pa11y-ci@4.1.1`). See
# ADR-0002. After `mise install`, `pa11y-ci` and `http-server` resolve on
# PATH inside this repo's shell — no global npm pollution, no version drift.
"npm:pa11y-ci"    = "4.1.1"
"npm:http-server" = "14"

# ssg is declared here, exactly pinned, so a global mise entry cannot pick
# the compiler (a global 0.0.52 once produced 7,240 junk tag pages).
# Pinned rather than "latest" so an upstream release cannot change output
# mid-PR (0.0.48 changed the CSP; 0.0.50 broke the Linux build). 0.0.75 is
# the first pin with both fixes this site depends on: minify_css keeps the
# space before +/- after a run of spaces (clamp() survives), and the a11y
# gate reads rules inside @layer blocks (design system v2 wraps the legacy
# stylesheet in @layer legacy). Bump in a reviewed PR when
# ssg-version-check.yml opens its issue. Must equal SSG_VERSION in ci.yml
# (tests/unit/test_ssg_pin_single_source.py).
"cargo:ssg" = "0.0.75"

[env]
# Tells Python tooling to honour the repo's pyproject.toml settings.
PYTHONDONTWRITEBYTECODE = "1"
