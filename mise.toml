# mise (https://mise.jdx.dev) — codified toolchain for this repo.
#
# Run `mise install` to provision the exact versions used in CI and on
# Sebastien's Mac. Matches the toolchain at HEAD; bump alongside any
# matrix change in .github/workflows/ci.yml.

[tools]
python = "3.12"
node   = "22"
rust   = "stable"

# pandoc renders the lead-magnet PDFs in build.sh (build_lead_magnets.py).
# It must be declared here, not merely installed globally: mise puts a
# `pandoc` shim on PATH regardless, but the shim exits non-zero unless a
# version is bound for *this* directory. An unbound shim looks present and
# fails on use, which broke `./build.sh` at the lead-magnet step.
pandoc = "3.10"

# JS CLI tools managed by mise's npm backend — pinned to the SAME exact
# versions CI uses (`.github/workflows/ci.yml`: `pa11y-ci@4.1.1`). See
# ADR-0002. After `mise install`, `pa11y-ci` and `http-server` resolve on
# PATH inside this repo's shell — no global npm pollution, no version drift.
"npm:pa11y-ci"    = "4.1.1"
"npm:http-server" = "14"

# ssg IS declared here, exactly-pinned, and that is load-bearing.
#
# It used to be deliberately absent ("installed from crates.io rather than via
# mise"), which meant a `cargo:ssg` entry in the user's GLOBAL mise config won:
# its shim shadows ~/.cargo/bin, so `cargo install ssg --version <pin>` could be
# silently overridden and `./build.sh` would compile with whatever version that
# happened to be. It did — a global entry resolved to 0.0.52 and produced a
# 14,045-page tree with 7,240 /tags/ pages titled "My SSG Site", against the
# pinned compiler's 6,856 and 48.
#
# A repo-local mise config takes precedence over the global one, so declaring it
# here is what stops a global entry deciding which compiler builds this site.
# It tracks `latest`, matching SSG_VERSION in .github/workflows/ci.yml;
# tests/unit/test_ssg_pin_single_source.py enforces that they agree.
"cargo:ssg" = "latest"

# Why 0.0.39 specifically:
#
# Policy: CI tracked the latest published ssg until 0.0.50 broke the Linux
# build (tags not split on non-ASCII separators -> 348-byte directory name
# -> ENAMETOOLONG on ext4; see #431). Held at 0.0.39 until that is fixed.
# The version is pinned rather
# than left floating so a build is reproducible and an upstream release
# cannot change output mid-PR — ssg has form here: 0.0.48+ altered the CSP
# ssg emits, which broke the build gate until scripts/postbuild/
# postbuild_assets.py normalise_csp() landed. The bump is therefore a
# reviewed commit; .github/workflows/ssg-version-check.yml files an issue
# within a week of a new release so the pin cannot quietly go stale.

[env]
# Tells Python tooling to honour the repo's pyproject.toml settings.
PYTHONDONTWRITEBYTECODE = "1"
