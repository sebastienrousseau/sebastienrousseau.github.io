[project]
# This repo isn't a published Python package — it's a static site build
# pipeline whose scripts/ directory happens to be Python. pyproject.toml
# exists so ruff + pytest + uv pick up the same configuration in CI and
# locally, not for distribution metadata.
name = "sebastienrousseau-com-build"
version = "1.2.0"
description = "Build + validate pipeline for sebastienrousseau.com"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "docs",
    "public",
    "audits",
]

[tool.ruff.lint]
# Keep the rule set tight enough that ruff is useful as a CI gate but
# doesn't flood with style nits on a build-script codebase. Notable
# omissions explained inline.
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes (unused imports, undefined names — real bugs)
    "I",      # isort (import ordering)
    "B",      # flake8-bugbear (likely-bugs)
    "UP",     # pyupgrade (modern syntax)
    "SIM",    # flake8-simplify (collapsible logic)
    "C901",   # mccabe complexity > 10
    "S",      # bandit subset (security)
    "RUF",    # ruff-specific rules
    "PERF",   # perflint
    "RET",    # flake8-return
]
ignore = [
    "E501",   # line-length — keep loose; long URL/SQL lines are normal
    "S101",   # assert allowed in tests
    "S314",   # ET.parse on our own controlled XML is fine
    "S310",   # urllib.urlopen for the link-audit tool is the point
    "RET504", # unnecessary assignment before return — sometimes clearer
    "RUF013", # implicit Optional — handled by mypy where it matters
    "E402",   # `import sys` is intentionally placed below `sys.path.insert()`
              # in scripts that import shared modules from scripts/_frontmatter.py
    "RUF001", # `›`, `–` etc. in user-facing strings is intentional typography
    "RUF002", # same in docstrings
    "RUF003", # same in comments
]

[tool.ruff.lint.per-file-ignores]
# Build scripts use top-level expressions extensively. Tests use asserts.
# S311 in tests: a *seeded* random.Random is how a test pins a picker's
# choice so the assertion is deterministic. That is the opposite of the
# weak-randomness risk S311 exists to catch, and it never reaches security
# code — the picker chooses a banner image.
"scripts/*"      = ["S603", "S607"]
"tests/*"        = ["S101", "S603", "S607", "PLR2004", "S311"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra --tb=short"
pythonpath = ["scripts"]

[tool.mypy]
# Real type-checking — see improvement-plan-2026.md Phase 1.2. The strict
# settings below apply to whatever is passed to mypy; the GATE (which dirs
# must stay green) is curated in scripts/typecheck.sh, ratcheting outward as
# modules are cleaned. `check_untyped_defs` is the switch that makes mypy
# actually inspect this largely-untyped codebase instead of no-op'ing.
python_version = "3.11"
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = '^(docs|public|audits)/'
