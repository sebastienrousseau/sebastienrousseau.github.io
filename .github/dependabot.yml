version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # v2.6.0's image cannot be pulled: its ghcr.io index names manifests
      # that were deleted (ossf/scorecard-action#1752). Only this version
      # is skipped, so a fixed 2.6.x or later still arrives.
      - dependency-name: "ossf/scorecard-action"
        versions: ["2.6.0"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]
