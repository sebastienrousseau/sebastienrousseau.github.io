name: codeql

# Static security analysis (CodeQL) for the Python pipeline and the
# Worker/layout JavaScript. Alerts surface in the Security tab; this does not
# fail content PRs. Path-filtered so markdown-only PRs don't pay the cost.
# improvement-plan-2026.md Phase 2.3 / ADR-0005.

# Runs on every push and PR to main, not only on code paths. The path
# filter meant a markdown-only change — most of this repo's commits — never
# triggered CodeQL, so OpenSSF Scorecard measured 15 of the last 30 commits
# as unscanned and scored SAST 8/10. A content PR now pays a few minutes of
# CodeQL; the alternative is a SAST gate with holes in it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
