name: codeql

# Static security analysis (CodeQL) for the Python pipeline and the
# Worker/layout JavaScript. Alerts surface in the Security tab; this does not
# fail content PRs. Path-filtered so markdown-only PRs don't pay the cost.
# improvement-plan-2026.md Phase 2.3 / ADR-0005.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'workers/**'
      - '_layouts/**'
      - 'labs/**'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'workers/**'
      - '_layouts/**'
      - 'labs/**'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '37 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:${{ matrix.language }}"
