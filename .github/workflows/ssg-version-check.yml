name: ssg version drift check

# Policy is that CI runs the latest published ssg. The version is still pinned
# per ADR-0002, because an unpinned `cargo install ssg` would let an upstream
# release change build output in the middle of an unrelated PR — 0.0.48 did
# exactly that by altering the emitted CSP, breaking the build gate until
# normalise_csp() landed.
#
# So: pin, but never let the pin go quietly stale. This reads the version CI
# actually installs and files a tracking issue when crates.io has moved ahead.

on:
  schedule:
    # Mondays at 07:00 UTC.
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Compare pinned ssg against crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve pinned and latest versions
        id: versions
        run: |
          set -euo pipefail

          # Read the pin from the workflow that actually builds the site, so
          # this check cannot drift from what CI installs. SSG_VERSION is the
          # single source of truth there — the cache key and the install both
          # read it, and the install asserts the running binary matches.
          PINNED="$(sed -n 's/^  SSG_VERSION: "\([0-9][0-9.]*\)".*/\1/p' \
            .github/workflows/ci.yml | head -1)"
          if [ -z "${PINNED}" ]; then
            echo "::error::could not read the ssg pin from .github/workflows/ci.yml"
            exit 1
          fi

          LATEST="$(curl -fsSL https://crates.io/api/v1/crates/ssg \
            --user-agent 'sebastienrousseau.github.io version-check' \
            | jq -r '.crate.max_stable_version // .crate.max_version')"
          if [ -z "${LATEST}" ] || [ "${LATEST}" = "null" ]; then
            echo "::error::could not read the latest ssg version from crates.io"
            exit 1
          fi

          echo "pinned=${PINNED}" >> "${GITHUB_OUTPUT}"
          echo "latest=${LATEST}" >> "${GITHUB_OUTPUT}"
          echo "Pinned ${PINNED}, latest ${LATEST}"

          if [ "${PINNED}" = "${LATEST}" ]; then
            echo "drift=false" >> "${GITHUB_OUTPUT}"
          else
            echo "drift=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: File a tracking issue
        if: steps.versions.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ steps.versions.outputs.pinned }}
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          set -euo pipefail

          TITLE="Bump ssg pin: ${PINNED} → ${LATEST}"

          # One open issue per target version, not one per week. Matched on
          # title rather than a label so this needs no label that does not
          # already exist in the repo.
          EXISTING="$(gh issue list --state open --limit 100 \
            --json number,title --jq \
            ".[] | select(.title == \"${TITLE}\") | .number" | head -1)"
          if [ -n "${EXISTING}" ]; then
            echo "Issue #${EXISTING} already tracks ${LATEST}; nothing to do."
            exit 0
          fi

          cat > issue-body.md <<EOF
          crates.io publishes \`ssg\` **${LATEST}**; CI installs **${PINNED}**.

          CI tracks the latest ssg, so this pin should move. Bump it deliberately
          rather than unpinning — a floating install would change build output in
          the middle of unrelated PRs, which is how 0.0.48's CSP change broke the
          build gate.

          Sites to update (all must match):

          - \`SSG_VERSION\` in \`.github/workflows/ci.yml\`
          - \`SSG_VERSION\` in \`.github/workflows/lighthouse.yml\`
          - \`SSG_VERSION\` in \`.github/workflows/link-audit.yml\`
          - \`SSG_VERSION\` in \`.github/workflows/pr-translation-summary.yml\`
          - \`SSG_VERSION\` in \`.github/workflows/schema-diff.yml\`
          - \`README.md\` (setup snippet and the \`make verify\` note)
          - \`mise.toml\` (documented install line)

          Before merging, run \`make verify\` locally against ${LATEST} — the
          build gates catch output changes, but only if the local toolchain is
          on the new version too.
          EOF

          gh issue create \
            --title "${TITLE}" \
            --body-file issue-body.md \
            --label "automation"
