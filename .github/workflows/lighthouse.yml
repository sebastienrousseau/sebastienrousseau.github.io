name: Lighthouse CI

on:
  schedule:
    # Sundays at 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Python build deps
        run: pip install --quiet --require-hashes -r requirements.lock

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"

      - name: Install Lighthouse CI
        # Hash-pinned via .github/ci-tools/lighthouse/package-lock.json (npm ci,
        # OpenSSF Scorecard Pinned-Dependencies; version is ADR-0002).
        run: |
          npm ci --prefix .github/ci-tools/lighthouse
          echo "$PWD/.github/ci-tools/lighthouse/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry + git + ssg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-ssg

      - name: Add cargo bin to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Static Site Generator (ssg)
        run: |
          if ! command -v ssg >/dev/null 2>&1; then
            cargo install ssg --locked --version 0.0.50   # ADR-0002
          fi

      - name: Build site
        run: ./build.sh

      - name: Run Lighthouse CI
        run: lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse reports as artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lighthouse-${{ github.run_id }}
          path: .lighthouseci/
          retention-days: 30
