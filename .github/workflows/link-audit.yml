name: Monthly external link audit

# Catches link rot. Builds the site, runs the in-repo audit on the fresh
# `public/` tree, and files a tracking issue if any external links break.
# The audit script already filters bot-blocked false positives.

on:
  schedule:
    # First day of every month at 06:00 UTC.
    - cron: "0 6 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Audit external links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Rust toolchain (cached)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + git
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-ssg

      - name: Install Static Site Generator (ssg)
        run: |
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v ssg >/dev/null 2>&1; then
            cargo install ssg --locked
          fi

      - name: Build site
        run: |
          pip install --quiet -r requirements.txt
          ./build.sh

      - name: Run external link audit
        id: audit
        run: |
          set -o pipefail
          python3 scripts/seo_and_audit/audit_links.py --base-dir public --check-external \
            | tee audit-report.txt
          broken=$(grep -c '^  \[' audit-report.txt || true)
          echo "broken=${broken}" >> "$GITHUB_OUTPUT"

      - name: File / update tracking issue
        if: steps.audit.outputs.broken != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          TITLE="External link audit — ${DATE} — ${{ steps.audit.outputs.broken }} broken"
          BODY=$(cat <<'EOF'
          Automated monthly run of `scripts/seo_and_audit/audit_links.py --check-external`.

          Triage rules:
          - **404 / 526 / `URLError`** — almost always real link rot. Replace with a Wayback wildcard URL, an alternative source, or remove the link.
          - **403** — bot-block on the target (OpenAI, some news sites). Usually the link is alive to humans. Verify in a real browser before changing.
          - **bare `https://www.googletagmanager.com`** matches inside CSP directives, never as a clickable link → false positive, ignore.

          ---

          Audit output:

          ```
          EOF
          )
          # Append the captured audit-report.txt then close the fence.
          {
            printf '%s\n' "${BODY}"
            cat audit-report.txt
            printf '```\n'
          } > issue-body.md

          gh issue create \
            --title "${TITLE}" \
            --body-file issue-body.md \
            --label "link-rot,automation"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: link-audit-${{ github.run_id }}
          path: audit-report.txt
          retention-days: 90
