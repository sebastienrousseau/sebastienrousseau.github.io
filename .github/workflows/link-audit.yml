name: Monthly external link audit

# Catches link rot. Builds the site, runs the in-repo audit on the fresh
# `public/` tree, and files a tracking issue if any external links break.
# The audit script already filters bot-blocked false positives.

on:
  schedule:
    # First day of every month at 06:00 UTC.
    - cron: "0 6 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

env:
  # Single source of truth for the ssg pin: the cache key and the install
  # both read it, so they cannot drift apart. ADR-0002.
  #
  # Tracks the newest stable ssg. build.sh passes --no-tag-pages,
  # which needs >= 0.0.52 — a pin below that fails with
  # "unexpected argument". Resolution and the version assertion live
  # in .github/actions/setup-ssg so every workflow agrees.
  SSG_VERSION: "latest"

jobs:
  audit:
    name: Audit external links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Rust toolchain (cached)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cache cargo registry + git
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-ssg-${{ env.SSG_VERSION }}

      - name: Install Static Site Generator (ssg)
        uses: ./.github/actions/setup-ssg
        with:
          version: ${{ env.SSG_VERSION }}

      - name: Build site
        run: |
          pip install --quiet --require-hashes -r requirements.lock
          ./build.sh

      - name: Run external link audit
        id: audit
        run: |
          set -o pipefail
          python3 scripts/seo_and_audit/audit_links.py --base-dir public --check-external \
            | tee audit-report.txt
          broken=$(grep -c '^  \[' audit-report.txt || true)
          echo "broken=${broken}" >> "$GITHUB_OUTPUT"

      - name: File / update tracking issue
        if: steps.audit.outputs.broken != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          TITLE="External link audit — ${DATE} — ${{ steps.audit.outputs.broken }} broken"
          BODY=$(cat <<'EOF'
          Automated monthly run of `scripts/seo_and_audit/audit_links.py --check-external`.

          Triage rules:
          - **404 / 526 / `URLError`** — almost always real link rot. Replace with a Wayback wildcard URL, an alternative source, or remove the link.
          - **403** — bot-block on the target (OpenAI, some news sites). Usually the link is alive to humans. Verify in a real browser before changing.
          - **bare `https://www.googletagmanager.com`** matches inside CSP directives, never as a clickable link → false positive, ignore.

          ---

          Audit output:

          ```
          EOF
          )
          # Append the captured audit-report.txt then close the fence.
          {
            printf '%s\n' "${BODY}"
            cat audit-report.txt
            printf '```\n'
          } > issue-body.md

          gh issue create \
            --title "${TITLE}" \
            --body-file issue-body.md \
            --label "link-rot,automation"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: link-audit-${{ github.run_id }}
          path: audit-report.txt
          retention-days: 90
