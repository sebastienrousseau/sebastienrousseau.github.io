#
# Every commit in a pull request must carry a Signed-off-by line asserting the
# Developer Certificate of Origin 1.1 (https://developercertificate.org/).
# See the "Sign-off (DCO)" section of CONTRIBUTING.md.
#
# This is deliberately a few lines of shell rather than a third-party action:
# the check is trivial, and adding an action would mean one more SHA to pin and
# one more supply-chain edge for no benefit.

name: DCO

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    name: Signed-off-by present on every commit
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request range
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify sign-off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          # Bot commits (Dependabot, github-actions) are exempt: they are
          # generated by this repository's own automation, not contributed.
          while read -r sha; do
            author_email=$(git log -1 --format='%ae' "$sha")
            case "$author_email" in
              *[bot]@users.noreply.github.com|*dependabot*|*github-actions*) continue ;;
            esac
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            if ! git log -1 --format='%B' "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::missing Signed-off-by — $(git log -1 --format='%h %s' "$sha") by ${author}"
              missing=1
            fi
          done < <(git rev-list "${BASE}..${HEAD}")

          if [ "$missing" -ne 0 ]; then
            echo
            echo "Add sign-off with:  git commit -S -s"
            echo "To fix a branch:    git rebase --signoff ${BASE}"
            echo "See CONTRIBUTING.md, section 'Sign-off (DCO)'."
            exit 1
          fi
          echo "every commit is signed off"
