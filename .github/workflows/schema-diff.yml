name: schema-diff

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: schema-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Single source of truth for the ssg pin: the cache key and the install
  # both read it, so they cannot drift apart. ADR-0002.
  SSG_VERSION: "0.0.50"

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Single checkout at the repo root, then build HEAD and BASE from
      # the same working tree by hard-resetting between builds. The old
      # multi-checkout pattern (head/ + base/ subdirectories) made the
      # SSG `extract metadata` phase fail with "No valid front matter
      # found" — ssg only builds cleanly with CWD at the repo root, which
      # is exactly the single-checkout pattern ci.yml uses successfully.
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Cache cargo registry + git + ssg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-ssg-${{ env.SSG_VERSION }}

      - name: Add cargo bin to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Static Site Generator (ssg)
        run: |
          # `command -v ssg` is not a version check. ~/.cargo/bin is restored
          # from the cargo cache, so a stale binary satisfies it and the pin
          # never applies — CI built with 0.0.39 for months while this line
          # read 0.0.46 and then 0.0.50. The drift was invisible because a
          # skipped `cargo install` prints nothing. Compare the running
          # version, reinstall on mismatch, then assert, so a wrong binary
          # fails the job instead of quietly building the site. ADR-0002.
          have="$(ssg --version 2>/dev/null | awk '{print $2}' || true)"
          if [ "${have:-}" != "${SSG_VERSION}" ]; then
            echo "ssg: have '${have:-none}', want ${SSG_VERSION} — installing"
            cargo install ssg --locked --version "${SSG_VERSION}" --force
          fi
          got="$(ssg --version | awk '{print $2}')"
          if [ "${got}" != "${SSG_VERSION}" ]; then
            echo "::error::ssg ${got} is running but ${SSG_VERSION} is pinned"
            exit 1
          fi
          echo "ssg ${got} (pinned)"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"

      - name: Install Python build deps
        run: pip install --quiet --require-hashes -r requirements.lock

      # Build the PR head first (current working tree), stash the output,
      # then reset the tree to the PR base SHA and build that. Both builds
      # run with CWD = repo root and emit to `public/` (the `docs/`
      # snapshot was retired 2026-06-10).
      - name: Build HEAD (skip WASM compilation)
        run: |
          ./build.sh
          rm -rf /tmp/head-public
          mv public /tmp/head-public

      - name: Build BASE (skip WASM compilation)
        run: |
          git reset --hard ${{ github.event.pull_request.base.sha }}
          git clean -fd
          ./build.sh
          rm -rf /tmp/base-public
          mv public /tmp/base-public

      - name: Run JSON-LD diff
        run: |
          python3 scripts/seo_and_audit/jsonld_diff.py /tmp/base-public /tmp/head-public > diff.md
          cat diff.md

      - name: Post diff comment
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('diff.md', 'utf8');
            const marker = '<!-- schema-diff-bot -->';
            const fullBody = `${marker}\n\n${body}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body: fullBody,
              });
            }
