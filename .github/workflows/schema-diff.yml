name: schema-diff

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: schema-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      # Pinned to actions/checkout v6 here (NOT v7). v7 broke the
      # specific multi-checkout pattern this workflow uses (head/ +
      # base/ subdirectories): the SSG `extract metadata` post-
      # processing step fails with "No valid front matter found" on
      # every PR opened after PR #243 bumped checkout v6→v7 across all
      # workflows. PR #246's first attempt (fetch-depth: 0 with v7) did
      # not fix it — the failure is structural to the v7 multi-checkout
      # behaviour, not the fetch depth. ci.yml's single-checkout pattern
      # works fine on v7, so the bump stays everywhere else.
      - name: Checkout HEAD
        uses: actions/checkout@v7
        with:
          path: head
          fetch-depth: 0

      - name: Checkout base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          fetch-depth: 1

      - name: Cache cargo registry + git + ssg
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-ssg

      - name: Add cargo bin to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Static Site Generator (ssg)
        run: |
          if ! command -v ssg >/dev/null 2>&1; then
            cargo install ssg --locked
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Python build deps
        run: pip install --quiet -r head/requirements.txt

      - name: Build BASE (skip WASM compilation)
        working-directory: base
        run: ./build.sh

      - name: Build HEAD (skip WASM compilation)
        working-directory: head
        run: ./build.sh

      - name: Run JSON-LD diff
        run: |
          python3 head/scripts/seo_and_audit/jsonld_diff.py base/docs head/docs > diff.md
          cat diff.md

      - name: Post diff comment
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('diff.md', 'utf8');
            const marker = '<!-- schema-diff-bot -->';
            const fullBody = `${marker}\n\n${body}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body: fullBody,
              });
            }
