name: refresh-gh-stats

# Nightly fetch of public GitHub repository stats (stars / forks /
# last-push timestamp / language / license) for the projects listed
# in scripts/fetch_github_stats.py. Updates public/_data/gh-stats.json
# and commits the change so the next deploy picks it up.

on:
  schedule:
    # 03:11 UTC daily — early enough to land in any same-day publish
    # window, late enough that the GH API isn't congested.
    - cron: "11 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch_github_stats.py
      - .github/workflows/refresh-gh-stats.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-gh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch GitHub stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_github_stats.py

      - name: Open PR if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet _data/gh-stats.json; then
            echo "no changes — skipping commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BR="stats/refresh-$(date -u +%Y%m%d)"
          git checkout -b "$BR"
          git add _data/gh-stats.json
          git commit -m "chore(stats): refresh gh-stats.json [skip ci]"
          git push -f --set-upstream origin "$BR"
          # Try to open the PR + queue an auto-merge. Requires:
          #   - Settings → Actions → General → "Allow GitHub Actions to
          #     create and approve pull requests"
          #   - Settings → General → "Allow auto-merge"
          # If either is off, the branch is still pushed and the repo
          # owner can finish the loop manually — we don't fail the whole
          # workflow over that.
          if ! gh pr view "$BR" >/dev/null 2>&1; then
            if gh pr create \
                 --base main --head "$BR" \
                 --title "chore(stats): nightly gh-stats refresh" \
                 --body "Automated refresh of \`_data/gh-stats.json\` from GitHub API. Auto-merges + deletes branch once all checks pass." ; then
              # Queue auto-merge — squash strategy + drop branch on merge.
              # GitHub's auto-merge engine waits for required-status checks
              # to go green before completing the squash, so the failsafe
              # check-pass guarantee survives.
              gh pr merge "$BR" --auto --squash --delete-branch \
                || echo "::warning::auto-merge enqueue failed; PR will need a manual merge"
            else
              echo "::warning::PR creation blocked; branch ${BR} pushed for manual PR"
            fi
          fi
