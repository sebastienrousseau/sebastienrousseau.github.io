name: build-audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh-baselines:
        description: >-
          Visual regression: skip the pixel compare and upload freshly
          runner-rendered screenshots as the `visual-baselines-refresh`
          artifact. Download it and commit the PNGs to
          .github/ci-tools/visual/baseline/ in a PR — baselines are
          NEVER auto-pushed.
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Single source of truth for the ssg pin: the cache key and the install
  # both read it, so they cannot drift apart. ADR-0002.
  #
  # Held at 0.0.39 deliberately. ssg >=0.0.50 splits `tags:` on ASCII ","
  # only, so a locale post using its language's separator (Arabic "،",
  # fullwidth "，") collapses its whole tag list into one tag. The real
  # corpus yields a 348-byte directory name; ext4 caps names at 255 bytes,
  # so the Linux build aborts with ENAMETOOLONG. macOS/APFS counts
  # characters (230) and survives, which is why this never showed up
  # locally. See #431. Unpin once upstream splits on non-ASCII separators
  # or build.sh normalises them before tag generation.
  # "latest" means exactly that: every run installs the newest published ssg.
  #
  # This was pinned to 0.0.39 for months because ssg >= 0.0.50 generated a
  # /tags/ page per term per locale — 7,240 of them, 7,189 titled "My SSG Site"
  # (the tool's placeholder default, which reached rendered pages). Both are
  # fixed upstream; the site now passes --no-tag-pages because it generates its
  # own curated tag pages, and the placeholder default is empty.
  #
  # Tracking latest is safe here because breakage is *caught*, not hoped
  # against: 37 in-build gates, a byte-identical-rebuild job, JSON-LD and
  # link audits, and a post-deploy origin probe. A pin only converts a loud
  # failure into a silent staleness, which is what happened last time.
  #
  # Set a concrete version here to hold a release back; build.sh then asserts
  # it exactly.
  SSG_VERSION: "latest"
  # Issue number holding the pin below the latest release. While set,
  # ssg-version-check.yml stays quiet instead of filing a weekly bump
  # request we have already decided against. Clear it when #431 closes.
  SSG_PIN_HOLD: "431"

jobs:
  # =========================================================================
  # Stage 0 — fast, source-only static analysis. Runs in PARALLEL with the
  # build so lint / type / complexity failures surface in ~2-3 min instead of
  # ~18 min into the build. No ssg / site build needed. improvement-plan 3.2.
  # =========================================================================
  static:
    name: Static analysis (lint, types, complexity)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"

      - name: Install tooling
        # Hash-pinned dev toolchain + runtime deps from a single lock
        # (OpenSSF Scorecard Pinned-Dependencies). Edit requirements-dev.txt
        # then regenerate with scripts/security/lock-deps.sh.
        run: pip install --quiet --require-hashes -r requirements-dev.lock

      - name: Lint (ruff)
        run: ruff check scripts/ tests/

      - name: Type check (mypy strict tier)
        # Strict mypy over the strict-clean module tier; ratchets outward as
        # modules are typed. See scripts/typecheck.sh + improvement-plan Phase 1.2.
        run: bash scripts/typecheck.sh

      - name: Naming conventions check
        run: python3 scripts/dev/check_naming_conventions.py

      - name: Cloudflare KV write audit (Free-tier policy)
        run: bash scripts/dev/check-kv-writes.sh

      - name: Vulnerability scan — CI tooling (npm audit)
        # The Python side has had pip-audit on runtime deps for a while. The
        # npm side had nothing: the three .github/ci-tools/ lockfiles are
        # hash-pinned via `npm ci`, which guarantees reproducibility and says
        # nothing about whether the pinned versions are vulnerable. Dependabot
        # found extract-zip (GHSA-jmr9-qjv8-65gv, high) sitting transitively in
        # all three, and no gate here would have caught it.
        #
        # Gated at high: npm's transitive trees surface low/moderate advisories
        # constantly, and a gate that cries wolf gets ignored. High and critical
        # are the ones that should stop a merge.
        #
        # To resolve one: prefer an `overrides` entry in the relevant
        # package.json, which patches the transitive dependency without moving
        # the top-level tool version (those are pinned under ADR-0002 and must
        # not drift). Regenerate the lockfile with `npm install
        # --package-lock-only` and commit both files.
        run: |
          fail=0
          for tool in visual pa11y lighthouse; do
            echo "::group::npm audit — $tool"
            npm audit --audit-level=high --prefix ".github/ci-tools/$tool" || fail=1
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::high or critical advisory in the CI tooling — see the groups above"
            exit 1
          fi

      - name: Cyclomatic complexity (radon, ratcheted over all of scripts/)
        # Covers ALL of scripts/, not the four directories it used to. The
        # narrow scope left editorial/, security/ and seo_and_audit/ ungated
        # while the README described complexity as a CI gate without
        # qualification — and the ungated set held the worst function in the
        # repo (translate_frontmatter._process_article at D/25), in the
        # translation pipeline that rewrites content across 27 locales with
        # the least test coverage behind it.
        #
        # Widening it surfaced 25 more C-or-worse functions, several inside
        # untested build gates. Restructuring those in one pass to hit a
        # number is how correctness regressions get introduced, so this uses
        # the same ratchet the mypy gate uses: everything is checked, current
        # debt is enumerated in scripts/dev/complexity-allowlist.txt, and the
        # gate fails on anything new AND on a stale entry.
        run: |
          radon cc scripts/ -a -s
          bash scripts/dev/check-complexity.sh

      - name: Code duplication (jscpd)
        run: |
          npx --yes jscpd@4 scripts/ tests/ _layouts/ \
            --min-tokens 50 \
            --threshold 3 \
            --reporters console \
            --silent

  # =========================================================================
  # Stage 1 — build the site, run the build-dependent checks, then partition
  # the pa11y URL set into the shard configs the matrix consumes next.
  # =========================================================================
  build:
    name: Build + smoke tests + partition
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      pa11y-needed: ${{ steps.partition.outputs.pa11y-needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain (cached)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cache cargo registry + git
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-ssg-${{ env.SSG_VERSION }}

      - name: Add cargo bin to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Static Site Generator (ssg)
        run: |
          # `command -v ssg` is not a version check. ~/.cargo/bin is restored
          # from the cargo cache, so a stale binary satisfies it and the pin
          # never applies — CI built with 0.0.39 for months while this line
          # read 0.0.46 and then 0.0.50. The drift was invisible because a
          # skipped `cargo install` prints nothing. Compare the running
          # version, reinstall on mismatch, then assert, so a wrong binary
          # fails the job instead of quietly building the site. ADR-0002.
          have="$(ssg --version 2>/dev/null | awk '{print $2}' || true)"
          if [ "${SSG_VERSION}" = "latest" ]; then
            want="$(cargo search ssg --limit 1 \
              | sed -n 's/^ssg = "\([^"]*\)".*/\1/p')"
            [ -n "${want}" ] || { echo "::error::could not resolve latest ssg"; exit 1; }
          else
            want="${SSG_VERSION}"
          fi
          if [ "${have:-}" != "${want}" ]; then
            echo "ssg: have '${have:-none}', want ${want} — installing"
            cargo install ssg --locked --version "${want}" --force
          fi
          got="$(ssg --version | awk '{print $2}')"
          if [ "${got}" != "${want}" ]; then
            echo "::error::ssg ${got} is running but ${want} was requested"
            exit 1
          fi
          echo "ssg ${got} (SSG_VERSION=${SSG_VERSION})"
          echo "SSG_RESOLVED=${got}" >> "$GITHUB_ENV"

      - name: Install wasm-pack + wasm32 target
        run: |
          rustup target add wasm32-unknown-unknown
          if ! command -v wasm-pack >/dev/null 2>&1; then
            cargo install wasm-pack --version 0.15.0 --locked   # ADR-0002 (pinned; cached in ~/.cargo/bin)
          fi

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"

      - name: Install Python dev tooling
        # Hash-pinned: test runner + SBOM tool + pip-audit + runtime deps, all
        # from the single dev lock (OpenSSF Scorecard Pinned-Dependencies).
        # Regenerate with scripts/security/lock-deps.sh.
        run: pip install --quiet --require-hashes -r requirements-dev.lock

      - name: Vulnerability scan (pip-audit)
        # Audit the runtime deps in requirements.txt against the OSV / PyPI
        # advisory database. Fails the build on any non-deferred advisory;
        # use `pip-audit --ignore-vuln <id>` in this step's body to defer
        # with a comment justifying the deferral.
        # pip-audit itself is installed via the hash-pinned dev lock in the
        # step above; here we only run it against the runtime deps.
        run: pip-audit --strict -r requirements.txt

      - name: Unit tests + coverage gate (postbuild_lib 100 %)
        # Single pre-build pytest run with the postbuild_lib coverage gate.
        # build_translations is gated post-build below: its smoke suites are
        # SKIP_IF_NO_BUILD-guarded, so a pre-build run can only reach ~92 %.
        run: |
          pytest tests/unit/ -ra \
            --cov=scripts/postbuild/postbuild_lib \
            --cov-fail-under=100

      - name: Build site
        run: ./build.sh

      - name: Post-build smoke tests + combined coverage gate (100 %)
        # The smoke suites are guarded by SKIP_IF_NO_BUILD and silently skip
        # in the pre-build pytest run. Re-run all of tests/unit/ now that
        # public/ exists so the build-dependent assertions execute, and gate
        # postbuild_lib + build_translations at 100 % combined coverage —
        # build_translations only reaches 100 % with the smoke suites live.
        # Runs before the link / JSON-LD audits because the translations
        # smoke re-renders locale pages and re-stamps CSP hashes (idempotent
        # on a clean tree).
        run: |
          pytest tests/unit/ -ra \
            --cov=scripts/postbuild/postbuild_lib \
            --cov=scripts/generators/build_translations \
            --cov-fail-under=100

      - name: Internal-link audit
        run: python3 scripts/seo_and_audit/audit_links.py --base-dir public --strict-internal

      - name: JSON-LD + feed validation
        run: python3 scripts/seo_and_audit/validate_jsonld.py --base-dir public

      - name: Generate + validate SBOM (CycloneDX)
        # Emits public/sbom.cdx.json (resolved runtime deps) and ships it in the
        # build artifact → deploy. ADR-0004 / improvement-plan Phase 2.1.
        run: bash scripts/security/gen-sbom.sh public/sbom.cdx.json

      - name: Restore pa11y hash cache (read only)
        # Restore the cache so partition can decide what's already cached.
        # The actual save happens in the `finalise` job after pa11y passes.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _data/pa11y-cache.json
          key: pa11y-cache-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            pa11y-cache-v1-${{ runner.os }}-

      - name: Pre — partition pages against cache
        id: partition
        run: |
          python3 scripts/seo_and_audit/pa11y_cache.py pre \
            --public-dir public \
            --cache _data/pa11y-cache.json \
            --pa11yci-out .pa11yci \
            --manifest-out .pa11y-cache-manifest.json \
            --base-url http://127.0.0.1:8000
          n=$(python3 -c "import json; print(len(json.load(open('.pa11yci'))['urls']))")
          echo "delta_urls=${n}"
          if [ "$n" -gt 0 ]; then
            echo "pa11y-needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pa11y-needed=false" >> "$GITHUB_OUTPUT"
            echo "pa11y-cache: full cache hit, matrix will be skipped"
          fi

      - name: Upload build artifact (public/ + pa11y configs + cache)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-output
          path: |
            public
            .pa11yci
            .pa11yci.dark
            .pa11y-cache-manifest.json
            _data/pa11y-cache.json
          retention-days: 1
          include-hidden-files: true

  # =========================================================================
  # Stage 2 — fan out pa11y across 7 parallel runners. Shards 1-6 each take
  # 1/6 of the delta URLs in the default (light) rendering; the `dark` shard
  # re-audits the fixed representative subset from .pa11yci.dark with the
  # site's dark theme forced via pa11y actions (click .theme-toggle, wait
  # for html[data-theme="dark"]) — see the Dark-mode sweep block in
  # scripts/seo_and_audit/pa11y_cache.py. ~7 URLs, ~2 min: it runs in
  # parallel with the light shards, so the 40-min wall time is unchanged.
  # Skipped entirely (dark included) when the partition step reported a
  # full cache hit: no page changed, so dark rendering cannot have changed.
  # =========================================================================
  pa11y:
    name: pa11y shard ${{ matrix.shard }}
    needs: build
    if: needs.build.outputs.pa11y-needed == 'true'
    runs-on: ubuntu-latest
    # Backstop only. The run step bounds and retries each pa11y attempt
    # itself (35m x 2), so this ceiling exists purely to stop a hang
    # outside pa11y-ci — in checkout, npm ci or the fixture server —
    # from stalling the deploy indefinitely. It must sit above two full
    # attempts or the retry can never complete.
    timeout-minutes: 80
    strategy:
      # Keep all shards going even if one fails, so a single bad URL doesn't
      # mask issues on the other four. We still aggregate exit codes in the
      # finalise job.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, dark]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-output

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"

      - name: Install pa11y-ci
        # Pa11y-ci v4 ships with the modern pa11y v8 + axe-core. v3
        # used an older contrast calculator whose sRGB → luminance
        # precision disagreed with current pa11y/axe by ~0.2 ratio
        # points, masking AAA-passing colour pairs as failures on
        # certain warm bg tones (--paper-card on /<lang>/<topics>/).
        # Hash-pinned via .github/ci-tools/pa11y/package-lock.json (npm ci,
        # OpenSSF Scorecard Pinned-Dependencies; version is ADR-0002). Put the
        # local bin on PATH so `pa11y-ci` below runs unchanged.
        run: |
          npm ci --prefix .github/ci-tools/pa11y
          echo "$PWD/.github/ci-tools/pa11y/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Serve public/
        run: |
          npx http-server public -p 8000 --silent &
          sleep 2

      - name: Filter .pa11yci to shard ${{ matrix.shard }}
        # Light shards: round-robin partition — URL i goes to shard
        # (i % 6) + 1. Stable across runs so cache + manifest stay
        # coherent; balanced because URLs are sorted by relpath and
        # locale/article counts are even. Dark shard: the pre-built
        # .pa11yci.dark subset is used verbatim (theme-flip actions are
        # baked into its URL entries).
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python3 - <<'PY'
          import json, os, shutil
          shard = os.environ["SHARD"]
          if shard == "dark":
              shutil.copyfile(".pa11yci.dark", ".pa11yci.shard")
              with open(".pa11yci.shard") as f:
                  n = len(json.load(f)["urls"])
              print(f"dark shard: {n} representative URLs (theme forced dark)")
          else:
              shard_n, total = int(shard), 6
              with open(".pa11yci") as f:
                  cfg = json.load(f)
              all_urls = cfg["urls"]
              cfg["urls"] = [u for i, u in enumerate(all_urls) if (i % total) == (shard_n - 1)]
              with open(".pa11yci.shard", "w") as f:
                  json.dump(cfg, f, indent=2)
              print(f"shard {shard_n}/{total}: {len(cfg['urls'])} of {len(all_urls)} URLs")
          PY

      - name: Run pa11y-ci on this shard
        run: |
          n=$(python3 -c "import json; print(len(json.load(open('.pa11yci.shard'))['urls']))")
          if [ "$n" -eq 0 ]; then
            echo "empty shard"
            echo '{"total":0,"passes":0,"errors":0,"results":{}}' > pa11y.shard.json
            exit 0
          fi
          # A wedged headless-Chrome process hangs pa11y-ci on a single
          # URL indefinitely. Bounding only the whole job turns that into
          # a skipped deploy, which is how one transient hang on
          # 2026-07-30 kept three later merges off production. Bound each
          # attempt instead and retry once: the hang is transient, and a
          # re-run of the same commit completed in ~30 min after the
          # first attempt burned the full 50-minute job budget.
          #
          # 35m per attempt clears a clean shard with margin (~13 min
          # typical, ~30 min against a large backlog delta) while still
          # catching a hang well inside the job timeout.
          run_shard() {
            timeout --signal=TERM --kill-after=60s 35m \
              pa11y-ci -c .pa11yci.shard --reporter json > pa11y.shard.json
          }
          set +e
          run_shard
          rc=$?
          # 124 = timeout fired; 137 = SIGKILL after --kill-after.
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "pa11y: shard wedged (exit $rc). Killing stray Chrome and retrying once."
            pkill -f "chrome|chromium" 2>/dev/null || true
            sleep 5
            run_shard
            rc=$?
            if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
              echo "pa11y: shard wedged again — failing this shard."
              exit 1
            fi
          fi
          set -e
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          # Best-effort flake retry on this shard's results. The shard
          # still fails if real errors remain after the retry, blocking
          # finalise from updating the cache.
          python3 scripts/seo_and_audit/pa11y_retry_flakes.py pa11y.shard.json

      - name: Upload pa11y shard result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pa11y-shard-${{ matrix.shard }}
          path: pa11y.shard.json
          retention-days: 1

  # =========================================================================
  # Stage 1b — reproducibility. build.sh writes INTO public/ rather than
  # replacing it, so for a long time every local build layered onto the last
  # and public/ became an archaeological record: 7,172 stale /tags/ pages
  # from a superseded scheme (all titled "— My SSG Site"), a 13,940-URL
  # sitemap against production's 6,816, a 32.5 MB search index against
  # production's 806 KB. CI never saw it, because a CI checkout starts empty
  # — which is exactly why it went unnoticed for months while `make verify`
  # and `make serve` measured a tree neither CI nor production ever had.
  #
  # build.sh now cleans public/ first. This job proves it stayed clean: two
  # builds of the same commit must produce byte-identical trees. That turns
  # "reproducible byte-identical builds" from an aspiration in the
  # improvement plan into a check, and it catches any non-idempotent
  # postbuild pass (duplicate integrity="" attributes, accumulating CSP
  # hashes, double-injected link blocks) on the PR that introduces it.
  # =========================================================================
  reproducible:
    name: Reproducible build (byte-identical rebuild)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain (cached)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cache cargo registry + git
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-ssg-${{ env.SSG_VERSION }}

      - name: Add cargo bin to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Static Site Generator (ssg)
        run: |
          have="$(ssg --version 2>/dev/null | awk '{print $2}' || true)"
          if [ "${have:-}" != "${SSG_VERSION}" ]; then
            cargo install ssg --locked --version "${SSG_VERSION}" --force
          fi
          got="$(ssg --version | awk '{print $2}')"
          [ "${got}" = "${SSG_VERSION}" ] || { echo "::error::ssg ${got} != ${SSG_VERSION}"; exit 1; }

      - name: Install wasm-pack + wasm32 target
        run: |
          rustup target add wasm32-unknown-unknown
          command -v wasm-pack >/dev/null 2>&1 || cargo install wasm-pack --version 0.15.0 --locked

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"

      - name: Install Python tooling
        run: pip install --quiet --require-hashes -r requirements-dev.lock

      - name: Build twice and diff
        run: |
          ./build.sh >/dev/null
          mv public public.first
          ./build.sh >/dev/null
          # Timestamped artefacts legitimately differ between runs: the build
          # stamps wall-clock times into feeds and status. Everything else
          # must match byte-for-byte.
          if ! diff -rq \
                --exclude='*.xml' \
                --exclude='status.json' \
                --exclude='feed.json' \
                --exclude='feed.jsonl' \
                public.first public > /tmp/repro.diff 2>&1; then
            echo "::error::rebuild is not byte-identical — a build pass is not idempotent"
            head -50 /tmp/repro.diff
            exit 1
          fi
          echo "rebuild is byte-identical"

  # =========================================================================
  # Stage 2b — visual regression. Screenshots six key pages (home, hub,
  # docs, trust, papers→research, speaking) at 1440px in forced-light
  # rendering via .github/ci-tools/visual/visual.mjs (puppeteer-core over
  # the runner's system Chrome; hash-pinned npm ci) and pixelmatch-compares
  # them against the committed baselines, failing above a 1% changed-pixel
  # ratio per page. Hermetic: all non-local requests are blocked, so CDN
  # availability can never flip the verdict. Runs in parallel with the
  # pa11y shards — ~4 min, no wall-time impact.
  #
  # Baseline maintenance: baselines are renderer-specific (font
  # rasterisation differs between macOS and the Linux runner). If this job
  # fails with low-level noise across whole pages while a local
  # `node .github/ci-tools/visual/visual.mjs shoot|compare` run is clean,
  # or after a DELIBERATE design change: dispatch this workflow with
  # refresh-baselines=true, download the `visual-baselines-refresh`
  # artifact, and commit its PNGs to .github/ci-tools/visual/baseline/ in
  # a reviewed PR. Baselines are never pushed automatically.
  # =========================================================================
  # =========================================================================
  # Stage 2a-bis — checkpoint the pa11y hash cache even when a shard
  # failed.
  #
  # finalise saves the cache, but only runs when every shard is green, so
  # one hung shard used to discard the audit work of all the others. The
  # next run then re-swept the whole delta, took longer, and was likelier
  # to hang again — a single transient hang on 2026-07-30 compounded into
  # three merges never reaching production.
  #
  # This job breaks that loop. It runs whenever pa11y did not succeed and
  # checkpoints ONLY the URLs some shard actually audited and found clean
  # (`post --audited-reports`). Pages nothing audited stay uncached and
  # get swept next time, so the audit gate is unchanged: this saves work,
  # never verdicts. Deploy remains gated on a fully green pa11y in
  # finalise.
  # =========================================================================
  pa11y-cache-checkpoint:
    name: Checkpoint pa11y cache (partial run)
    needs: [build, pa11y]
    if: always() && needs.build.result == 'success' && needs.pa11y.result != 'success' && needs.pa11y.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-output

      - name: Download pa11y shard results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: pa11y-shard-*
          path: pa11y-shards
          merge-multiple: false

      - name: Restore pa11y hash cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _data/pa11y-cache.json
          key: pa11y-cache-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            pa11y-cache-v1-${{ runner.os }}-

      - name: Checkpoint audited-clean pages only
        run: |
          python3 scripts/seo_and_audit/pa11y_cache.py post \
            --public-dir public \
            --cache _data/pa11y-cache.json \
            --manifest .pa11y-cache-manifest.json \
            --audited-reports pa11y-shards \
            --base-url http://127.0.0.1:8000

      - name: Save pa11y hash cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _data/pa11y-cache.json
          key: pa11y-cache-v1-${{ runner.os }}-${{ github.run_id }}

  visual:
    name: Visual regression (6 pages, 1440 light)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"

      - name: Install visual tooling (hash-pinned)
        run: npm ci --prefix .github/ci-tools/visual

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-output

      - name: Serve public/
        run: |
          python3 -m http.server 8200 --directory public --bind 127.0.0.1 &
          sleep 2

      - name: Screenshot key pages
        run: |
          node .github/ci-tools/visual/visual.mjs shoot \
            --base http://127.0.0.1:8200 \
            --out visual-current

      - name: Upload refreshed baselines (refresh-baselines dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.refresh-baselines
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-baselines-refresh
          path: visual-current/
          retention-days: 7

      - name: Compare against committed baselines
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.refresh-baselines) }}
        run: |
          node .github/ci-tools/visual/visual.mjs compare \
            --baseline .github/ci-tools/visual/baseline \
            --current visual-current \
            --diff visual-diffs \
            --max-diff-ratio 0.01

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-diff
          path: |
            visual-current/
            visual-diffs/
          retention-days: 7

  # =========================================================================
  # Stage 3 — merge pa11y shard results, run Lighthouse, update the cache,
  # and deploy on main. Runs even if the matrix was skipped (full cache
  # hit) so Lighthouse + deploy still happen.
  # =========================================================================
  finalise:
    name: Merge pa11y, Lighthouse, deploy
    needs: [build, pa11y]
    if: always() && needs.build.result == 'success' && (needs.pa11y.result == 'success' || needs.pa11y.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pages: write
      id-token: write
      attestations: write   # SLSA build provenance for the SBOM (ADR-0004)
    # The `github-pages` environment has "Deployment branches: main only"
    # protection. Applying it to the whole job blocks every PR run at the
    # 2-second mark before any step executes. Bind it only when this run
    # is actually going to deploy (main push) so PRs can still get a real
    # build / lint / test / Lighthouse / pa11y signal.
    environment: ${{ github.ref == 'refs/heads/main' && 'github-pages' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"

      - name: Install Lighthouse CI
        # Hash-pinned via .github/ci-tools/lighthouse/package-lock.json (npm ci,
        # OpenSSF Scorecard Pinned-Dependencies; version is ADR-0002).
        run: |
          npm ci --prefix .github/ci-tools/lighthouse
          echo "$PWD/.github/ci-tools/lighthouse/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-output

      - name: Download pa11y shard results
        if: needs.pa11y.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: pa11y-shard-*
          merge-multiple: true
          path: pa11y-shards/

      - name: Merge pa11y shard results
        if: needs.pa11y.result == 'success'
        run: |
          python3 - <<'PY'
          import json, glob

          def load_report(path):
              """pa11y-ci --reporter json occasionally writes trailing
              stdout after its JSON object (a deprecation note, a second
              flush), producing a file json.load rejects with
              'Extra data'. Decode the first complete JSON object and
              ignore any trailing bytes."""
              text = open(path, encoding="utf-8").read()
              try:
                  return json.loads(text)
              except json.JSONDecodeError:
                  obj, _ = json.JSONDecoder().raw_decode(text.lstrip())
                  return obj

          merged = {"total": 0, "passes": 0, "errors": 0, "results": {}}
          def absorb(path):
              d = load_report(path)
              merged["total"]  += d.get("total", 0)
              merged["passes"] += d.get("passes", 0)
              merged["errors"] += d.get("errors", 0)
              for k, v in d.get("results", {}).items():
                  merged["results"][k] = v

          for path in sorted(glob.glob("pa11y-shards/pa11y.shard.json")) + \
                      sorted(glob.glob("pa11y-shards/pa11y.shard.*.json")):
              absorb(path)
          # download-artifact with merge-multiple may consolidate into one
          # file per shard at the same name — handle both layouts.
          if not merged["total"]:
              for path in sorted(glob.glob("pa11y-shards/**/pa11y.shard.json", recursive=True)):
                  absorb(path)
          with open("pa11y.json", "w") as f:
              json.dump(merged, f)
          print(f"merged: {merged['total']} URLs, {merged['errors']} errors")
          if merged["errors"] > 0:
              raise SystemExit("pa11y errors remain after merge")
          PY

      - name: Post — update pa11y cache for next run
        if: needs.pa11y.result == 'success'
        run: |
          python3 scripts/seo_and_audit/pa11y_cache.py post \
            --public-dir public \
            --cache _data/pa11y-cache.json \
            --manifest .pa11y-cache-manifest.json

      - name: Save pa11y hash cache
        if: needs.pa11y.result == 'success' || needs.pa11y.result == 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _data/pa11y-cache.json
          key: pa11y-cache-v1-${{ runner.os }}-${{ github.run_id }}

      - name: Run Lighthouse CI
        # lhci starts the gzip+cache fixture server itself via
        # collect.startServerCommand (.github/ci-tools/lighthouse/serve.js),
        # so scores reflect Cloudflare's compressed, long-cached delivery.
        run: lhci autorun
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

      - name: Attest SBOM build provenance
        # SLSA build-provenance attestation for the deployed SBOM (main only).
        # Verifiable with: gh attestation verify public/sbom.cdx.json \
        #   --repo sebastienrousseau/sebastienrousseau.github.io
        # ADR-0004 / improvement-plan Phase 2.2.
        if: github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: public/sbom.cdx.json

      - name: Prepare CNAME and .nojekyll
        if: github.ref == 'refs/heads/main'
        run: |
          printf 'sebastienrousseau.com\nwww.sebastienrousseau.com\n' > public/CNAME
          touch public/.nojekyll

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        # include-hidden-files is REQUIRED. upload-pages-artifact tars the
        # directory with `--exclude=.[^/]*` unless this is set, which silently
        # dropped public/.well-known/ from every deploy: /.well-known/
        # security.txt (RFC 9116 canonical location), ai.txt (advertised by
        # robots.txt AND llms.txt), openpgpkey/ (WKD key discovery) and
        # openapi.json all served 404 in production while being present in the
        # build. The `verify-deploy` job below asserts they resolve, so this
        # cannot regress silently again.
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: public
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - name: Verify the deployed origin
        # Every other gate runs against public/ on the runner. This is the
        # only check that looks at what a browser actually receives, which is
        # the gap that hid the .well-known/ deploy loss for months: the files
        # were in the build output and 404 in production. Asserts that every
        # path robots.txt and llms.txt advertise resolves, that the home page
        # carries a real meta description, and that neither CSP channel
        # allows 'unsafe-inline'.
        #
        # Runs against the Pages origin, not the Cloudflare hostname: the
        # edge caches HTML, so checking the public hostname immediately after
        # a deploy tests the previous release. --skip-csp for the same
        # reason — the security headers are Cloudflare Transform Rules and
        # are not present on the origin.
        if: github.ref == 'refs/heads/main'
        run: |
          python3 scripts/seo_and_audit/verify_deploy.py \
            --base "${{ steps.deployment.outputs.page_url }}" \
            --skip-csp
