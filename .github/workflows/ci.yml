name: build-audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (cached)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-ssg

      - name: Add cargo bin to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Static Site Generator (ssg)
        run: |
          if ! command -v ssg >/dev/null 2>&1; then
            cargo install ssg --locked
          fi

      - name: Install wasm-pack + wasm32 target
        run: |
          rustup target add wasm32-unknown-unknown
          if ! command -v wasm-pack >/dev/null 2>&1; then
            curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dev tooling
        run: |
          pip install --quiet 'ruff==0.15.*' pytest
          pip install --quiet -r requirements.txt

      - name: Lint (ruff)
        run: ruff check scripts/ tests/

      - name: Naming conventions check
        run: python3 scripts/dev/check_naming_conventions.py

      - name: Cyclomatic complexity (radon)
        run: |
          pip install --quiet radon
          radon cc scripts/postbuild/postbuild.py scripts/postbuild/postbuild_lib/ -a -s
          c_or_worse=$(radon cc scripts/postbuild/postbuild.py scripts/postbuild/postbuild_lib/ -n C -s 2>&1)
          if [ -n "$c_or_worse" ]; then
            echo "::error::C-grade or worse complexity found:"
            echo "$c_or_worse"
            exit 1
          fi

      - name: Code duplication (jscpd)
        run: |
          npx --yes jscpd@4 scripts/ tests/ _layouts/ \
            --min-tokens 50 \
            --threshold 3 \
            --reporters console \
            --silent

      - name: Unit tests (pytest)
        run: pytest tests/unit/ -ra

      - name: Coverage gate (postbuild_lib must stay at 100 %)
        run: |
          pip install --quiet pytest-cov
          pytest tests/unit/ --cov=scripts/postbuild/postbuild_lib --cov-fail-under=100 -q

      - name: Build site
        run: ./build.sh

      - name: Internal-link audit
        run: python3 scripts/seo_and_audit/audit_links.py --base-dir public --strict-internal

      - name: JSON-LD + feed validation
        run: python3 scripts/seo_and_audit/validate_jsonld.py --base-dir public

      - name: Upload built artefact
        uses: actions/upload-artifact@v4
        with:
          name: public
          path: public/

  accessibility:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: public
          path: public
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install pa11y-ci
        run: npm install -g pa11y-ci@^3

      - name: Restore pa11y hash cache
        id: pa11y-cache
        uses: actions/cache@v4
        with:
          path: _data/pa11y-cache.json
          key: pa11y-cache-v1-${{ runner.os }}
          restore-keys: |
            pa11y-cache-v1-

      - name: Serve public/
        run: |
          npx http-server public -p 8000 --silent &
          sleep 2

      - name: Pre — partition pages against cache
        run: |
          python3 scripts/seo_and_audit/pa11y_cache.py pre \
            --public-dir public \
            --cache _data/pa11y-cache.json \
            --pa11yci-out .pa11yci \
            --manifest-out .pa11y-cache-manifest.json \
            --base-url http://127.0.0.1:8000

      - name: Run pa11y-ci on the delta only
        run: |
          n=$(python3 -c "import json; print(len(json.load(open('.pa11yci'))['urls']))")
          if [ "$n" -eq 0 ]; then
            echo "pa11y-cache: full cache hit, skipping pa11y-ci run"
            exit 0
          fi
          set +e
          pa11y-ci -c .pa11yci --reporter json > pa11y.json
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          python3 scripts/seo_and_audit/pa11y_retry_flakes.py pa11y.json

      - name: Post — update cache for next run
        if: success()
        run: |
          python3 scripts/seo_and_audit/pa11y_cache.py post \
            --public-dir public \
            --cache _data/pa11y-cache.json \
            --manifest .pa11y-cache-manifest.json

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: public
          path: public
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI
        run: lhci autorun
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

  deploy:
    needs: [build, accessibility, lighthouse]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download build artefact
        uses: actions/download-artifact@v4
        with:
          name: public
          path: public

      - name: Prepare CNAME and .nojekyll
        run: |
          printf 'sebastienrousseau.com\nwww.sebastienrousseau.com\n' > public/CNAME
          touch public/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
