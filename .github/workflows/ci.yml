name: build-audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-audit-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # The `github-pages` environment has "Deployment branches: main only"
    # protection. Applying it to the whole job blocks every PR run at the
    # 2-second mark before any step executes. Bind it only when this run
    # is actually going to deploy (main push) so PRs can still get a real
    # build / lint / test / Lighthouse / pa11y signal.
    environment: ${{ github.ref == 'refs/heads/main' && 'github-pages' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (cached)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-ssg

      - name: Add cargo bin to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Static Site Generator (ssg)
        run: |
          if ! command -v ssg >/dev/null 2>&1; then
            cargo install ssg --locked
          fi

      - name: Install wasm-pack + wasm32 target
        run: |
          rustup target add wasm32-unknown-unknown
          if ! command -v wasm-pack >/dev/null 2>&1; then
            curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dev tooling
        run: |
          pip install --quiet 'ruff==0.15.*' pytest radon pytest-cov
          pip install --quiet -r requirements.txt

      - name: Vulnerability scan (pip-audit)
        # Audit the runtime deps in requirements.txt against the OSV / PyPI
        # advisory database. Fails the build on any non-deferred advisory;
        # use `pip-audit --ignore-vuln <id>` in this step's body to defer
        # with a comment justifying the deferral.
        run: |
          pip install --quiet pip-audit
          pip-audit --strict -r requirements.txt

      - name: Lint (ruff)
        run: ruff check scripts/ tests/

      - name: Naming conventions check
        run: python3 scripts/dev/check_naming_conventions.py

      - name: Cyclomatic complexity (radon)
        run: |
          radon cc scripts/postbuild/postbuild.py scripts/postbuild/postbuild_lib/ scripts/generators/build_translations/ -a -s
          c_or_worse=$(radon cc scripts/postbuild/postbuild.py scripts/postbuild/postbuild_lib/ scripts/generators/build_translations/ -n C -s 2>&1)
          if [ -n "$c_or_worse" ]; then
            echo "::error::C-grade or worse complexity found:"
            echo "$c_or_worse"
            exit 1
          fi

      - name: Code duplication (jscpd)
        run: |
          npx --yes jscpd@4 scripts/ tests/ _layouts/ \
            --min-tokens 50 \
            --threshold 3 \
            --reporters console \
            --silent

      - name: Unit tests (pytest)
        run: pytest tests/unit/ -ra

      - name: Coverage gate (postbuild_lib + build_translations must stay at 100 %)
        run: |
          pytest tests/unit/ \
            --cov=scripts/postbuild/postbuild_lib \
            --cov=scripts/generators/build_translations \
            --cov-fail-under=100 -q

      - name: Build site
        run: ./build.sh

      - name: Post-build smoke tests (pytest)
        # These suites are guarded by SKIP_IF_NO_BUILD and silently skip in
        # the pre-build pytest run. Re-run them now that public/ exists so
        # the build-dependent assertions actually execute in CI. Runs before
        # the link / JSON-LD audits because the translations smoke re-renders
        # locale pages and re-stamps CSP hashes (idempotent on a clean tree).
        run: |
          pytest -ra \
            tests/unit/test_build_output.py \
            tests/unit/test_build_translations_smoke.py \
            tests/unit/test_builder_main_smoke.py \
            tests/unit/test_cli_smoke.py

      - name: Internal-link audit
        run: python3 scripts/seo_and_audit/audit_links.py --base-dir public --strict-internal

      - name: JSON-LD + feed validation
        run: python3 scripts/seo_and_audit/validate_jsonld.py --base-dir public

      - name: Install pa11y-ci & Lighthouse CI
        run: npm install -g pa11y-ci@^3 @lhci/cli@0.14.x

      - name: Restore pa11y hash cache
        id: pa11y-cache
        uses: actions/cache@v4
        with:
          path: _data/pa11y-cache.json
          key: pa11y-cache-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            pa11y-cache-v1-${{ runner.os }}-

      - name: Serve public/
        run: |
          npx http-server public -p 8000 --silent &
          sleep 2

      - name: Pre — partition pages against cache
        run: |
          python3 scripts/seo_and_audit/pa11y_cache.py pre \
            --public-dir public \
            --cache _data/pa11y-cache.json \
            --pa11yci-out .pa11yci \
            --manifest-out .pa11y-cache-manifest.json \
            --base-url http://127.0.0.1:8000

      - name: Run pa11y-ci on the delta only
        run: |
          n=$(python3 -c "import json; print(len(json.load(open('.pa11yci'))['urls']))")
          if [ "$n" -eq 0 ]; then
            echo "pa11y-cache: full cache hit, skipping pa11y-ci run"
            exit 0
          fi
          set +e
          pa11y-ci -c .pa11yci --reporter json > pa11y.json
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          python3 scripts/seo_and_audit/pa11y_retry_flakes.py pa11y.json

      - name: Post — update cache for next run
        if: success()
        run: |
          python3 scripts/seo_and_audit/pa11y_cache.py post \
            --public-dir public \
            --cache _data/pa11y-cache.json \
            --manifest .pa11y-cache-manifest.json

      - name: Run Lighthouse CI
        run: lhci autorun
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

      - name: Prepare CNAME and .nojekyll
        if: github.ref == 'refs/heads/main'
        run: |
          printf 'sebastienrousseau.com\nwww.sebastienrousseau.com\n' > public/CNAME
          touch public/.nojekyll

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
