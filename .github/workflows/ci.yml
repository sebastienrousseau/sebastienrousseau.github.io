name: build-audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (cached)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-ssg

      - name: Install Static Site Generator (ssg)
        run: |
          if ! command -v ssg >/dev/null 2>&1; then
            cargo install ssg --locked
          fi

      - name: Install wasm-pack + wasm32 target
        # build.sh compiles every crate under _wasm-demos/ to WebAssembly
        # and stages the artefacts under public/labs/<crate>/. wasm-pack
        # ships a prebuilt binary so the install is a couple seconds.
        run: |
          rustup target add wasm32-unknown-unknown
          if ! command -v wasm-pack >/dev/null 2>&1; then
            curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        # Node 22 (LTS) is needed for the stable `--test-coverage-{lines,
        # branches,functions}` flags that gate workers/lang-router.js at
        # 100 % during build.sh.
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dev tooling
        # Pin ruff so CI uses the same rule set + complexity bookkeeping
        # as local. Bump deliberately rather than drift with `latest`.
        run: |
          pip install --quiet 'ruff==0.15.*' pytest
          pip install --quiet -r requirements.txt

      - name: Lint (ruff)
        run: ruff check scripts/ tests/

      - name: Cyclomatic complexity (radon)
        # Hard ceiling: every function in postbuild + postbuild_lib must
        # stay at grade B (CC ≤ 10) or lower. ``radon cc -n C`` prints
        # any C-grade-or-worse block; we fail the build if it prints
        # anything.
        run: |
          pip install --quiet radon
          radon cc scripts/postbuild/postbuild.py scripts/postbuild/postbuild_lib/ -a -s
          c_or_worse=$(radon cc scripts/postbuild/postbuild.py scripts/postbuild/postbuild_lib/ -n C -s 2>&1)
          if [ -n "$c_or_worse" ]; then
            echo "::error::C-grade or worse complexity found:"
            echo "$c_or_worse"
            exit 1
          fi

      - name: Code duplication (jscpd)
        # Industry-standard warn threshold is 10 %; we currently sit at
        # ~1.5 %. Fail if duplication crosses 3 % so a regression can't
        # creep in unnoticed.
        run: |
          npx --yes jscpd@4 scripts/ tests/ _layouts/ \
            --min-tokens 50 \
            --threshold 3 \
            --reporters console \
            --silent

      - name: Unit tests (pytest)
        run: pytest tests/ -ra

      - name: Coverage gate (postbuild_lib must stay at 100 %)
        # Hard ceiling: every line in scripts/postbuild/postbuild_lib/ has a unit
        # test. The gate fails the build if anyone lands code under that
        # tree without matching coverage.
        run: |
          pip install --quiet pytest-cov
          pytest tests/ --cov=scripts/postbuild/postbuild_lib --cov-fail-under=100 -q

      - name: Build site
        run: ./build.sh

      - name: Internal-link audit
        run: python3 scripts/seo_and_audit/audit_links.py --base-dir public --strict-internal

      - name: JSON-LD + feed validation
        run: python3 scripts/seo_and_audit/validate_jsonld.py --base-dir public

      - name: Upload built artefact
        uses: actions/upload-artifact@v4
        with:
          name: public
          path: public/

  accessibility:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: public
          path: public
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pa11y-ci
        run: npm install -g pa11y-ci@^3

      - name: Restore pa11y hash cache
        id: pa11y-cache
        uses: actions/cache@v4
        with:
          # Keyed only by the cache schema major. Within a key the
          # cache layer carries its own fingerprint (pa11y/Chromium
          # versions + config hash) so a mismatch already forces a
          # full re-sweep without needing a separate cache bucket.
          path: _data/pa11y-cache.json
          key: pa11y-cache-v1-${{ runner.os }}
          # Restore-keys lets a fresh runner pick up the most recent
          # cache even if the exact key isn't a hit (e.g. after a
          # cache-eviction window).
          restore-keys: |
            pa11y-cache-v1-

      - name: Serve public/
        run: |
          npx http-server public -p 8000 --silent &
          sleep 2

      - name: Pre — partition pages against cache
        run: |
          python3 scripts/seo_and_audit/pa11y_cache.py pre \
            --public-dir public \
            --cache _data/pa11y-cache.json \
            --pa11yci-out .pa11yci \
            --manifest-out .pa11y-cache-manifest.json \
            --base-url http://127.0.0.1:8000

      - name: Run pa11y-ci on the delta only
        run: |
          # If .pa11yci has an empty URL list (full cache hit), skip
          # pa11y entirely — it errors on an empty config.
          n=$(python3 -c "import json; print(len(json.load(open('.pa11yci'))['urls']))")
          if [ "$n" -eq 0 ]; then
            echo "pa11y-cache: full cache hit, skipping pa11y-ci run"
            exit 0
          fi
          pa11y-ci -c .pa11yci || (echo "pa11y violations above"; exit 1)

      - name: Post — update cache for next run
        if: success()
        run: |
          python3 scripts/seo_and_audit/pa11y_cache.py post \
            --public-dir public \
            --cache _data/pa11y-cache.json \
            --manifest .pa11y-cache-manifest.json

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: public
          path: public
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@^0.13

      - name: Run Lighthouse CI
        run: lhci autorun
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
