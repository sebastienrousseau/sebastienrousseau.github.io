name: publish-daily

# Run every day at 06:30 UTC. That's pre-business in London, mid-day
# in Mumbai, mid-afternoon in Tokyo, and warms every Cloudflare POP
# well before US-East/West readers arrive — see doc/daily-publishing.md
# for the rationale.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          pip install --quiet -r requirements.txt
          pip install --quiet anthropic

      - name: Install SSG + wasm-pack (cached via apt)
        run: |
          cargo install --quiet shokunin || true
          cargo install --quiet wasm-pack || true

      - name: Run publish_daily.sh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PUBLISH_DATE: ${{ github.event.inputs.date || '' }}
        run: |
          ./scripts/publish_daily.sh

      - name: Commit + push (signed)
        env:
          GIT_AUTHOR_NAME: sebastienrousseau-bot
          GIT_AUTHOR_EMAIL: bot@sebastienrousseau.com
          GIT_COMMITTER_NAME: sebastienrousseau-bot
          GIT_COMMITTER_EMAIL: bot@sebastienrousseau.com
        run: |
          set -euo pipefail
          today=$(date -u +%F)
          slug=$(find _drafts _posts -maxdepth 1 -type f -name "${today}-*.md" | head -1 | xargs -I{} basename {} .md)
          if [[ -z "$slug" ]]; then
            echo "no article for $today — nothing to commit"
            exit 0
          fi
          if git diff --quiet --cached && git diff --quiet; then
            echo "no changes to commit — pipeline ran clean (article already published)"
            exit 0
          fi
          git add -A
          # Pull a one-line headline from the article to make the
          # commit message human-readable.
          title=$(grep -oE '^title: *"[^"]+"' "_posts/${slug}.md" | head -1 | sed 's/title: *"//;s/"$//' | head -c 80)
          git commit -S -m "content: ${today} — ${title} + 27 translations" -m "Auto-published by .github/workflows/publish-daily.yml"
          git push origin HEAD:main
