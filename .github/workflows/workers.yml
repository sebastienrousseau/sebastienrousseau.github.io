#
# Runs the Cloudflare Worker test suites (workers/test_*.mjs).
#
# These suites were only ever run by hand: no workflow invoked them, so a
# Worker change could merge with its tests failing. They are hermetic
# (globalThis.fetch is stubbed) and need nothing but Node, so this job is
# cheap. Kept out of ci.yml so it can land without touching the main
# pipeline.
name: workers

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
      - name: All Worker suites
        run: node --test workers/test_*.mjs
      - name: Clock routes at 100% coverage
        run: |
          node --test --experimental-test-coverage \
            --test-coverage-include='workers/clock.js' \
            --test-coverage-include='workers/profile-clock.js' \
            --test-coverage-functions=100 --test-coverage-lines=100 \
            --test-coverage-branches=100 \
            workers/test_clock.mjs workers/test_profile_clock.mjs
