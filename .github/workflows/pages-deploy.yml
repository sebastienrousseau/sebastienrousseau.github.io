name: pages-deploy

# GitHub Pages is configured with `build_type: workflow`, which means it
# *only* deploys when a workflow uploads a Pages artefact via
# `actions/upload-pages-artifact` and finalises the deploy with
# `actions/deploy-pages`. The legacy auto-deploy from `main/docs` is
# disabled in that mode, so without this file pushes to main never reach
# production.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One concurrent deploy at a time; cancel in-flight if a newer push lands.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (cached)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-ssg

      - name: Install Static Site Generator (ssg)
        run: |
          if ! command -v ssg >/dev/null 2>&1; then
            cargo install ssg --locked
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        run: ./build.sh

      # Ship CNAME + .nojekyll alongside the build so Pages serves the
      # custom domain and doesn't try to run Jekyll across the output.
      - name: Prepare deploy directory
        run: |
          printf 'sebastienrousseau.com\nwww.sebastienrousseau.com\n' > public/CNAME
          touch public/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
