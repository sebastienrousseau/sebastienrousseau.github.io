name: Backup

# Plan F-9. A full git bundle of this repository (every branch and tag),
# weekly and on every release tag, uploaded as a release asset to the
# private repository sebastienrousseau/sebastienrousseau.github.io-backup.
# The last 12 bundles are kept. Restore: docs/runbook-restore.md.
#
# Needs the secret BACKUP_TOKEN: a fine-grained token with contents:write
# on the backup repository only. Without it the job says so and exits 0.

on:
  schedule:
    - cron: "41 4 * * 1"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Bundle and upload
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BACKUP_REPO: sebastienrousseau/sebastienrousseau.github.io-backup
      KEEP: "12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bundle every ref
        run: |
          git fetch --tags --force origin '+refs/heads/*:refs/remotes/origin/*'
          name="site-$(date -u +%F)-$(git rev-parse --short HEAD).bundle"
          git bundle create "$name" --all
          git bundle verify "$name"
          sha256sum "$name" > "$name.sha256"
          echo "BUNDLE=$name" >> "$GITHUB_ENV"

      - name: Upload to the backup repository
        env:
          GH_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::notice::BACKUP_TOKEN is not set; bundle built and verified, not uploaded"
            exit 0
          fi
          tag="backup-${BUNDLE%.bundle}"
          gh release create "$tag" "$BUNDLE" "$BUNDLE.sha256" -R "$BACKUP_REPO" \
            --title "$tag" --notes "git bundle of ${GITHUB_REPOSITORY} at ${GITHUB_SHA}"
          gh release list -R "$BACKUP_REPO" --limit 200 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .['"$KEEP"':] | .[].tagName' |
            while read -r old; do gh release delete "$old" -R "$BACKUP_REPO" --yes --cleanup-tag; done
