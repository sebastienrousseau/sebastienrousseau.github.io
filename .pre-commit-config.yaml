# pre-commit framework config to catch quality/validation failures locally.
# Install pre-commit tool: pip install pre-commit
# Register git hooks: pre-commit install
exclude: ^(docs|public|jscpd-report)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        # Keep Markdown hard line breaks (two trailing spaces): FAQ
        # questions use them to put the answer on its own line.
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Same version as requirements-dev.lock (ADR-0002), so the hook and
    # CI agree on formatting. Python only, as in CI: newer ruff also
    # formats code blocks in Markdown, which would rewrite article samples.
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [ --fix ]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: local
    hooks:
      - id: check-naming-conventions
        name: Check Naming Conventions
        entry: python3 scripts/dev/check_naming_conventions.py
        language: system
        pass_filenames: false
        always_run: true

      - id: automate-tags
        name: Automate and Optimize Tags
        entry: python3 scripts/editorial/automate_tags.py
        language: system
        pass_filenames: false
        always_run: true
      - id: check-added-ds-store
        name: Reject .DS_Store
        entry: bash -c 'if git diff --cached --name-only | grep -q "\\.DS_Store$"; then echo "refusing to commit .DS_Store"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true
