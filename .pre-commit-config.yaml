# pre-commit framework config to catch quality/validation failures locally.
# Install pre-commit tool: pip install pre-commit
# Register git hooks: pre-commit install
exclude: ^(docs|public|jscpd-report)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: local
    hooks:
      - id: check-naming-conventions
        name: Check Naming Conventions
        entry: python3 scripts/dev/check_naming_conventions.py
        language: system
        pass_filenames: false
        always_run: true
