# Speaking kit data — single source of truth for the /speaking/ page,
# downloadable media kit PDF, and the JSON-LD Event entries that hang off
# the global Person graph.
#
# Add a new talk → drop a YAML entry under `talks`. Add a new topic →
# drop it under `topics`. The page rebuilds from this file every time.

bio:
  short: >
    Sebastien Rousseau is a senior banking technologist who writes and
    builds at the edge of payments, post-quantum cryptography, and
    applied AI. Author of open-source libraries used in financial
    infrastructure; contributor to the Emerging Payments Association
    Asia Quantum-Safe Cryptography Working Group.

  medium: >
    Sebastien Rousseau is a senior banking technologist with 20+ years
    across HSBC Commercial & Investment Bank, PayPal, Barclays, Shazam,
    AKQA, and Virgin Group. He authors open-source Python and Rust
    libraries that turn ISO 20022 migration, post-quantum cryptography,
    and applied AI from policy paper into inspectable code. He
    contributes to the Emerging Payments Association Asia Quantum-Safe
    Cryptography Working Group and publishes Banking On Quantum and
    Banking On AI at sebastienrousseau.com.

  long: >
    Sebastien Rousseau is a senior banking technologist focused on the
    structural transformation of wholesale payments. Across HSBC
    Commercial & Investment Bank, PayPal, Barclays, Shazam, AKQA, and
    Virgin Group, he has shipped payment platforms, AI products, and
    open-source infrastructure used in production by treasury and
    payments teams. He authors and maintains pacs008, pain001,
    BankStatementParser, KyberLib, CloudCDN, and dotfiles — each
    positioned as a "reference implementation, not a demo" for
    inspectable, board-grade financial infrastructure. He is a
    contributor to the Emerging Payments Association Asia Quantum-Safe
    Cryptography Working Group, co-author of the EPAA white paper
    "Quantum-Safe Payments: Why the Payments Industry Must Act Now"
    (September 2025), and publishes Banking On Quantum and Banking On
    AI. He sits at the intersection of agentic AI, real-time payments,
    post-quantum cryptography, cloud-native resilience, structured
    data, and regulatory evidence.

# Speaking topics — framed as audience outcomes, not feature lists.
topics:
  - title: "Post-Quantum Migration for Payments: From FIPS 203 to Inspectable Code"
    summary: >
      What the November 2026 SWIFT cutover, FIPS 203, and harvest-now-
      decrypt-later mean for a Tier-1 payments stack — and how to turn
      the migration into a measurable, board-grade engineering programme.
    audience: "Board / CISO / Head of Payments"

  - title: "ISO 20022 in Practice: pacs.008, pain.001, and the Structured-Address Cliff"
    summary: >
      A field guide to building production-grade ISO 20022 automation:
      structured-address compliance, BAH head.001 wrapping, BIC/IBAN/LEI
      checksums, and OpenTelemetry UETR tracing.
    audience: "Payments Architects / Treasury Engineering Leads"

  - title: "Open Source as Financial Infrastructure"
    summary: >
      Why open-source reference implementations beat proprietary black
      boxes for security, compliance, and supplier risk under DORA — and
      how to govern them inside a regulated institution.
    audience: "Heads of Engineering / Procurement / Risk"

  - title: "Harvest-Now-Decrypt-Later: The Board-Level Case for Quantum-Safe Payments"
    summary: >
      Translating cryptographic agility from a project paper into a
      board-level operational-resilience commitment — using the EPAA
      framework, NIST PQC standards, and a concrete migration roadmap.
    audience: "Board / Executive Committee / Group CRO"

  - title: "Agentic AI in Banking: From Demo to Auditable Workflow"
    summary: >
      The five-component control plane that turns autonomous workflows
      into SR 11-7 / SS1/23 supervisory-ready evidence — OAuth-scoped
      service accounts, deterministic semantic routing, OPA policy
      gates, immutable WORM audit logs, and a tested kill switch.
    audience: "CTO / Head of AI / Model Risk Management"

