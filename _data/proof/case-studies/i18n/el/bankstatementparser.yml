title: BankStatementParser — ενιαία ευφυΐα συναλλαγών για τη διαχείριση διαθεσίμων
banner_alt: Σύγχρονο γραφείο χρηματοοικονομικών τη νύχτα — συμβολίζει την ενιαία ευφυΐα συναλλαγών σε
  μορφές κίνησης λογαριασμού CAMT, MT940, OFX και CSV
sector: Ανοικτός κώδικας · Εταιρική διαχείριση διαθεσίμων · Συγκέντρωση δεδομένων κινδύνου
role: Συγγραφέας και συντηρητής
status: Σε παραγωγή, ενεργά συντηρούμενο
outcome_highlights:
- value: 6 μορφές
  label: CAMT (.052/.053/.054), MT940, OFX, CSV, OCR PDF
- value: Ανά πεδίο
  label: 'Προέλευση: καταγράφονται μορφή πηγής και έκδοση αναλυτή'
- label: Ευθυγραμμισμένο με τη συγκέντρωση δεδομένων κινδύνου
- label: Ελεύθερο για χρήση, fork και έλεγχο
pull_quote: «Αναλυτές CAMT / MT940 / PAIN επικυρωμένοι με σχήμα, εφεδρικό OCR για σαρωμένα PDF, ντετερμινιστική
  αντιστοίχιση πεδίων, τεκμήρια ελέγχου επιπέδου SR 11-7 — κάθε βήμα μετασχηματισμού καταγράφεται και
  αναπαράγεται.»
problem: Οι εταιρικές ομάδες διαχείρισης διαθεσίμων λαμβάνουν κινήσεις λογαριασμού σε CAMT, PAIN.001,
  MT940, OFX, CSV και σαρωμένα PDF από δεκάδες τράπεζες. Κάθε μορφή φέρει διαφορετική σημασιολογία πεδίων,
  κωδικοποιήσεις και ασάφειες. Οι περισσότερες ομάδες φτιάχνουν εύθραυστους αναλυτές ανά τράπεζα, μπλοκάροντας
  την πρόβλεψη ταμειακών ροών σε πραγματικό χρόνο, τον εντοπισμό απάτης και τη συμφωνία που αντέχει σε
  έλεγχο.
what_i_built: Μια εργαλειοθήκη Python ανοικτού κώδικα που ενοποιεί κάθε συνήθη μορφή κίνησης λογαριασμού
  σε μία κανονικοποιημένη ροή συναλλαγών. Αναλυτές CAMT / MT940 / PAIN επικυρωμένοι με σχήμα, εφεδρικό
  OCR για σαρωμένα PDF, ντετερμινιστική αντιστοίχιση πεδίων και τεκμήρια ελέγχου επιπέδου SR 11-7 για
  κάθε βήμα μετασχηματισμού.
