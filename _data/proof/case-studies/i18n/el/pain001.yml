title: pain001 — αυτοματοποίηση αρχείων πληρωμών ISO 20022
banner_alt: Αεροφωτογραφία πόλης στο σούρουπο — συμβολίζει την αυτοματοποίηση δομημένων αρχείων πληρωμών
  κατά ISO 20022 στα παγκόσμια δίκτυα εκκαθάρισης
sector: Ανοικτός κώδικας · Εταιρική διαχείριση διαθεσίμων · ISO 20022
role: Συγγραφέας και συντηρητής
status: Σε παραγωγή, ενεργά συντηρούμενο
outcome_highlights:
- label: Customer Credit Transfer Initiation
- value: Επικυρωμένο με XSD
  label: Προέλεγχος σε κάθε μήνυμα
- label: Αθροίσματα ελέγχου ISO 7064 Modulo 97-10
- label: Ελεύθερο για χρήση, fork και έλεγχο
pull_quote: «Αναφέρεται στη λευκή βίβλο EPAA Quantum-Safe Payments (Σεπτέμβριος 2025). Ανοικτού κώδικα,
  ελεγμένο από την πρώτη μέρα — κανένας ιδιόκτητος μεταφραστής ανάμεσα στο ERP σας και το δίκτυο εκκαθάρισης.»
problem: Η παγκόσμια μετάβαση MT → MX υποχρεώνει κάθε τράπεζα και κάθε εταιρικό τμήμα διαθεσίμων να παράγει
  δομημένα μηνύματα pain.001. Οι περισσότερες ομάδες είτε γράφουν εύθραυστο XML στο χέρι είτε αγοράζουν
  αδιαφανείς ιδιόκτητους μεταφραστές. Και οι δύο δρόμοι στέλνουν σφάλματα πληρωμών στα δίκτυα εκκαθάρισης
  και δεν αφήνουν καμία διαδρομή ελέγχου.
what_i_built: Μια βιβλιοθήκη Python ανοικτού κώδικα που παράγει επικυρωμένα μηνύματα ISO 20022 pain.001
  (Customer Credit Transfer Initiation) από CSV / SQLite / Parquet. Προέλεγχος επικύρωσης XSD, αθροίσματα
  ελέγχου IBAN / BIC, απόκρυψη προσωπικών δεδομένων και πλήρης συμμόρφωση με το σχήμα XSD — όλα μέσα σε
  μια ροή Python που εντάσσεται στις υπάρχουσες γραμμές ERP και διαχείρισης διαθεσίμων.
rigour:
- metric: Υποστηριζόμενα μηνύματα ISO 20022
- metric: Συμμόρφωση με το σχήμα
  value: Επίσημος προέλεγχος επικύρωσης XSD σε κάθε μήνυμα
- metric: Επικυρωτές που παρέχονται
  value: Ψηφίο ελέγχου IBAN + άθροισμα ελέγχου BIC + LEI (ISO 7064 Modulo 97-10)
- metric: Άδεια
  value: Apache-2.0 / MIT — ελεύθερο για χρήση, fork και έλεγχο
validation:
- Αναφέρεται στη λευκή βίβλο EPAA Quantum-Safe Payments (Σεπτέμβριος 2025)
- Παρουσιάζεται σε άρθρα που δημοσιεύονται στο sebastienrousseau.com από τον 09/2023
