title: KyberLib — ML-KEM παραγωγικού επιπέδου σε Rust
banner_alt: Κβαντικά ασφαλής ανταλλαγή κρυπτογραφικών κλειδιών — συμβολίζει τη μετάβαση σε ML-KEM κατά
  FIPS 203 στον τραπεζικό τομέα
sector: Ανοικτός κώδικας · Τραπεζική · Πρότυπα
role: Συγγραφέας και συντηρητής
status: Σε παραγωγή, ενεργά συντηρούμενο
outcome_highlights:
- label: Ευθυγραμμισμένο με τη σειρά δημοσιεύσεων του NIST
- value: Κορυφαίο 44 %
  label: Από ~182 βιβλιοθήκες PQC (Qtonic Lab)
- label: Ενσωματώνεται σε HSM και ασφαλείς θύλακες
- value: 1 υιοθέτηση
  label: QGram (Quantum2pi), μεταπκβαντικός αγγελιοφόρος
pull_quote: «Αξιολογήθηκε από το Qtonic Quantum Lab — ανεξάρτητο μητρώο μετακβαντικής κρυπτογραφίας —
  και υιοθετήθηκε από το QGram (Quantum2pi) για μηνύματα με κρυπτογράφηση από άκρο σε άκρο. Και τα δύο
  επαληθεύονται χωρίς να περάσετε από εμένα.»
problem: Οι τράπεζες αντιμετωπίζουν τη μετάβαση της SWIFT σε δομημένες διευθύνσεις στις 14 Νοεμβρίου 2026
  και ένα μακρύτερο παράθυρο μετακβαντικής μετάβασης κατά NIST. Οι υπάρχουσες υλοποιήσεις PQC κυκλοφορούν
  ως κείμενα πολιτικής, εργαστηριακός κώδικας ή ιδιόκτητα μαύρα κουτιά HSM — κανένα από τα οποία δεν μπορεί
  ένας αρχιτέκτονας πληρωμών να διαβάσει, να δοκιμάσει ή να υπογράψει.
what_i_built: Το KyberLib μετατρέπει το ML-KEM κατά FIPS 203 (CRYSTALS-Kyber) σε Rust που ελέγχεται. Υβριδικές
  χειραψίες κλασικού και κβαντικού, μεταγλώττιση no_std για ενσωμάτωση σε HSM, όρια αφαίρεσης με κρυπτογραφική
  ευελιξία, και τα τεκμήρια διακυβέρνησης κατά το άρθρο 5 του DORA που χρειάζονται πλέον τα συμβούλια
  για να στηρίξουν τη μετάβαση σε PQC χωρίς να αναλάβουν αδιαφανή κίνδυνο προμηθευτή.
rigour:
- metric: Πρότυπο
- metric: Υβριδική λειτουργία
  value: Κλασικό TLS + ML-KEM-768 σε λειτουργία X25519MLKEM768
- metric: Ενσωμάτωση
  value: no_std — ενσωματώνεται σε HSM, ασφαλείς θύλακες και ενσωματωμένους στόχους
- metric: Κρυπτογραφική ευελιξία
  value: Τα όρια αφαίρεσης επιτρέπουν αλλαγή αλγορίθμου χωρίς αλλαγή API
- metric: Άδεια
validation:
- Αναφέρεται στη λευκή βίβλο EPAA Quantum-Safe Payments (Σεπτέμβριος 2025)
- 'Παρουσιάζεται στο άρθρο της 12/06/2026: KyberLib and the Post-Quantum Banking Migration'
- Ευθυγραμμισμένο με τη σειρά δημοσιεύσεων NIST FIPS 203 / 204 / 205
- Αξιολογήθηκε από το Qtonic Quantum Lab — ανεξάρτητο μητρώο αξιολόγησης μετακβαντικής κρυπτογραφίας,
  ~182 βιβλιοθήκες PQC αξιολογήθηκαν (κορυφαίο 44 %, χωρίς πληρωμή για συμπερίληψη)
- Υιοθετήθηκε από το QGram (Quantum2pi) — μετακβαντικός αγγελιοφόρος από άκρο σε άκρο και από ομότιμο
  σε ομότιμο που χρησιμοποιεί το KyberLib για την κρυπτογράφηση μηνυμάτων (επαληθεύσιμο στο f6s.com/software/qgram)
