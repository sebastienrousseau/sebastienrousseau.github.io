title: CloudCDN — σχέδιο ανοικτού κώδικα για το άκρο με γνώμονα την ΤΝ
banner_alt: Υποδομή άκρου με γνώμονα την ΤΝ — συμβολίζει την πύλη MCP μηδενικής εμπιστοσύνης, τον ατομικό
  περιορισμό ρυθμού με Durable Objects και την περίμετρο WebAuthn με κλειδιά πρόσβασης που παρέχει το
  CloudCDN ως υλοποίηση αναφοράς
sector: Ανοικτός κώδικας · Άκρο · Υποδομή ΤΝ
role: Συγγραφέας και συντηρητής
status: Σε παραγωγή, ενεργά συντηρούμενο
outcome_highlights:
- value: 3.185 δοκιμές
  label: 100 % κάλυψη γραμμών, διακλαδώσεων και συναρτήσεων
- label: Προέλευση κατασκευής + υπογραφή Sigstore
- value: 42 εργαλεία MCP
  label: Κάθε κλήση καταγράφεται με δομημένα τεκμήρια
- label: Αντιστοιχισμένο στο άρθρο 5 και στη συγκέντρωση δεδομένων κινδύνου
pull_quote: «Μια υλοποίηση αναφοράς ανοικτού κώδικα που μια ομάδα ασφάλειας μπορεί να διαβάσει, να κάνει
  fork και να υπογράψει — αντί για ένα διαφημιστικό PDF. Ατομικός περιορισμός ρυθμού με Durable Objects,
  περίμετρος WebAuthn, προέλευση SLSA L3.»
problem: Καθώς οι πράκτορες ΤΝ και τα εργαλεία MCP αρχίζουν να καλούν API στο άκρο σε μεγάλη κλίμακα,
  οι τράπεζες χρειάζονται μια περίμετρο που αντέχει την αυτόνομη κίνηση χωρίς να θυσιάζει τα τεκμήρια
  ελέγχου επιπέδου DORA. Τα υπάρχοντα CDN προσφέρουν είτε διαφημιστική γλώσσα είτε αδιαφανή πλάνα — κανένα
  δεν παράγει την υλοποίηση αναφοράς που μια ομάδα ασφάλειας μπορεί να διαβάσει, να κάνει fork και να
  υπογράψει.
what_i_built: Μια πύλη MCP μηδενικής εμπιστοσύνης, ανοικτού κώδικα, με 42 εργαλεία, ατομικό περιορισμό
  ρυθμού με Durable Objects, περίμετρο WebAuthn με κλειδιά πρόσβασης, υπογεγραμμένες διευθύνσεις URL και
  προέλευση κατασκευής SLSA επιπέδου 3. 3.185 δοκιμές με 100 % κάλυψη, αντιστοιχισμένες στο άρθρο 5 του
  DORA, στη συγκέντρωση δεδομένων κινδύνου κατά BCBS 239 και στο κεφάλαιο λειτουργικού κινδύνου κατά Βασιλεία
  III.
rigour:
- metric: Κάλυψη δοκιμών
  value: 3.185 δοκιμές με 100 % κάλυψη γραμμών, διακλαδώσεων και συναρτήσεων
- metric: Ακεραιότητα εφοδιαστικής αλυσίδας
  value: Προέλευση κατασκευής SLSA επιπέδου 3 + υπογραφή Sigstore
- metric: Επιφάνεια MCP
  value: 42 εργαλεία — κάθε κλήση καταγράφεται με δομημένα τεκμήρια
- metric: Περιορισμός ρυθμού
  value: Ατομικά Durable Objects (χωρίς συνθήκες ανταγωνισμού, χωρίς διπλές μετρήσεις)
- metric: Έλεγχος πρόσβασης
  value: Κλειδιά πρόσβασης WebAuthn + υπογεγραμμένες διευθύνσεις URL
- metric: Άδεια
validation:
- 'Παρουσιάζεται στο άρθρο της 11/06/2026: CloudCDN — An Open-Source Blueprint for the AI-Native Edge'
- Αντιστοιχισμένο στο άρθρο 5 του DORA, στο BCBS 239 και στον λειτουργικό κίνδυνο κατά Βασιλεία III
