title: HSBC Treasury APIs — πληρωμές και Banking-as-a-Service
banner_alt: Ο ορίζοντας του Σίτι του Λονδίνου — συμβολίζει την πλατφόρμα API διαχείρισης διαθεσίμων που
  παραδόθηκε στο πλαίσιο του προγράμματος Commercial & Investment Bank της HSBC
sector: Τράπεζα πρώτης βαθμίδας · Εταιρική διαχείριση διαθεσίμων · Εποπτευόμενες πληρωμές
role: Ανώτερος υπεύθυνος προϊόντος και τεχνολογίας
status: Σε παραγωγή σε παγκόσμια τράπεζα πρώτης βαθμίδας
outcome_highlights:
- value: Πρώτη βαθμίδα
  label: Παγκόσμια τράπεζα, Commercial & Investment Bank
- label: Εποπτευόμενη περίμετρος πληρωμών
- value: Διαθέσιμα / BaaS
  label: Προγραμματιζόμενα μετρητά, ρευστότητα, δίκτυα πληρωμών
- value: Πολυετές
  label: Ανώτερη ηγεσία προϊόντος και τεχνολογίας
pull_quote: «Παραδόθηκαν σε παραγωγή API πληρωμών, υπολοίπων και ρευστότητας εντός της εποπτικής περιμέτρου
  της τράπεζας — καλύπτοντας αρχιτεκτονική, ενσωμάτωση προμηθευτών, εποπτικά τεκμήρια και τους ελέγχους
  λειτουργικής ανθεκτικότητας που πλέον επιβάλλουν το DORA και το SR 11-7.»
problem: Οι εταιρικές ομάδες διαχείρισης διαθεσίμων ζητούν προγραμματιζόμενη πρόσβαση στη διαχείριση μετρητών,
  τη ρευστότητα και τα δίκτυα πληρωμών μέσα σε μια τράπεζα πρώτης βαθμίδας — χωρίς να παραιτηθούν από
  το επίπεδο εποπτικών τεκμηρίων που οφείλει να παράγει η ίδια η τράπεζα.
what_i_built: Ηγήθηκα των ροών εργασίας προϊόντος και τεχνολογίας για τα API διαχείρισης διαθεσίμων και
  το πρόγραμμα Banking-as-a-Service της HSBC εντός του Commercial & Investment Bank, παραδίδοντας σε παραγωγή
  API πληρωμών, υπολοίπων και ρευστότητας εντός της εποπτικής περιμέτρου της τράπεζας. Εργάστηκα σε αρχιτεκτονική,
  ενσωμάτωση προμηθευτών, εποπτικά τεκμήρια και τους ελέγχους λειτουργικής ανθεκτικότητας που πλέον επιβάλλουν
  το DORA και το SR 11-7.
rigour:
