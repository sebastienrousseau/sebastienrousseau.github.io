pull_quote: «API‌های پرداخت، مانده و نقدینگی در محیط عملیاتی و درون پیرامون نظارتی بانک عرضه شد — از معماری
  و یکپارچه‌سازی فروشندگان تا شواهد نظارتی و کنترل‌های تاب‌آوری عملیاتی که اکنون DORA و SR 11-7 الزام
  می‌کنند.»
problem: تیم‌های خزانه‌داری شرکتی خواستار دسترسی برنامه‌پذیر به مدیریت وجه نقد، نقدینگی و ریل‌های پرداخت
  درون یک بانک رده‌یک هستند — بی‌آنکه لایه شواهد نظارتی‌ای را که خود بانک باید تولید کند از دست بدهند.
what_i_built: رهبری جریان‌های کاری محصول و فناوری برای API‌های خزانه‌داری و برنامه Banking-as-a-Service
  بانک HSBC درون Commercial & Investment Bank را بر عهده داشتم و API‌های پرداخت، مانده و نقدینگی را در
  محیط عملیاتی و درون پیرامون نظارتی بانک عرضه کردم. در حوزه معماری، یکپارچه‌سازی فروشندگان، شواهد نظارتی
  و کنترل‌های تاب‌آوری عملیاتی که اکنون DORA و SR 11-7 الزام می‌کنند کار کردم.
