title: HSBC Treasury APIs — پرداخت و Banking-as-a-Service
banner_alt: خط آسمان سیتی لندن — نمادی از سکوی API خزانه‌داری که ذیل برنامه Commercial & Investment Bank
  بانک HSBC عرضه شد
