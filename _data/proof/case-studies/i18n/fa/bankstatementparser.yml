title: BankStatementParser — هوشمندی یکپارچه تراکنش برای خزانه‌داری
banner_alt: دفتر مالی مدرن در شب — نمادی از هوشمندی یکپارچه تراکنش در قالب‌های صورت‌حساب بانکی CAMT، MT940،
  OFX و CSV
sector: متن‌باز · خزانه‌داری شرکتی · گردآوری داده‌های ریسک
role: نویسنده و نگهدارنده
status: در بهره‌برداری، با نگهداری فعال
outcome_highlights:
- value: ۶ قالب
  label: CAMT (.052/.053/.054)، MT940، OFX، CSV، PDF با OCR
- value: به‌ازای هر میدان
  label: 'خاستگاه: قالب مبدأ و نسخه تحلیل‌گر ثبت می‌شود'
- label: هم‌راستا با گردآوری داده‌های ریسک
- label: آزاد برای استفاده، انشعاب و حسابرسی
pull_quote: «تحلیل‌گرهای CAMT / MT940 / PAIN اعتبارسنجی‌شده با طرح‌واره، پشتیبان OCR برای PDF‌های اسکن‌شده،
  نگاشت جبری میدان‌ها و شواهد حسابرسی در تراز SR 11-7 — هر گام دگرگونی ثبت و بازتولیدپذیر است.»
problem: تیم‌های خزانه‌داری شرکتی صورت‌حساب‌های بانکی را در قالب‌های CAMT، PAIN.001، MT940، OFX، CSV و
  PDF اسکن‌شده از ده‌ها بانک دریافت می‌کنند. هر قالب معنای میدانی، رمزگذاری و ابهام‌های متفاوتی دارد.
  بیشتر تیم‌ها تحلیل‌گرهای شکننده جداگانه برای هر بانک می‌سازند و همین راه را بر پیش‌بینی نقدینگی در زمان
  واقعی، کشف تقلب و مغایرت‌گیری قابل حسابرسی می‌بندد.
what_i_built: یک جعبه‌ابزار متن‌باز پایتون که هر قالب رایج صورت‌حساب بانکی را به یک جریان تراکنش یکپارچه
  و هنجارمند بدل می‌کند. تحلیل‌گرهای CAMT / MT940 / PAIN اعتبارسنجی‌شده با طرح‌واره، پشتیبان OCR برای
  PDF‌های اسکن‌شده، نگاشت جبری میدان‌ها و شواهد حسابرسی در تراز SR 11-7 برای هر گام دگرگونی.
rigour:
- metric: قالب‌های تحلیل‌شده
  value: CAMT (.052، .053، .054)، MT940، OFX، CSV، PDF اسکن‌شده (OCR)
- metric: هنجارسازی
  value: یک طرح‌واره یکپارچه برای رکورد تراکنش
- metric: ردّ حسابرسی
  value: خاستگاه به‌ازای هر میدان — قالب مبدأ و نسخه تحلیل‌گر برای هر سطر ثبت می‌شود
- metric: پروانه
validation:
- 'در نوشته ۱۴/۰۶/۲۰۲۶ معرفی شده است: From Bank Statements to Unified Transaction Intelligence'
- طراحی‌شده برای برآوردن الزامات گردآوری داده‌های ریسک بر پایه BCBS 239
