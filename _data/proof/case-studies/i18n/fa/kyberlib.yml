title: KyberLib — پیاده‌سازی ML-KEM در سطح بهره‌برداری با Rust
banner_alt: تبادل کلید رمزنگاری امن در برابر کوانتوم — نمادی از گذار به ML-KEM بر پایه FIPS 203 در بانکداری
sector: متن‌باز · بانکداری · استانداردها
role: نویسنده و نگهدارنده
status: در بهره‌برداری، با نگهداری فعال
outcome_highlights:
- label: هم‌راستا با مسیر انتشار NIST
- value: ۴۴ ٪ برتر
  label: از میان حدود ۱۸۲ کتابخانه PQC (آزمایشگاه Qtonic)
- label: در HSM و محفظه‌های امن جا می‌گیرد
- value: ۱ پذیرنده
  label: پیام‌رسان پساکوانتومی QGram (Quantum2pi)
pull_quote: «ارزیابی‌شده به‌دست Qtonic Quantum Lab — سیاهه مستقل رمزنگاری پساکوانتومی — و پذیرفته‌شده
  از سوی QGram (Quantum2pi) برای پیام‌رسانی رمزگذاری‌شده سرتاسری. هر دو بدون واسطه من قابل راستی‌آزمایی‌اند.»
problem: بانک‌ها با مهلت گذار SWIFT به نشانی‌های ساخت‌یافته در ۱۴ نوامبر ۲۰۲۶ و بازه بلندتر گذار پساکوانتومی
  NIST روبه‌رو هستند. پیاده‌سازی‌های موجود PQC به‌صورت سند سیاستی، کد آزمایشگاهی یا جعبه سیاه اختصاصی
  HSM عرضه می‌شوند — هیچ‌کدام را یک معمار پرداخت نمی‌تواند بخواند، بیازماید یا امضا کند.
what_i_built: KyberLib استاندارد ML-KEM بر پایه FIPS 203 (CRYSTALS-Kyber) را به Rust قابل بازرسی بدل می‌کند.
  دست‌دادن‌های ترکیبی کلاسیک و کوانتومی، ترجمه no_std برای جاسازی در HSM، مرزهای انتزاعی با چابکی رمزنگاری،
  و شواهد حاکمیتی ماده ۵ DORA که هیئت‌مدیره‌ها اکنون برای پشتیبانی از گذار PQC نیاز دارند، بی‌آنکه ریسک
  مبهم فروشنده را بپذیرند.
rigour:
- metric: استاندارد
- metric: حالت ترکیبی
  value: TLS کلاسیک + ML-KEM-768 در حالت X25519MLKEM768
- metric: جاسازی
  value: no_std — در HSM، محفظه‌های امن و اهداف نهفته جا می‌گیرد
- metric: چابکی رمزنگاری
  value: مرزهای انتزاعی امکان تعویض الگوریتم را بدون تغییر API فراهم می‌کنند
- metric: پروانه
validation:
- در گزارش سفید EPAA Quantum-Safe Payments (سپتامبر ۲۰۲۵) به آن استناد شده است
- 'در نوشته ۱۲/۰۶/۲۰۲۶ معرفی شده است: KyberLib and the Post-Quantum Banking Migration'
- هم‌راستا با مسیر انتشار NIST FIPS 203 / 204 / 205
- ارزیابی‌شده به‌دست Qtonic Quantum Lab — سیاهه مستقل ارزیابی رمزنگاری پساکوانتومی، حدود ۱۸۲ کتابخانه
  PQC بررسی شده (۴۴ ٪ برتر، بدون پرداخت برای درج)
- پذیرفته‌شده از سوی QGram (Quantum2pi) — پیام‌رسان همتا‌به‌همتای پساکوانتومی با رمزگذاری سرتاسری که برای
  رمزگذاری پیام‌ها از KyberLib بهره می‌گیرد (قابل راستی‌آزمایی در f6s.com/software/qgram)
