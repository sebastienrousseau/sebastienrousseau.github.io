title: pain001 — خودکارسازی پرونده‌های پرداخت ISO 20022
banner_alt: نمای هوایی شهر در غروب — نمادی از خودکارسازی پرونده‌های پرداخت ساخت‌یافته بر پایه ISO 20022
  در شبکه‌های تسویه جهانی
sector: متن‌باز · خزانه‌داری شرکتی · ISO 20022
role: نویسنده و نگهدارنده
status: در بهره‌برداری، با نگهداری فعال
outcome_highlights:
- label: Customer Credit Transfer Initiation
- value: اعتبارسنجی‌شده با XSD
  label: بررسی پیش‌پرواز روی هر پیام
- label: کدهای کنترلی ISO 7064 Modulo 97-10
- label: آزاد برای استفاده، انشعاب و حسابرسی
pull_quote: «در گزارش سفید EPAA Quantum-Safe Payments (سپتامبر ۲۰۲۵) به آن استناد شده است. متن‌باز و از
  روز نخست حسابرسی‌شده — بدون هیچ مترجم اختصاصی میان سامانه ERP شما و شبکه تسویه.»
problem: گذار جهانی MT → MX هر بانک و هر خزانه‌داری شرکتی را ناچار می‌کند پیام‌های ساخت‌یافته pain.001
  تولید کند. بیشتر تیم‌ها یا XML شکننده را دستی می‌نویسند یا مترجم‌های اختصاصی و مبهم می‌خرند. هر دو مسیر
  خطاهای پرداخت را به شبکه‌های تسویه می‌فرستند و هیچ ردّ حسابرسی بر جای نمی‌گذارند.
what_i_built: یک کتابخانه متن‌باز پایتون که پیام‌های اعتبارسنجی‌شده ISO 20022 pain.001 (Customer Credit
  Transfer Initiation) را از CSV / SQLite / Parquet می‌سازد. اعتبارسنجی پیش‌پرواز XSD، کدهای کنترلی IBAN
  / BIC، پوشاندن داده‌های شخصی و انطباق کامل با طرح‌واره XSD — همه در جریان کاری پایتون که در خطوط موجود
  ERP و خزانه‌داری جا می‌گیرد.
rigour:
- metric: پیام‌های پشتیبانی‌شده ISO 20022
- metric: انطباق با طرح‌واره
  value: اعتبارسنجی رسمی XSD به‌صورت پیش‌پرواز روی هر پیام
- metric: اعتبارسنج‌های ارائه‌شده
  value: رقم کنترلی IBAN + کد کنترلی BIC و LEI (ISO 7064 Modulo 97-10)
- metric: پروانه
  value: Apache-2.0 / MIT — آزاد برای استفاده، انشعاب و حسابرسی
validation:
- در گزارش سفید EPAA Quantum-Safe Payments (سپتامبر ۲۰۲۵) به آن استناد شده است
- در نوشته‌های منتشرشده در sebastienrousseau.com از ۰۹/۲۰۲۳ معرفی شده است
