title: CloudCDN — نقشه متن‌باز برای لبه با محوریت هوش مصنوعی
banner_alt: زیرساخت لبه با محوریت هوش مصنوعی — نمادی از دروازه MCP با اعتماد صفر، محدودسازی نرخ اتمی با
  Durable Objects و پیرامون WebAuthn با کلید عبور که CloudCDN به‌عنوان پیاده‌سازی مرجع عرضه می‌کند
sector: متن‌باز · لبه · زیرساخت هوش مصنوعی
role: نویسنده و نگهدارنده
status: در بهره‌برداری، با نگهداری فعال
outcome_highlights:
- value: ۳٬۱۸۵ آزمون
  label: ۱۰۰ ٪ پوشش خط، شاخه و تابع
- label: خاستگاه ساخت + امضای Sigstore
- value: ۴۲ ابزار MCP
  label: هر فراخوان با شواهد ساخت‌یافته ثبت می‌شود
- label: نگاشته به ماده ۵ و گردآوری داده‌های ریسک
pull_quote: «یک پیاده‌سازی مرجع متن‌باز که تیم امنیت می‌تواند بخواند، انشعاب دهد و امضا کند — نه یک PDF
  بازاریابی. محدودسازی نرخ اتمی با Durable Objects، پیرامون WebAuthn، خاستگاه SLSA L3.»
problem: همچنان که عامل‌های هوش مصنوعی و ابزارهای MCP در مقیاس بزرگ به فراخوانی API‌های لبه می‌پردازند،
  بانک‌ها به پیرامونی نیاز دارند که ترافیک خودگردان را تاب بیاورد بی‌آنکه شواهد حسابرسی در تراز DORA را
  از دست بدهد. CDN‌های موجود یا زبان بازاریابی عرضه می‌کنند یا طرح‌های مبهم — هیچ‌کدام آن پیاده‌سازی مرجعی
  را نمی‌سازند که تیم امنیت بتواند بخواند، انشعاب دهد و امضا کند.
what_i_built: یک دروازه MCP متن‌باز با اعتماد صفر، شامل ۴۲ ابزار، محدودسازی نرخ اتمی با Durable Objects،
  پیرامون WebAuthn با کلید عبور، نشانی‌های امضاشده و خاستگاه ساخت SLSA سطح ۳. ۳٬۱۸۵ آزمون با ۱۰۰ ٪ پوشش،
  نگاشته به ماده ۵ DORA، گردآوری داده‌های ریسک BCBS 239 و سرمایه ریسک عملیاتی بازل III.
