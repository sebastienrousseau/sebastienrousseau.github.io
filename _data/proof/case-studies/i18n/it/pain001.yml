pull_quote: >
  «Citato nel white paper EPAA Quantum-Safe Payments (settembre 2025).
  Open source, sottoposto ad audit fin dal primo giorno — nessun
  traduttore proprietario tra il vostro ERP e la rete di compensazione.»

problem: >
  La migrazione globale MT → MX obbliga ogni banca e ogni tesoreria
  aziendale a produrre messaggi pain.001 strutturati. La maggior parte
  dei team scrive a mano XML fragile o acquista traduttori proprietari
  opachi. Entrambe le strade fanno entrare errori di pagamento nelle
  reti di compensazione e non lasciano alcuna pista di audit.

what_i_built: >
  Una libreria Python open source che genera messaggi ISO 20022 pain.001
  (Customer Credit Transfer Initiation) convalidati da CSV / SQLite /
  Parquet. Validazione XSD pre-invio, checksum IBAN / BIC, mascheratura
  dei dati personali e piena conformità allo schema XSD — il tutto
  all'interno di un flusso Python che si inserisce nelle pipeline ERP e
  di tesoreria esistenti.

