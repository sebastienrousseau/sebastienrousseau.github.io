pull_quote: >
  «Rilasciate in produzione API di pagamento, saldo e liquidità sul
  perimetro regolamentare della banca — coprendo architettura,
  integrazione fornitori, evidenze di vigilanza e i controlli di
  resilienza operativa che DORA e SR 11-7 oggi impongono.»

problem: >
  I team di tesoreria aziendale richiedono accesso programmabile alla
  gestione della cassa, alla liquidità e ai binari di pagamento
  all'interno di una banca Tier-1 — senza rinunciare al livello di
  evidenza regolamentare che la banca stessa deve produrre.

what_i_built: >
  Ho guidato i flussi di lavoro di prodotto e tecnologia per le API di
  tesoreria di HSBC e il programma Banking-as-a-Service all'interno del
  Commercial & Investment Bank, rilasciando in produzione API di
  pagamento, saldo e liquidità sul perimetro regolamentare della banca.
  Ho lavorato su architettura, integrazione fornitori, evidenze di
  vigilanza e i controlli di resilienza operativa che DORA e SR 11-7
  oggi impongono.

