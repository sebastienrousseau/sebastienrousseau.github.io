pull_quote: >
  «Parser CAMT / MT940 / PAIN convalidati a schema, fallback OCR per i
  PDF scansionati, mappatura deterministica dei campi, evidenze di audit
  conformi a SR 11-7 — ogni passaggio di trasformazione è registrato e
  riproducibile.»

problem: >
  I team di tesoreria aziendale ricevono rendiconti bancari in CAMT,
  PAIN.001, MT940, OFX, CSV e PDF scansionati da decine di banche. Ogni
  formato porta semantiche di campo, codifiche e ambiguità differenti.
  La maggior parte dei team costruisce a mano parser fragili e specifici
  per banca, bloccando la previsione di cassa in tempo reale, il
  rilevamento delle frodi e la riconciliazione conforme agli audit.

what_i_built: >
  Un toolkit Python open source che unifica ogni formato comune di
  rendiconto bancario in un singolo flusso di transazioni normalizzato.
  Parser CAMT / MT940 / PAIN convalidati a schema, fallback OCR per i
  PDF scansionati, mappatura deterministica dei campi ed evidenze di
  audit conformi a SR 11-7 per ogni passaggio di trasformazione.

