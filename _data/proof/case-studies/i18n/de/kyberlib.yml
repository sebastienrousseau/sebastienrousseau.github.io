  - "Eingesetzt von QGram (Quantum2pi) — einem quantensicheren, Ende-zu-Ende-verschlüsselten Peer-to-Peer-Messenger, der KyberLib zur Nachrichtenverschlüsselung nutzt (verifizierbar unter f6s.com/software/qgram)"
