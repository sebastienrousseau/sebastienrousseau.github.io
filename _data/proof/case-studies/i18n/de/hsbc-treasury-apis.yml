problem: >
  Corporate-Treasury-Teams verlangen programmierbaren Zugriff auf Cash
  Management, Liquidität und Zahlungsschienen innerhalb einer Tier-1-Bank
  — ohne dass die regulatorische Nachweisebene aufgegeben wird, die die
  Bank selbst erbringen muss.

what_i_built: >
  Leitung der Product- und Technology-Workstreams für die Treasury-APIs
  und das Banking-as-a-Service-Programm der HSBC innerhalb der Commercial
  & Investment Bank. Auslieferung produktiver Payment-, Balance- und
  Liquidity-APIs gegen den regulatorischen Perimeter der Bank. Verantwortung
  über Architektur, Anbieterintegration, aufsichtliche Nachweise und die
  Resilienz-Kontrollen, die DORA und SR 11-7 inzwischen vorschreiben.

