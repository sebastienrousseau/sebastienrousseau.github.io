problem: >
  Corporate-Treasury-Teams erhalten Kontoauszüge in den Formaten CAMT,
  PAIN.001, MT940, OFX, CSV und als gescannte PDFs von Dutzenden Banken.
  Jedes Format bringt eigene Feldsemantik, eigene Kodierungen und eigene
  Mehrdeutigkeiten mit. Die meisten Teams bauen fragile bankenspezifische
  Parser von Hand und blockieren damit Echtzeit-Cashforecasting,
  Betrugserkennung und prüfungsfeste Abstimmung.

what_i_built: >
  Ein Open-Source-Python-Toolkit, das jedes gängige Kontoauszugsformat in
  einen einzigen, normalisierten Transaktionsstrom überführt. Schema-validierte
  CAMT-/MT940-/PAIN-Parser, OCR-Fallback für gescannte PDFs, deterministisches
  Field Mapping und Audit-Nachweise auf SR 11-7-Niveau für jeden
  Transformationsschritt.

