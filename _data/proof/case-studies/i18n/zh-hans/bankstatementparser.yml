pull_quote: >
  「带模式校验的 CAMT / MT940 / PAIN 解析器，针对扫描 PDF 的 OCR 回退路径，
  确定性字段映射，符合 SR 11-7 审计取证要求——每一步转换均可记录、可复现。」

problem: >
  企业司库团队每日从数十家银行接收 CAMT、PAIN.001、MT940、OFX、CSV 以及扫描
  PDF 形态的对账单。各格式在字段语义、编码方式与歧义处理上各异。多数团队仍
  在为每家银行手工搭建脆弱的解析器，阻碍了实时现金预测、欺诈检测与可审计
  的对账流程。

what_i_built: >
  一套开源 Python 工具集，将常见银行对账单格式统一汇入单一规范化的交易流。
  内置带模式校验的 CAMT / MT940 / PAIN 解析器、针对扫描 PDF 的 OCR 回退路径、
  确定性字段映射，以及覆盖每一步转换、符合 SR 11-7 审计取证标准的证据链。

