pull_quote: >
  「在银行监管边界内交付了生产级的支付、余额与流动性 API——覆盖架构、供应商
  集成、监管证据，以及 DORA 与 SR 11-7 当下所要求的运营韧性控制。」

problem: >
  企业司库团队要求在一级银行体系内以可编程方式访问现金管理、流动性与支付
  通道，同时不得削弱银行自身必须产出的监管证据层。

what_i_built: >
  在 HSBC 工商金融及投资银行业务条线内，主导司库 API 与银行即服务（BaaS）
  项目的产品与技术工作线，在银行监管边界内交付生产级的支付、余额与流动性
  API。工作贯穿架构、供应商集成、监管证据，以及 DORA 与 SR 11-7 当下所要求
  的运营韧性控制。

