pull_quote: >
  「获 EPAA 抗量子支付白皮书（2025 年 9 月）引用。开源，从第一天起即接受
  审计——ERP 与清算网络之间不再夹一层专有翻译器。」

problem: >
  全球 MT → MX 迁移迫使每一家银行与企业司库都必须产出结构化的 pain.001
  报文。多数团队仍在手工拼装脆弱的 XML，或采购不透明的专有翻译器。两条路径
  都会把支付错误直接送入清算网络，且不留审计轨迹。

what_i_built: >
  一个开源 Python 库，可从 CSV / SQLite / Parquet 数据源生成经校验的
  ISO 20022 pain.001（客户付款发起）报文。内置预先 XSD 校验、IBAN 与 BIC
  校验码、PII 掩码以及完整 XSD 模式合规——全部封装在一个可嵌入既有 ERP 与
  司库管道的 Python 工作流中。

