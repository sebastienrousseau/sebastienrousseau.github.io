pull_quote: >
  「经 Qtonic Quantum Lab——独立后量子密码学评估登记机构——评估，并被
  QGram（Quantum2pi）端到端加密通讯采用。两项均可绕开本人独立查证。」

problem: >
  银行业正面临 2026 年 11 月 14 日 SWIFT 结构化地址切换截止日，以及更长的
  NIST 后量子迁移窗口。现有 PQC 实现要么停留在政策白皮书与实验室代码层面，
  要么以专有 HSM 黑盒形态交付——支付架构师既无法阅读、亦无法测试，更无法
  签名背书。

what_i_built: >
  KyberLib 将 FIPS 203 ML-KEM（CRYSTALS-Kyber）转化为可被审阅的 Rust 实现。
  支持经典与抗量子混合握手，提供 no_std 编译以适配 HSM 嵌入，给出密码敏捷
  的抽象边界，并附带 DORA 第 5 条要求的治理证据，让董事会能够在不承担不
  透明厂商风险的前提下推进 PQC 迁移。

