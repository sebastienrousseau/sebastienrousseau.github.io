pull_quote: >
  「安全团队可读、可复刻、可签名的开源参考实现——而非一份营销 PDF。原子化
  Durable Objects 限流、WebAuthn 边界、SLSA L3 构建溯源。」

problem: >
  随着 AI 代理与 MCP 工具开始以规模化方式调用边缘 API，银行需要一道既能承
  受自主流量、又不牺牲 DORA 级审计证据的边界。现有 CDN 要么停留在营销语言，
  要么提供不透明的方案——两者都无法交付安全团队可读、可复刻、可签名的参考
  实现。

what_i_built: >
  一套开源、零信任的 MCP 网关，内置 42 项工具、原子化 Durable Objects 限流、
  WebAuthn 通行密钥边界、签名 URL 以及 SLSA Level 3 构建溯源。3,185 项测试，
  覆盖率 100%，对齐 DORA 第 5 条、BCBS 239 风险数据聚合以及 Basel III 操作
  风险资本要求。

