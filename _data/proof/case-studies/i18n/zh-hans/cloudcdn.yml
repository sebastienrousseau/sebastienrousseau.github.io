banner_alt: "AI 原生边缘基础设施——象征 CloudCDN 作为参考实现交付的零信任 MCP 网关、原子化 Durable Objects 限流以及 WebAuthn 通行密钥边界"
sector: "开源 · 边缘计算 · AI 基础设施"
