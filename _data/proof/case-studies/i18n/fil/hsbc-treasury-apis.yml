problem: >
  Hinihingi ng mga corporate treasury team ang programmable access sa
  cash management, liquidity, at payments rails sa loob ng isang
  Tier-1 bank — nang hindi isinusuko ang regulatory evidence layer
  na kailangan din mismong gawin ng bangko.

what_i_built: >
  Pinangunahan ang product at technology workstreams para sa treasury
  APIs at Banking-as-a-Service programme ng HSBC sa loob ng
  Commercial & Investment Bank, kasabay ng paghahatid sa produksiyon
  ng payment, balance, at liquidity APIs laban sa regulatory perimeter
  ng bangko. Nagtrabaho sa arkitektura, vendor integration, supervisory
  evidence, at sa operational-resilience controls na inaatas na ngayon
  ng DORA at SR 11-7.

