  - label: "Libreng gamitin, i-fork, at i-audit"

pull_quote: >
  "Binanggit sa EPAA Quantum-Safe Payments white paper (Setyembre 2025).
  Open-source, na-audit mula sa unang araw — walang proprietary
  translator sa pagitan ng inyong ERP at ng clearing network."

problem: >
  Pinipilit ng global MT → MX migration ang bawat bangko at corporate
  treasury na lumikha ng structured pain.001 messages. Karamihan sa
  mga team ay manu-manong nagsusulat ng marupok na XML o bumibili
  ng malabong proprietary translator. Pareho silang nagdadala ng
  payment errors sa mga clearing network at hindi nag-iiwan ng
  audit trail.

what_i_built: >
  Isang open-source Python library na gumagawa ng validated ISO 20022
  pain.001 (Customer Credit Transfer Initiation) messages mula sa
  CSV / SQLite / Parquet. Pre-flight XSD validation, IBAN / BIC
  checksums, PII masking, at buong XSD schema conformance — lahat
  sa loob ng Python workflow na pumapasok nang diretso sa umiiral
  na ERP at treasury pipelines.

