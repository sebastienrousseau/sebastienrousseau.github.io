pull_quote: >
  "A tọ́ka sí i nínú ìwé funfun EPAA Quantum-Safe Payments (oṣù
  September 2025). Orísun-ṣíṣí, a ti ṣàyẹ̀wò rẹ̀ láti ọjọ́ kìíní —
  kò sí olùtumọ̀ ohun-ìní láàárín ERP rẹ àti nẹ́tíwọ́ọ̀kì ìkọsí."

problem: >
  Ìṣílọ MT → MX àgbáyé fipá mú gbogbo báńkì àti ìṣúra ilé-iṣẹ́ láti
  pèsè àwọn ìránṣẹ́ pain.001 tí a ṣètò. Ọ̀pọ̀ àwọn ẹgbẹ́ ń kọ XML
  aláìdúró pẹ̀lú ọwọ́ tàbí kí wọ́n ra àwọn olùtumọ̀ ohun-ìní tí kò
  ṣíkàrà. Ọ̀nà méjèèjì ń tì àwọn àṣìṣe ìsanwó sínú àwọn nẹ́tíwọ́ọ̀kì
  ìkọsí, wọn kò sì fi ipa-ọ̀nà ìṣàyẹ̀wò sílẹ̀.

what_i_built: >
  Ilé-ìkàwé Python orísun-ṣíṣí tí ó ń pèsè àwọn ìránṣẹ́ ISO 20022
  pain.001 (Ìbẹ̀rẹ̀ Ìfìjímọ́ Ìwó Onibara) tí a ti fọwọ́sí láti CSV /
  SQLite / Parquet. Àyẹ̀wò XSD ṣáájú-ìfìjáde, àwọn àyẹ̀wò IBAN / BIC,
  bíbo PII, àti ìbámu pípé pẹ̀lú schema XSD — gbogbo rẹ̀ nínú iṣẹ́ṣiṣẹ́
  Python tí ó wọ inú ERP àti àwọn ìpèsè ìṣúra tí ó ti wà.

