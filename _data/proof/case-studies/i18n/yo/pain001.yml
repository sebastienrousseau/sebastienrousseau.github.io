title: "pain001 — ìṣe-aládàáṣe àwọn fáìlì ìsanwó ISO 20022"
banner_alt: "Wíwo ìlú ńlá láti òkè ní alẹ́ — ó dúró fún ìṣe-aládàáṣe fáìlì ìsanwó tí a ṣètò lábẹ́ ISO 20022 kọjá àwọn nẹ́tíwọ́ọ̀kì ìkọsí àgbáyé"
sector: "Orísun ṣíṣí · Ìṣúra ilé-iṣẹ́ · ISO 20022"
