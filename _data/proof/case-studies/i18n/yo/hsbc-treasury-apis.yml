pull_quote: >
  "A pèsè àwọn API ìsanwó, ìwọ̀n owó, àti ìṣàn-owó ní ìmújáde lòdì sí
  ààlà ìṣàkóso báńkì — kọjá ìpilẹ̀-ọ̀nà, ìṣọ̀kan olùtà, ẹ̀rí ìṣèyẹ̀wò,
  àti àwọn ìṣàkóso ìfaradà-iṣẹ́ tí DORA àti SR 11-7 ti béèrè nísinsìnyí."

problem: >
  Àwọn ẹgbẹ́ ìṣúra ilé-iṣẹ́ ń béèrè ìwọlé tí a lè ṣètò sí ìṣàkóso owó,
  ìṣàn-owó, àti ọ̀nà ìsanwó nínú báńkì Ìpele-1 — láìjáde ipele ẹ̀rí
  ìṣàkóso tí báńkì fúnra rẹ̀ gbọ́dọ̀ pèsè jáde.

what_i_built: >
  Mo darí àwọn iṣẹ́ ọjà àti ìmọ̀-ẹ̀rọ fún àwọn API ìṣúra HSBC àti ètò
  Báńkì-gẹ́gẹ́-bí-Iṣẹ́ nínú Báńkì Òwò àti Ìdókòwò, mo sì pèsè àwọn API
  ìsanwó, ìwọ̀n owó, àti ìṣàn-owó ní ìmújáde lòdì sí ààlà ìṣàkóso báńkì.
  Mo ṣiṣẹ́ kọjá ìpilẹ̀-ọ̀nà, ìṣọ̀kan olùtà, ẹ̀rí ìṣèyẹ̀wò, àti àwọn
  ìṣàkóso ìfaradà-iṣẹ́ tí DORA àti SR 11-7 ti béèrè nísinsìnyí.

