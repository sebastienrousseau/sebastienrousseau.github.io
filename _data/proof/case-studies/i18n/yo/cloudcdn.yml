  - metric: "Irinṣẹ́ MCP tí a pèsè"
    value: "Irinṣẹ́ 42 — gbogbo ìpè ni a kọ sí ìwé pẹ̀lú ẹ̀rí tí a ṣètò"
  - metric: "Ààlà ìfilọ́jú"
    value: "Durable Objects tó dájú (kò sí ìjà ipò, kò sí ìka-ìlọ́pọ̀)"
  - metric: "Ìjẹ́rìí"
    value: "Àwọn passkey WebAuthn + àwọn URL tí a fọwọ́sí"
  - metric: "Iwé-àṣẹ"
