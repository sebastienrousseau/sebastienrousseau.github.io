pull_quote: >
  «Поставлено у промислову експлуатацію платіжні, балансові та ліквідністні
  API в межах регуляторного периметра банку — на стику архітектури,
  інтеграції з постачальниками, наглядових доказів та контролів операційної
  стійкості, яких тепер вимагають DORA та SR 11-7.»

problem: >
  Корпоративні казначейські команди вимагають програмованого доступу
  до управління грошовими потоками, ліквідністю та платіжними рейками
  всередині банку Tier-1 — без втрати рівня регуляторних доказів, який
  має виробляти сам банк.

what_i_built: >
  Очолював продуктові та технологічні напрямки програми казначейських
  API та Banking-as-a-Service HSBC всередині Commercial & Investment
  Bank, постачаючи у промислову експлуатацію платіжні, балансові та
  ліквідністні API в межах регуляторного периметра банку. Працював на
  стику архітектури, інтеграції з постачальниками, наглядових доказів та
  контролів операційної стійкості, яких тепер вимагають DORA та SR 11-7.

