pull_quote: >
  «Парсери CAMT / MT940 / PAIN зі схемною валідацією, OCR-резерв для
  сканованих PDF, детерміноване зіставлення полів, аудиторські докази рівня
  SR 11-7 — кожен крок перетворення фіксується та відтворюється.»

problem: >
  Корпоративні казначейські команди отримують банківські виписки у
  форматах CAMT, PAIN.001, MT940, OFX, CSV та сканованих PDF від
  десятків банків. Кожен формат несе різну семантику полів, кодування та
  неоднозначності. Більшість команд вручну будують крихкі парсери під
  кожен банк, що блокує прогнозування грошових потоків у режимі
  реального часу, виявлення шахрайства та готову до аудиту звірку.

what_i_built: >
  Open-source-інструментарій на Python, що уніфікує всі поширені формати
  банківських виписок у єдиний нормалізований потік транзакцій.
  Парсери CAMT / MT940 / PAIN зі схемною валідацією, OCR-резерв для
  сканованих PDF, детерміноване зіставлення полів та аудиторські докази
  рівня SR 11-7 для кожного кроку перетворення.

