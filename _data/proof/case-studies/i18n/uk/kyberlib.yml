  - metric: "Підтримка гібридного рукостискання"
    value: "Класичний TLS + ML-KEM-768 у режимі X25519MLKEM768"
  - metric: "Компіляція"
    value: "no_std — вбудовується в HSM, захищені анклави, вбудовані пристрої"
  - metric: "Крипто-гнучкість"
    value: "Межі абстракції дозволяють заміну алгоритму без зміни API"
  - metric: "Ліцензія"
    value: "Apache-2.0 / MIT"

validation:
  - "Цитовано у білій книзі EPAA Quantum-Safe Payments (вересень 2025)"
  - "Представлено у статті від 2026-06-12: KyberLib and the Post-Quantum Banking Migration"
  - "Узгоджено з публікаційним треком NIST FIPS 203 / 204 / 205"
  - "Оцінено Qtonic Quantum Lab — незалежним реєстром оцінювання постквантової криптографії, оцінено ~182 PQC-бібліотеки (топ 44 %, без оплати постачальниками за включення)"
  - "Впроваджено QGram (Quantum2pi) — постквантовим peer-to-peer-месенджером із наскрізним шифруванням, що використовує KyberLib для шифрування повідомлень (підтверджується на f6s.com/software/qgram)"
