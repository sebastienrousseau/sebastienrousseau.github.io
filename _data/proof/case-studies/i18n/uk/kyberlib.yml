title: "KyberLib — промисловий ML-KEM на Rust"
banner_alt: "Квантово-стійкий криптографічний обмін ключами — символізує міграцію банків на FIPS 203 ML-KEM"
sector: "Open-source · Банківська справа · Стандарти"
role: "Автор та супровідник"
status: "У промисловій експлуатації, активна підтримка"

outcome_highlights:
  - value: "FIPS 203"
    label: "Узгоджено з публікаційним треком NIST"
  - value: "Топ 44 %"
    label: "Зі ~182 PQC-бібліотек (Qtonic Lab)"
  - value: "no_std"
    label: "Вбудовується в HSM та захищені анклави"
  - value: "1 користувач"
    label: "Постквантовий месенджер QGram (Quantum2pi)"

pull_quote: >
  «Оцінено Qtonic Quantum Lab — незалежним реєстром постквантової
  криптографії — та впроваджено QGram (Quantum2pi) для наскрізно
  шифрованих повідомлень. Обидва підтверджуються без мого посередництва.»

problem: >
  Банки стикаються з переходом SWIFT на структуровані адреси 14 листопада
  2026 року та довшим вікном міграції на постквантову криптографію NIST.
  Наявні реалізації PQC постачаються як політичні документи, лабораторний
  код або пропрієтарні «чорні скриньки» HSM — жодну з яких архітектор
  платежів не може прочитати, протестувати або підписати.

what_i_built: >
  KyberLib перетворює FIPS 203 ML-KEM (CRYSTALS-Kyber) на придатний
  для інспекції Rust. Гібридні класично-квантові рукостискання, компіляція
  no_std для вбудовування в HSM, межі абстракції з підтримкою крипто-
  гнучкості та докази управління відповідно до Статті 5 DORA, які тепер
  потрібні правлінню для підтримки міграції PQC без прийняття непрозорого
  ризику постачальника.

rigour:
  - metric: "Криптографічний стандарт"
