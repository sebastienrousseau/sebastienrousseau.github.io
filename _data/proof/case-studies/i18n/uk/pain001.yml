pull_quote: >
  «Цитовано у білій книзі EPAA Quantum-Safe Payments (вересень 2025).
  Open-source, проаудитовано з першого дня — жодного пропрієтарного
  транслятора між вашою ERP та кліринговою мережею.»

problem: >
  Глобальна міграція MT → MX змушує кожен банк та корпоративне
  казначейство виробляти структуровані повідомлення pain.001. Більшість
  команд або вручну верстають крихкий XML, або купують непрозорі
  пропрієтарні транслятори. Обидва шляхи постачають платіжні помилки до
  клірингових мереж і не залишають аудиторського сліду.

what_i_built: >
  Open-source-бібліотеку на Python, що генерує валідовані повідомлення
  ISO 20022 pain.001 (Ініціювання клієнтського кредитового переказу) з
  CSV / SQLite / Parquet. Передпольотна валідація XSD, контрольні суми
  IBAN / BIC, маскування PII та повна відповідність XSD-схемі — все
  всередині робочого процесу Python, який вбудовується в наявні
  ERP- та казначейські конвеєри.

