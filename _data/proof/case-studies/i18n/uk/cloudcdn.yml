title: "CloudCDN — open-source-проєкт для AI-нативного периметра"
banner_alt: "AI-нативна периферійна інфраструктура — символізує zero-trust-шлюз MCP, атомарне обмеження частоти на Durable Objects та WebAuthn-периметр з passkeys, які CloudCDN постачає як референсну реалізацію"
sector: "Open-source · Edge · AI-інфраструктура"
role: "Автор та супровідник"
status: "У промисловій експлуатації, активна підтримка"

outcome_highlights:
  - value: "3 185 тестів"
    label: "100 % покриття рядків, гілок і функцій"
  - value: "SLSA L3"
    label: "Походження збірки + підпис Sigstore"
  - value: "42 інструменти MCP"
    label: "Кожен виклик фіксується в аудит-журналі зі структурованими доказами"
  - value: "DORA / BCBS 239"
    label: "Зіставлено зі Статтею 5 та агрегацією ризик-даних"

pull_quote: >
  «Open-source-референсна реалізація, яку команда безпеки може прочитати,
  форкнути та підписати — замість маркетингового PDF. Атомарне обмеження
  частоти на Durable Objects, периметр WebAuthn, походження SLSA L3.»

problem: >
  Коли AI-агенти та інструменти MCP починають викликати периферійні API
  у промислових масштабах, банкам потрібен периметр, який витримує
  автономний трафік без втрати аудиторських доказів рівня DORA. Наявні
  CDN пропонують або маркетингові формулювання, або непрозорі тарифні
  плани — жоден з яких не дає референсної реалізації, яку команда
  безпеки може прочитати, форкнути та підписати.

what_i_built: >
  Open-source zero-trust-шлюз MCP з 42 інструментами, атомарним
  обмеженням частоти на Durable Objects, периметром WebAuthn з passkeys,
  підписаними URL та походженням збірки рівня SLSA Level 3. 3 185 тестів
  зі 100-відсотковим покриттям, зіставлено зі Статтею 5 DORA, агрегацією
  ризик-даних BCBS 239 та капіталом операційного ризику Basel III.

