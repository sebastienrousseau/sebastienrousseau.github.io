title: CloudCDN — AI-కేంద్రిత అంచు కోసం ఓపెన్ సోర్స్ నమూనా
banner_alt: AI-కేంద్రిత అంచు మౌలిక వసతి — CloudCDN సూచిక అమలుగా అందించే శూన్య-విశ్వాస MCP గేట్‌వే, పరమాణు
  Durable Objects రేటు పరిమితి, WebAuthn పాస్‌కీ పరిధికి ప్రతీక
sector: ఓపెన్ సోర్స్ · అంచు · AI మౌలిక వసతి
role: రచయిత మరియు నిర్వాహకుడు
status: ఉత్పత్తిలో, చురుగ్గా నిర్వహిస్తున్నది
outcome_highlights:
- value: 3,185 పరీక్షలు
  label: 100 % పంక్తి, శాఖ, ఫంక్షన్ కవరేజ్
- label: బిల్డ్ మూలం + Sigstore సంతకం
- value: 42 MCP పనిముట్లు
  label: ప్రతి కాల్ నిర్మాణాత్మక ఆధారంతో నమోదవుతుంది
- label: ఆర్టికల్ 5, రిస్క్-డేటా సమీకరణతో అనుసంధానం
pull_quote: «ఒక భద్రతా బృందం చదవగల, ఫోర్క్ చేయగల, సంతకం చేయగల ఓపెన్ సోర్స్ సూచిక అమలు — మార్కెటింగ్ PDF
  కాదు. పరమాణు Durable Objects రేటు పరిమితి, WebAuthn పరిధి, SLSA L3 మూలం.»
problem: AI ఏజెంట్లు, MCP పనిముట్లు పెద్ద ఎత్తున అంచు API లను పిలవడం మొదలుపెట్టగానే, DORA స్థాయి ఆడిట్
  ఆధారాలను వదులుకోకుండా స్వయంప్రతిపత్త ట్రాఫిక్‌ను తట్టుకునే పరిధి బ్యాంకులకు అవసరం. ఉన్న CDN లు మార్కెటింగ్
  భాషనో అపారదర్శక ప్రణాళికలనో ఇస్తాయి — ఏదీ ఒక భద్రతా బృందం చదవగల, ఫోర్క్ చేయగల, సంతకం చేయగల సూచిక అమలును
  తయారుచేయదు.
what_i_built: 42 పనిముట్లతో ఓపెన్ సోర్స్, శూన్య-విశ్వాస MCP గేట్‌వే; పరమాణు Durable Objects రేటు పరిమితి,
  WebAuthn పాస్‌కీ పరిధి, సంతకం చేసిన URL లు, SLSA స్థాయి 3 బిల్డ్ మూలం. 100 % కవరేజ్‌తో 3,185 పరీక్షలు;
  DORA ఆర్టికల్ 5, BCBS 239 రిస్క్-డేటా సమీకరణ, బాసెల్ III నిర్వహణ రిస్క్ మూలధనంతో అనుసంధానించబడ్డాయి.
