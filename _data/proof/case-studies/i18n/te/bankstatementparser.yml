title: BankStatementParser — ట్రెజరీ కోసం ఏకీకృత లావాదేవీ విజ్ఞానం
banner_alt: రాత్రి వేళ ఆధునిక ఆర్థిక కార్యాలయం — CAMT, MT940, OFX, CSV బ్యాంకు స్టేట్‌మెంట్ ఆకృతుల్లో
  ఏకీకృత లావాదేవీ విజ్ఞానానికి ప్రతీక
sector: ఓపెన్ సోర్స్ · కార్పొరేట్ ట్రెజరీ · రిస్క్-డేటా సమీకరణ
role: రచయిత మరియు నిర్వాహకుడు
status: ఉత్పత్తిలో, చురుగ్గా నిర్వహిస్తున్నది
outcome_highlights:
- value: 6 ఆకృతులు
  label: CAMT (.052/.053/.054), MT940, OFX, CSV, OCR PDF
- value: ప్రతి క్షేత్రానికి
  label: 'మూలం: మూల ఆకృతి, పార్సర్ వెర్షన్ నమోదు చేయబడతాయి'
- label: రిస్క్-డేటా సమీకరణతో సమలేఖనం
- label: వాడటానికి, ఫోర్క్ చేయటానికి, ఆడిట్ చేయటానికి ఉచితం
pull_quote: «స్కీమాతో ధ్రువీకరించిన CAMT / MT940 / PAIN పార్సర్లు, స్కాన్ చేసిన PDF లకు OCR ప్రత్యామ్నాయం,
  నిర్ధారిత క్షేత్ర మ్యాపింగ్, SR 11-7 స్థాయి ఆడిట్ ఆధారాలు — ప్రతి మార్పిడి దశ నమోదవుతుంది, పునరుత్పత్తి
  చేయవచ్చు.»
problem: కార్పొరేట్ ట్రెజరీ బృందాలకు డజన్ల కొద్దీ బ్యాంకుల నుంచి CAMT, PAIN.001, MT940, OFX, CSV, స్కాన్
  చేసిన PDF ఆకృతుల్లో బ్యాంకు స్టేట్‌మెంట్లు వస్తాయి. ప్రతి ఆకృతికీ వేర్వేరు క్షేత్ర అర్థాలు, ఎన్‌కోడింగులు,
  అస్పష్టతలు ఉంటాయి. చాలా బృందాలు ప్రతి బ్యాంకుకూ పెళుసైన పార్సర్లను చేతితో కడతాయి; ఇది నిజ-సమయ నగదు అంచనా,
  మోసం గుర్తింపు, ఆడిట్‌కు సిద్ధమైన సమన్వయాన్ని అడ్డుకుంటుంది.
what_i_built: ప్రతి సాధారణ బ్యాంకు స్టేట్‌మెంట్ ఆకృతిని ఒకే, సాధారణీకరించిన లావాదేవీ ప్రవాహంగా ఏకం చేసే
  ఓపెన్ సోర్స్ పైథాన్ పనిముట్ల సమితి. స్కీమాతో ధ్రువీకరించిన CAMT / MT940 / PAIN పార్సర్లు, స్కాన్ చేసిన
  PDF లకు OCR ప్రత్యామ్నాయం, నిర్ధారిత క్షేత్ర మ్యాపింగ్, ప్రతి మార్పిడి దశకూ SR 11-7 స్థాయి ఆడిట్ ఆధారాలు.
rigour:
- metric: పార్స్ చేసే ఆకృతులు
  value: CAMT (.052, .053, .054), MT940, OFX, CSV, స్కాన్ చేసిన PDF (OCR)
- metric: సాధారణీకరణ
  value: ఒకే ఏకీకృత లావాదేవీ రికార్డు స్కీమా
- metric: ఆడిట్ జాడ
  value: ప్రతి క్షేత్రానికీ మూలం — ప్రతి వరుసకూ మూల ఆకృతి, పార్సర్ వెర్షన్ నమోదవుతాయి
- metric: లైసెన్సు
validation:
- '14/06/2026 రచనలో ప్రస్తావన: From Bank Statements to Unified Transaction Intelligence'
- BCBS 239 రిస్క్-డేటా సమీకరణ అవసరాలను తీర్చేలా రూపొందించబడింది
