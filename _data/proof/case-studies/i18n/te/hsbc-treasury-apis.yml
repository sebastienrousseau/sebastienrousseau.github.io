title: HSBC Treasury APIs — చెల్లింపులు మరియు Banking-as-a-Service
banner_alt: సిటీ ఆఫ్ లండన్ ఆకాశరేఖ — HSBC యొక్క Commercial & Investment Bank కార్యక్రమం కింద అందించిన
  ట్రెజరీ API వేదికకు ప్రతీక
sector: మొదటి శ్రేణి వాణిజ్య బ్యాంకు · కార్పొరేట్ ట్రెజరీ · నియంత్రిత చెల్లింపులు
role: సీనియర్ ఉత్పత్తి మరియు సాంకేతిక నాయకుడు
status: మొదటి శ్రేణి ప్రపంచ బ్యాంకులో ఉత్పత్తిలో నడుస్తున్నది
outcome_highlights:
- value: మొదటి శ్రేణి
  label: ప్రపంచ బ్యాంకు, Commercial & Investment Bank
- label: నియంత్రిత చెల్లింపు పరిధి
- value: ట్రెజరీ / BaaS
  label: ప్రోగ్రామ్ చేయగల నగదు, ద్రవ్యత, చెల్లింపు మార్గాలు
- value: బహుళ సంవత్సరాలు
  label: సీనియర్ ఉత్పత్తి మరియు సాంకేతిక నాయకత్వం
pull_quote: «బ్యాంకు నియంత్రణ పరిధిలోనే ఉత్పత్తి స్థాయి చెల్లింపు, నిల్వ, ద్రవ్యత API లను అందించాను —
  నిర్మాణం, విక్రేత సమన్వయం, పర్యవేక్షణ ఆధారాలు, మరియు DORA, SR 11-7 ఇప్పుడు తప్పనిసరి చేసే నిర్వహణ స్థితిస్థాపకత
  నియంత్రణల వరకు.»
problem: కార్పొరేట్ ట్రెజరీ బృందాలు మొదటి శ్రేణి బ్యాంకు లోపల నగదు నిర్వహణ, ద్రవ్యత, చెల్లింపు మార్గాలకు
  ప్రోగ్రామ్ చేయగల ప్రాప్యత కోరుతున్నాయి — బ్యాంకు తానే తయారుచేయాల్సిన పర్యవేక్షణ ఆధార పొరను వదులుకోకుండా.
what_i_built: Commercial & Investment Bank లోపల HSBC యొక్క ట్రెజరీ API లు, Banking-as-a-Service కార్యక్రమం
  కోసం ఉత్పత్తి, సాంకేతిక కార్యప్రవాహాలకు నాయకత్వం వహించాను; బ్యాంకు నియంత్రణ పరిధిలోనే ఉత్పత్తి స్థాయి
  చెల్లింపు, నిల్వ, ద్రవ్యత API లను అందించాను. నిర్మాణం, విక్రేత సమన్వయం, పర్యవేక్షణ ఆధారాలు, DORA, SR
  11-7 ఇప్పుడు తప్పనిసరి చేసే నిర్వహణ స్థితిస్థాపకత నియంత్రణలపై పనిచేశాను.
rigour:
- metric: పాత్ర
  value: CIB లోపల సీనియర్ ఉత్పత్తి, సాంకేతిక నాయకత్వం
- metric: పరిసరం
  value: FCA / PRA నియంత్రించే చెల్లింపు వేదిక
- metric: పరిధి
  value: ట్రెజరీ API లు, నిల్వ, నగదు నిర్వహణ, BaaS పంపిణీ
- metric: వాడేవారు
  value: బహుళజాతి సంస్థలు, రెండో శ్రేణి బ్యాంకుల్లోని కార్పొరేట్ ట్రెజరర్లు
validation:
- HSBC Commercial & Investment Bank లో బహిరంగ పాత్ర — LinkedIn ద్వారా ధ్రువీకరించవచ్చు
- కార్యక్రమ పరిధి గురించి / అనుభవం విభాగంలో ప్రస్తావించబడింది
