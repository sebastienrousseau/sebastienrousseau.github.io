title: KyberLib — Rust లో ఉత్పత్తి స్థాయి ML-KEM
banner_alt: క్వాంటం-సురక్షిత క్రిప్టోగ్రాఫిక్ కీ మార్పిడి — బ్యాంకింగ్‌లో FIPS 203 ML-KEM మార్పునకు ప్రతీక
sector: ఓపెన్ సోర్స్ · బ్యాంకింగ్ · ప్రమాణాలు
role: రచయిత మరియు నిర్వాహకుడు
status: ఉత్పత్తిలో, చురుగ్గా నిర్వహిస్తున్నది
outcome_highlights:
- label: NIST ప్రచురణ మార్గంతో సమలేఖనం
- value: పై 44 %
  label: సుమారు 182 PQC లైబ్రరీల్లో (Qtonic Lab)
- label: HSM లు, సురక్షిత ఎన్‌క్లేవ్‌లలో ఇమిడిపోతుంది
- value: 1 స్వీకర్త
  label: QGram (Quantum2pi) పోస్ట్-క్వాంటం సందేశకుడు
pull_quote: «Qtonic Quantum Lab — స్వతంత్ర పోస్ట్-క్వాంటం క్రిప్టోగ్రఫీ నమోదు సంస్థ — మూల్యాంకనం చేసింది;
  అంత్యం-నుంచి-అంత్యం గుప్తీకరించిన సందేశ వ్యవస్థ కోసం QGram (Quantum2pi) దీన్ని స్వీకరించింది. రెండింటినీ
  నా ద్వారా వెళ్లకుండానే ధ్రువీకరించవచ్చు.»
problem: 2026 నవంబర్ 14న SWIFT నిర్మాణాత్మక చిరునామా మార్పు, దానికంటే సుదీర్ఘమైన NIST పోస్ట్-క్వాంటం మార్పు
  కాలం బ్యాంకుల ముందున్నాయి. ఉన్న PQC అమలులు విధాన పత్రాలుగా, ప్రయోగశాల కోడ్‌గా లేదా యాజమాన్య HSM నల్లపెట్టెలుగా
  వస్తాయి — వీటిలో దేన్నీ ఒక చెల్లింపు నిర్మాణకర్త చదవలేడు, పరీక్షించలేడు, ఆమోదించలేడు.
what_i_built: KyberLib, FIPS 203 ML-KEM (CRYSTALS-Kyber) ను పరిశీలించగల Rust గా మారుస్తుంది. సంకర సాంప్రదాయ-మరియు-క్వాంటం
  హ్యాండ్‌షేక్‌లు, HSM లో పొదగడానికి no_std సంకలనం, క్రిప్టో-చురుకుదనం గల నైరూప్య సరిహద్దులు, మరియు అపారదర్శక
  సరఫరాదారు రిస్క్‌ను స్వీకరించకుండా PQC మార్పుకు మద్దతివ్వడానికి బోర్డులకు ఇప్పుడు అవసరమైన DORA ఆర్టికల్
  5 పాలనా ఆధారాలు.
rigour:
- metric: ప్రమాణం
- metric: సంకర పద్ధతి
  value: సాంప్రదాయ TLS + ML-KEM-768, X25519MLKEM768 పద్ధతిలో
- metric: పొదగడం
  value: no_std — HSM లు, సురక్షిత ఎన్‌క్లేవ్‌లు, పొదిగిన లక్ష్యాల్లో ఇమిడిపోతుంది
- metric: క్రిప్టో చురుకుదనం
  value: నైరూప్య సరిహద్దులు API మార్చకుండానే అల్గారిథమ్ మార్పును అనుమతిస్తాయి
- metric: లైసెన్సు
validation:
- EPAA Quantum-Safe Payments శ్వేతపత్రంలో ఉదహరణ (సెప్టెంబర్ 2025)
- '12/06/2026 రచనలో ప్రస్తావన: KyberLib and the Post-Quantum Banking Migration'
- NIST FIPS 203 / 204 / 205 ప్రచురణ మార్గంతో సమలేఖనం
- Qtonic Quantum Lab మూల్యాంకనం చేసింది — స్వతంత్ర పోస్ట్-క్వాంటం క్రిప్టోగ్రఫీ మూల్యాంకన నమోదు సంస్థ,
  సుమారు 182 PQC లైబ్రరీలు పరిశీలించబడ్డాయి (పై 44 %, చేర్చడానికి డబ్బు తీసుకోరు)
- QGram (Quantum2pi) స్వీకరించింది — సందేశాల గుప్తీకరణ కోసం KyberLib ను వాడే, అంత్యం-నుంచి-అంత్యం గుప్తీకరించిన,
  సమవర్తి-నుంచి-సమవర్తి పోస్ట్-క్వాంటం సందేశకుడు (f6s.com/software/qgram లో ధ్రువీకరించవచ్చు)
