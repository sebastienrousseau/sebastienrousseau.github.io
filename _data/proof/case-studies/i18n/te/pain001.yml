title: pain001 — ISO 20022 చెల్లింపు ఫైళ్ల స్వయంచాలకీకరణ
banner_alt: సంధ్యా వేళ నగరం వైమానిక దృశ్యం — ప్రపంచ పరిష్కార నెట్‌వర్క్‌లలో ISO 20022 కింద నిర్మాణాత్మక
  చెల్లింపు ఫైళ్ల స్వయంచాలకీకరణకు ప్రతీక
sector: ఓపెన్ సోర్స్ · కార్పొరేట్ ట్రెజరీ · ISO 20022
role: రచయిత మరియు నిర్వాహకుడు
status: ఉత్పత్తిలో, చురుగ్గా నిర్వహిస్తున్నది
outcome_highlights:
- label: Customer Credit Transfer Initiation
- value: XSD తో ధ్రువీకరించినది
  label: ప్రతి సందేశంపై ముందస్తు తనిఖీ
- label: ISO 7064 Modulo 97-10 తనిఖీ మొత్తాలు
- label: వాడటానికి, ఫోర్క్ చేయటానికి, ఆడిట్ చేయటానికి ఉచితం
pull_quote: «EPAA Quantum-Safe Payments శ్వేతపత్రంలో (సెప్టెంబర్ 2025) ఉదహరించబడింది. ఓపెన్ సోర్స్, మొదటి
  రోజు నుంచే ఆడిట్ చేయబడింది — మీ ERP వ్యవస్థకూ పరిష్కార నెట్‌వర్క్‌కూ మధ్య ఎలాంటి యాజమాన్య అనువాదకుడూ
  లేడు.»
problem: ప్రపంచ MT → MX మార్పు ప్రతి బ్యాంకునూ, ప్రతి కార్పొరేట్ ట్రెజరీనీ నిర్మాణాత్మక pain.001 సందేశాలు
  తయారుచేయాల్సిందిగా బలవంతం చేస్తుంది. చాలా బృందాలు పెళుసైన XML ను చేతితో రాస్తాయి లేదా అపారదర్శక యాజమాన్య
  అనువాదకులను కొంటాయి. రెండు దారులూ పరిష్కార నెట్‌వర్క్‌లలోకి చెల్లింపు లోపాలను పంపుతాయి, ఎలాంటి ఆడిట్
  జాడనూ మిగల్చవు.
what_i_built: CSV / SQLite / Parquet నుంచి ధ్రువీకరించిన ISO 20022 pain.001 (Customer Credit Transfer
  Initiation) సందేశాలను తయారుచేసే ఓపెన్ సోర్స్ పైథాన్ లైబ్రరీ. ముందస్తు XSD ధ్రువీకరణ, IBAN / BIC తనిఖీ
  మొత్తాలు, వ్యక్తిగత సమాచార ముసుగు, పూర్తి XSD స్కీమా అనుసరణ — ఇవన్నీ ఇప్పటికే ఉన్న ERP, ట్రెజరీ మార్గాల్లో
  ఇమిడే పైథాన్ కార్యప్రవాహంలోనే.
rigour:
- metric: మద్దతు ఉన్న ISO 20022 సందేశాలు
- metric: స్కీమా అనుసరణ
  value: ప్రతి సందేశంపై అధికారిక XSD ధ్రువీకరణ ముందస్తుగా
- metric: అందించిన ధ్రువీకరణలు
  value: IBAN తనిఖీ అంకె + BIC, LEI తనిఖీ మొత్తం (ISO 7064 Modulo 97-10)
- metric: లైసెన్సు
  value: Apache-2.0 / MIT — వాడటానికి, ఫోర్క్ చేయటానికి, ఆడిట్ చేయటానికి ఉచితం
validation:
- EPAA Quantum-Safe Payments శ్వేతపత్రంలో ఉదహరణ (సెప్టెంబర్ 2025)
- sebastienrousseau.com లో 09/2023 నుంచి ప్రచురితమైన రచనల్లో ప్రస్తావన
