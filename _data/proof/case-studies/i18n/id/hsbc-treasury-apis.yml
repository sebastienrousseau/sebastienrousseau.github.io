pull_quote: >
  "Mengirim API pembayaran, saldo, dan likuiditas ke produksi di dalam
  perimeter regulasi bank — mencakup arsitektur, integrasi vendor, bukti
  supervisi, dan kontrol ketahanan operasional yang kini diwajibkan DORA
  dan SR 11-7."

problem: >
  Tim treasury korporat menuntut akses programatik ke manajemen kas,
  likuiditas, dan rel pembayaran di dalam bank Tier-1 — tanpa
  mengorbankan lapisan bukti regulasi yang harus dihasilkan bank itu
  sendiri.

what_i_built: >
  Memimpin alur kerja produk dan teknologi untuk program API treasury
  dan Banking-as-a-Service HSBC di dalam Commercial & Investment Bank,
  mengirim API pembayaran, saldo, dan likuiditas ke produksi di dalam
  perimeter regulasi bank. Bekerja lintas arsitektur, integrasi vendor,
  bukti supervisi, dan kontrol ketahanan operasional yang kini
  diwajibkan DORA dan SR 11-7.

