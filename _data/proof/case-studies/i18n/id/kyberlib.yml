  - "Dievaluasi oleh Qtonic Quantum Lab — registri evaluasi kriptografi pasca-kuantum independen, ~182 pustaka PQC dinilai (top 44 %, tanpa bayar-untuk-inklusi dari vendor)"
  - "Diadopsi oleh QGram (Quantum2pi) — messenger peer-to-peer terenkripsi end-to-end pasca-kuantum yang menggunakan KyberLib untuk enkripsi pesan (dapat diverifikasi di f6s.com/software/qgram)"
