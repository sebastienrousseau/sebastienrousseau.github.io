pull_quote: >
  "Dikutip dalam white paper EPAA Quantum-Safe Payments (September 2025).
  Sumber terbuka, diaudit sejak hari pertama — tanpa translator
  proprietari antara ERP Anda dan jaringan kliring."

problem: >
  Migrasi MT → MX global memaksa setiap bank dan treasury korporat untuk
  menghasilkan pesan pain.001 terstruktur. Sebagian besar tim merakit
  XML rapuh secara manual atau membeli translator proprietari yang
  buram. Kedua jalur tersebut mengirim kesalahan pembayaran ke jaringan
  kliring dan tidak meninggalkan jejak audit.

what_i_built: >
  Pustaka Python sumber terbuka yang menghasilkan pesan pain.001 ISO
  20022 (Customer Credit Transfer Initiation) tervalidasi dari CSV /
  SQLite / Parquet. Validasi XSD pre-flight, checksum IBAN / BIC,
  masking PII, dan kesesuaian skema XSD penuh — semuanya di dalam alur
  kerja Python yang menyatu dengan jalur ERP dan treasury yang ada.

