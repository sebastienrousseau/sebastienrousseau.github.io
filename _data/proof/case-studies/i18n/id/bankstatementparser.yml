pull_quote: >
  "Parser CAMT / MT940 / PAIN tervalidasi skema, fallback OCR untuk PDF
  hasil pindai, pemetaan kolom deterministik, bukti audit setara SR 11-7
  — setiap langkah transformasi tercatat dan dapat direproduksi."

problem: >
  Tim treasury korporat menerima rekening koran dalam format CAMT,
  PAIN.001, MT940, OFX, CSV, dan PDF hasil pindai dari puluhan bank.
  Setiap format membawa semantik kolom, encoding, dan ambiguitas yang
  berbeda. Sebagian besar tim membangun parser per-bank yang rapuh
  secara manual, menghambat peramalan kas real-time, deteksi fraud,
  dan rekonsiliasi siap audit.

what_i_built: >
  Toolkit Python sumber terbuka yang menyatukan setiap format rekening
  koran bank yang umum menjadi satu aliran transaksi yang dinormalisasi.
  Parser CAMT / MT940 / PAIN tervalidasi skema, fallback OCR untuk PDF
  hasil pindai, pemetaan kolom deterministik, dan bukti audit setara
  SR 11-7 untuk setiap langkah transformasi.

