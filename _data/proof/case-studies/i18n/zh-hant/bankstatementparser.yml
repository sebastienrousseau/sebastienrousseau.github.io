pull_quote: >
  「經 schema 驗證的 CAMT / MT940 / PAIN.001 解析器，掃描 PDF
  的 OCR 備援機制，具決定論性的欄位映射，以及達 SR 11-7
  等級的稽核證據——每一個轉換步驟均完整記錄並可重現。」

problem: >
  企業財資團隊每日須從數十家銀行接收 CAMT、PAIN.001、MT940、
  OFX、CSV 及掃描 PDF 等多種格式的對帳單。各種格式的欄位語
  義、編碼與歧義皆不相同。多數團隊只能自行打造脆弱的逐行
  解析器，導致即時現金預測、舞弊偵測與可稽核的對帳作業均
  受阻。

what_i_built: >
  一套開源 Python 工具組，能將所有常見的銀行對帳單格式整
  併為單一、標準化的交易資料流。內建經 schema 驗證的 CAMT /
  MT940 / PAIN.001 解析器、掃描 PDF 的 OCR 備援機制、具決定
  論性的欄位映射，並為每一個轉換步驟提供達 SR 11-7 等級的
  稽核證據。

