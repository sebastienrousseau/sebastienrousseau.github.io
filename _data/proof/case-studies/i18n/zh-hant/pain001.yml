pull_quote: >
  「獲 EPAA《抗量子支付》白皮書引用（2025 年 9 月）。
  開源、自發布日起即可稽核——無須在 ERP 與清算網絡之
  間夾入任何專有翻譯器。」

problem: >
  全球 MT → MX 遷移迫使每一家銀行與企業財資皆須產出
  結構化的 pain.001 訊息。多數團隊不是自行拼湊脆弱的
  XML，便是採購不透明的專有翻譯器。兩條路線皆會把支
  付錯誤送入清算網絡，且未留下任何稽核軌跡。

what_i_built: >
  一套開源 Python 函式庫，能由 CSV / SQLite / Parquet
  產出已驗證的 ISO 20022 pain.001（客戶信用轉帳發起）
  訊息。內建發送前 XSD 驗證、IBAN / BIC 檢核碼、PII
  遮罩，及完整的 XSD 結構符合性——所有功能皆封裝於可
  直接嵌入既有 ERP 與財資工作流的 Python 流程內。

