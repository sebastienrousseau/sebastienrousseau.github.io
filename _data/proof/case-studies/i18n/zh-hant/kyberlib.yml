pull_quote: >
  「經 Qtonic Quantum Lab——獨立的抗量子密碼登錄處——評估，
  並由 QGram（Quantum2pi）端對端加密訊息應用程式採用。兩
  項驗證均可於本人之外獨立查證。」

problem: >
  銀行業正面臨 2026 年 11 月 14 日 SWIFT 結構化地址切換期
  限，以及更長的 NIST 抗量子遷移窗口。現有 PQC 實作多以
  政策論文、實驗室程式或專有 HSM 黑盒形式發布——三者均
  不便支付架構師閱讀、測試或簽章。

what_i_built: >
  KyberLib 將 FIPS 203 ML-KEM（CRYSTALS-Kyber）轉化為可
  檢視的 Rust 實作。內建傳統加抗量子的混合握手、可供 HSM
  內嵌的 no_std 編譯模式、加密敏捷性抽象邊界，以及董事會在
  推動 PQC 遷移時、規避不透明廠商風險所需之 DORA 第 5 條
  治理證據。

