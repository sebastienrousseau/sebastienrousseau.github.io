pull_quote: >
  "Citováno v bílé knize EPAA Quantum-Safe Payments (září 2025).
  Open-source, auditovatelné od prvního dne — žádný proprietární
  překladač mezi vaším ERP a clearingovou sítí."

problem: >
  Globální migrace MT → MX nutí každou banku a korporátní treasury
  produkovat strukturované zprávy pain.001. Většina týmů buď ručně píše
  křehké XML, nebo nakupuje neprůhledné proprietární překladače. Obě
  cesty posílají platební chyby do clearingových sítí a nezanechávají
  žádnou auditní stopu.

what_i_built: >
  Open-source Python knihovna, která generuje validované zprávy
  ISO 20022 pain.001 (Customer Credit Transfer Initiation) z CSV /
  SQLite / Parquet. Pre-flight XSD validace, kontrolní součty IBAN /
  BIC, maskování PII a plná shoda se schématem XSD — to vše uvnitř
  Python workflow, který zapadne do stávajících ERP a treasury pipeline.

