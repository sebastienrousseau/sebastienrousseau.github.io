pull_quote: >
  "Parsery CAMT / MT940 / PAIN validované proti schématu, OCR záloha pro
  skenovaná PDF, deterministické mapování polí, auditní důkazy úrovně
  SR 11-7 — každý krok transformace zaznamenán a reprodukovatelný."

problem: >
  Korporátní treasury týmy přijímají bankovní výpisy ve formátech CAMT,
  PAIN.001, MT940, OFX, CSV a jako skenovaná PDF od desítek bank. Každý
  formát nese odlišnou sémantiku polí, kódování a nejednoznačnosti.
  Většina týmů ručně staví křehké parsery pro každou banku zvlášť, což
  blokuje cash forecasting v reálném čase, detekci podvodů a auditně
  připravenou rekonciliaci.

what_i_built: >
  Open-source Python sada, která sjednocuje každý běžný formát
  bankovního výpisu do jediného normalizovaného toku transakcí. Parsery
  CAMT / MT940 / PAIN validované proti schématu, OCR záloha pro
  skenovaná PDF, deterministické mapování polí a auditní důkazy úrovně
  SR 11-7 pro každý krok transformace.

