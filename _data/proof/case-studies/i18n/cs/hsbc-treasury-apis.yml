pull_quote: >
  "Dodal jsem produkční API pro platby, zůstatky a likviditu v rámci
  regulatorního perimetru banky — napříč architekturou, integrací
  dodavatelů, dohledovými důkazy a kontrolami provozní odolnosti, které
  nyní vyžadují DORA a SR 11-7."

problem: >
  Korporátní treasury týmy vyžadují programovatelný přístup k cash
  managementu, likviditě a platební infrastruktuře uvnitř banky úrovně
  Tier-1 — aniž by se vzdaly vrstvy regulatorních důkazů, kterou musí
  produkovat samotná banka.

what_i_built: >
  Vedl jsem produktové a technologické workstreamy pro program treasury
  API a Banking-as-a-Service v HSBC Commercial & Investment Bank,
  dodával jsem produkční API pro platby, zůstatky a likviditu v rámci
  regulatorního perimetru banky. Pracoval jsem napříč architekturou,
  integrací dodavatelů, dohledovými důkazy a kontrolami provozní
  odolnosti, které nyní vyžadují DORA a SR 11-7.

