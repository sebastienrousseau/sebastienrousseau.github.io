pull_quote: >
  "Puesta en producción de API de pagos, saldos y liquidez contra el
  perímetro regulatorio del banco, abarcando arquitectura, integración con
  proveedores, evidencia supervisora y los controles de resiliencia
  operacional que DORA y SR 11-7 ahora exigen."

problem: >
  Los equipos de tesorería corporativa exigen acceso programable a la
  gestión de caja, la liquidez y los rieles de pago dentro de un banco
  Tier-1, sin renunciar a la capa de evidencia regulatoria que el propio
  banco debe producir.

what_i_built: >
  Lideré los frentes de producto y tecnología del programa de API de
  tesorería y Banking-as-a-Service de HSBC dentro del Commercial &
  Investment Bank, poniendo en producción API de pagos, saldos y liquidez
  contra el perímetro regulatorio del banco. Trabajé en arquitectura,
  integración con proveedores, evidencia supervisora y los controles de
  resiliencia operacional que DORA y SR 11-7 ahora exigen.

