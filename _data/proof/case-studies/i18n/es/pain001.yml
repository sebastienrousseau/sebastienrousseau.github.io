pull_quote: >
  "Citada en el documento técnico EPAA Quantum-Safe Payments (septiembre de
  2025). Código abierto, auditada desde el primer día: sin traductor
  propietario entre su ERP y la red de compensación."

problem: >
  La migración global MT a MX obliga a cada banco y tesorería corporativa a
  producir mensajes pain.001 estructurados. La mayoría de los equipos
  escribe a mano XML frágil o compra traductores propietarios opacos. Ambas
  vías introducen errores de pago en las redes de compensación y no dejan
  pista de auditoría.

what_i_built: >
  Una librería Python de código abierto que genera mensajes ISO 20022
  pain.001 (Customer Credit Transfer Initiation) validados a partir de
  CSV / SQLite / Parquet. Validación XSD previa al vuelo, sumas de
  verificación IBAN / BIC, enmascarado de PII y conformidad total con el
  esquema XSD, todo dentro de un flujo Python que se integra en los
  pipelines existentes de ERP y tesorería.

