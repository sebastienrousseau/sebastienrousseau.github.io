title: "pain001 — automatización de archivos de pago ISO 20022"
banner_alt: "Vista aérea de la ciudad al atardecer — simboliza la automatización de archivos de pago estructurados bajo ISO 20022 en redes de compensación globales"
sector: "Código abierto · Tesorería corporativa · ISO 20022"
role: "Autor y mantenedor"
status: "En producción, mantenido activamente"

