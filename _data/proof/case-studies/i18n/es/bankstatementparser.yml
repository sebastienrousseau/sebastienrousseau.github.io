pull_quote: >
  "Analizadores CAMT / MT940 / PAIN validados por esquema, alternativa OCR
  para PDF escaneados, mapeo de campos determinista y evidencia de auditoría
  con calidad SR 11-7: cada paso de transformación queda registrado y es
  reproducible."

problem: >
  Los equipos de tesorería corporativa reciben extractos bancarios en CAMT,
  PAIN.001, MT940, OFX, CSV y PDF escaneados de decenas de bancos. Cada
  formato impone semántica de campos, codificaciones y ambigüedades
  distintas. La mayoría de los equipos construye a mano analizadores
  frágiles por banco, bloqueando la previsión de caja en tiempo real, la
  detección de fraude y la conciliación lista para auditoría.

what_i_built: >
  Un conjunto de herramientas Python de código abierto que unifica todos los
  formatos habituales de extracto bancario en un flujo único y normalizado
  de transacciones. Analizadores CAMT / MT940 / PAIN validados por esquema,
  alternativa OCR para PDF escaneados, mapeo de campos determinista y
  evidencia de auditoría con calidad SR 11-7 para cada paso de
  transformación.

