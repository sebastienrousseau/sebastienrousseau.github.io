title: "CloudCDN — открытый проект для AI-native edge"
banner_alt: "Инфраструктура AI-native edge — символ zero-trust MCP-шлюза, атомарного rate limiting на Durable Objects и периметра с WebAuthn-passkey, который CloudCDN поставляет как референсную реализацию"
sector: "Open source · Edge · AI-инфраструктура"
role: "Автор и сопровождающий"
status: "Промышленная эксплуатация, активная поддержка"

outcome_highlights:
  - value: "3 185 тестов"
    label: "100 % покрытия по строкам, ветвям и функциям"
  - value: "SLSA L3"
    label: "Происхождение сборки + подпись Sigstore"
  - value: "42 инструмента MCP"
    label: "Каждый вызов журналируется со структурированными доказательствами"
  - value: "DORA / BCBS 239"
    label: "Сопоставление со статьёй 5 и агрегацией рисковых данных"

pull_quote: >
  «Открытая референсная реализация, которую команда безопасности может
  прочитать, форкнуть и подписать — вместо маркетингового PDF.
  Атомарный rate limiting на Durable Objects, периметр на WebAuthn,
  происхождение сборки уровня SLSA L3.»

problem: >
  По мере того как AI-агенты и инструменты MCP начинают массово
  обращаться к edge-API, банкам нужен периметр, выдерживающий
  автономный трафик без потери аудиторских доказательств уровня DORA.
  Существующие CDN предлагают либо маркетинговый язык, либо непрозрачные
  тарифы — ни то, ни другое не даёт референсной реализации, которую
  команда безопасности может прочитать, форкнуть и подписать.

what_i_built: >
  Открытый zero-trust MCP-шлюз с 42 инструментами, атомарным
  rate limiting на Durable Objects, периметром на WebAuthn-passkey,
  подписанными URL и происхождением сборки уровня SLSA Level 3.
  3 185 тестов при 100 % покрытии, сопоставленных со статьёй 5 DORA,
  агрегацией рисковых данных BCBS 239 и капиталом по операционному
  риску Basel III.

