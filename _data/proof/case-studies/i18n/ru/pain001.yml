pull_quote: >
  «Упомянута в white paper EPAA Quantum-Safe Payments (сентябрь 2025).
  Открытый код, проверяемый с первого дня — без проприетарного
  транслятора между ERP и клиринговой сетью.»

problem: >
  Глобальная миграция MT → MX вынуждает каждый банк и корпоративное
  казначейство формировать структурированные сообщения pain.001.
  Большинство команд вручную собирают хрупкий XML или покупают
  непрозрачные проприетарные трансляторы. Оба пути отправляют ошибки
  платежей в клиринговые сети и не оставляют аудиторского следа.

what_i_built: >
  Открытая Python-библиотека, генерирующая валидированные сообщения
  ISO 20022 pain.001 (Customer Credit Transfer Initiation) из CSV /
  SQLite / Parquet. Пред-валидация по XSD, контрольные суммы IBAN /
  BIC, маскирование PII и полное соответствие XSD-схеме — всё внутри
  Python-процесса, встраиваемого в существующие ERP- и казначейские
  конвейеры.

