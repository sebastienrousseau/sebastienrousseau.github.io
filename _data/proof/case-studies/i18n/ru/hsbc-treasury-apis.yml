pull_quote: >
  «Запустил в промышленную эксплуатацию платёжные, балансовые и
  ликвидностные API в рамках регуляторного периметра банка — охватив
  архитектуру, интеграцию вендоров, надзорные доказательства и контроли
  операционной устойчивости, обязательные сегодня по DORA и SR 11-7.»

problem: >
  Корпоративные казначейства требуют программируемого доступа к
  управлению ликвидностью, денежными средствами и платёжными рельсами
  внутри банка уровня Tier-1 — без потери слоя регуляторных
  доказательств, который банк обязан формировать сам.

what_i_built: >
  Возглавил продуктовые и технологические рабочие потоки программы
  казначейских API и Banking-as-a-Service в Commercial & Investment Bank
  HSBC, выведя в промышленную эксплуатацию платёжные, балансовые и
  ликвидностные API в рамках регуляторного периметра банка. Работа
  охватывала архитектуру, интеграцию вендоров, надзорные доказательства
  и контроли операционной устойчивости, обязательные сегодня по DORA
  и SR 11-7.

