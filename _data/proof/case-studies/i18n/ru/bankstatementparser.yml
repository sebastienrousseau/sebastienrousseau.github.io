title: "BankStatementParser — единая аналитика транзакций для казначейства"
banner_alt: "Современный финансовый офис ночью — символ единой аналитики транзакций по форматам банковских выписок CAMT, MT940, OFX и CSV"
sector: "Open source · Корпоративное казначейство · Агрегация рисковых данных"
role: "Автор и сопровождающий"
status: "Промышленная эксплуатация, активная поддержка"

outcome_highlights:
  - value: "6 форматов"
    label: "CAMT (.052/.053/.054), MT940, OFX, CSV, OCR PDF"
  - value: "По каждому полю"
    label: "Происхождение: исходный формат и версия парсера фиксируются"
  - value: "BCBS 239"
    label: "Соответствует требованиям к агрегации рисковых данных"
  - value: "Apache-2.0 / MIT"
    label: "Свободно использовать, форкать, проверять"

pull_quote: >
  «Парсеры CAMT / MT940 / PAIN с проверкой по схеме, OCR-резерв для
  сканированных PDF, детерминированное сопоставление полей, аудиторские
  доказательства уровня SR 11-7 — каждый шаг преобразования фиксируется
  и воспроизводится.»

problem: >
  Корпоративные казначейства получают банковские выписки в форматах
  CAMT, PAIN.001, MT940, OFX, CSV и сканированных PDF от десятков банков.
  Каждый формат несёт свою семантику полей, кодировки и неоднозначности.
  Большинство команд вручную собирают хрупкие парсеры под каждый банк,
  что блокирует прогноз ликвидности в реальном времени, выявление
  мошенничества и сверку, готовую к аудиту.

what_i_built: >
  Открытый Python-инструментарий, который сводит все распространённые
  форматы банковских выписок в единый нормализованный поток транзакций.
  Парсеры CAMT / MT940 / PAIN с проверкой по схеме, OCR-резерв для
  сканированных PDF, детерминированное сопоставление полей и аудиторские
  доказательства уровня SR 11-7 для каждого шага преобразования.

