  - "Описана в статье от 2026-06-12: «KyberLib и постквантовая банковская миграция»"
  - "Соответствует публикационному треку NIST FIPS 203 / 204 / 205"
  - "Оценена Qtonic Quantum Lab — независимым реестром оценки постквантовой криптографии, охватившим ~182 PQC-библиотеки (топ 44 %, без платного включения вендоров)"
  - "Принята QGram (Quantum2pi) — постквантовым P2P-мессенджером со сквозным шифрованием, использующим KyberLib для шифрования сообщений (проверяется на f6s.com/software/qgram)"
