title: "KyberLib — промышленная реализация ML-KEM на Rust"
banner_alt: "Квантово-устойчивый обмен криптографическими ключами — символ перехода на FIPS 203 ML-KEM в банковском секторе"
sector: "Open source · Банкинг · Стандарты"
role: "Автор и сопровождающий"
status: "Промышленная эксплуатация, активная поддержка"

outcome_highlights:
  - value: "FIPS 203"
    label: "Соответствует публикационному треку NIST"
  - value: "Топ 44 %"
    label: "Из ~182 PQC-библиотек (Qtonic Lab)"
  - value: "no_std"
    label: "Встраивается в HSM и защищённые анклавы"
  - value: "1 внедрение"
    label: "Постквантовый мессенджер QGram (Quantum2pi)"

pull_quote: >
  «Оценена Qtonic Quantum Lab — независимым реестром постквантовой
  криптографии — и принята QGram (Quantum2pi) для сквозного шифрования
  переписки. Оба факта проверяются без участия автора.»

problem: >
  Банки сталкиваются с переходом SWIFT на структурированные адреса
  14 ноября 2026 года и более длинным окном постквантовой миграции
  NIST. Существующие реализации PQC поставляются как политические
  документы, лабораторный код или закрытые HSM — ни одну из этих
  форм платёжный архитектор не может прочитать, протестировать или
  подписать.

what_i_built: >
  KyberLib превращает FIPS 203 ML-KEM (CRYSTALS-Kyber) в проверяемый
  код на Rust. Гибридные классическо-квантовые рукопожатия, компиляция
  no_std для встраивания в HSM, абстракции для криптоагильности и
  доказательства управления по статье 5 DORA, необходимые советам
  директоров для поддержки PQC-миграции без принятия непрозрачного
  риска вендора.

rigour:
  - metric: "Криптографический стандарт"
    value: "FIPS 203 (ML-KEM, ранее CRYSTALS-Kyber)"
  - metric: "Поддержка гибридного рукопожатия"
    value: "Классический TLS + режим ML-KEM-768 X25519MLKEM768"
  - metric: "Компиляция"
    value: "no_std — встраивается в HSM, защищённые анклавы, embedded-цели"
  - metric: "Криптоагильность"
    value: "Абстракции позволяют менять алгоритм без изменения API"
  - metric: "Лицензия"
    value: "Apache-2.0 / MIT"

validation:
