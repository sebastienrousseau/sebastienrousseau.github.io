pull_quote: >
  "Qtonic Quantum Lab — स्वतंत्र पोस्ट-क्वांटम क्रिप्टोग्राफ़ी रजिस्ट्री —
  द्वारा मूल्यांकित, और QGram (Quantum2pi) द्वारा एंड-टू-एंड एन्क्रिप्टेड
  मैसेजिंग के लिए अपनाया गया। दोनों मेरे माध्यम से गए बिना सत्यापन योग्य।"

problem: >
  बैंकों के सामने 14 नवंबर, 2026 की SWIFT संरचित-पता कटओवर और एक लंबी
  NIST पोस्ट-क्वांटम माइग्रेशन विंडो है। मौजूदा PQC कार्यान्वयन नीति
  पत्रों, प्रयोगशाला कोड, या स्वामित्व HSM ब्लैक बॉक्स के रूप में आते
  हैं — जिनमें से किसी को भी एक भुगतान आर्किटेक्ट पढ़, परीक्षण या
  हस्ताक्षर नहीं कर सकता।

what_i_built: >
  KyberLib FIPS 203 ML-KEM (CRYSTALS-Kyber) को निरीक्षण-योग्य Rust में
  बदल देता है। हाइब्रिड शास्त्रीय-प्लस-क्वांटम हैंडशेक, HSM एम्बेडिंग के
  लिए no_std संकलन, क्रिप्टो-चपल अमूर्तन सीमाएँ, और DORA अनुच्छेद 5
  गवर्नेंस प्रमाण जिनकी बोर्डों को अब अपारदर्शी विक्रेता जोखिम लिए
  बिना PQC माइग्रेशन का समर्थन करने के लिए आवश्यकता है।

