pull_quote: >
  "एक ओपन-सोर्स संदर्भ कार्यान्वयन जिसे सुरक्षा टीम पढ़, फोर्क और
  हस्ताक्षर कर सकती है — मार्केटिंग PDF के बजाय। परमाणु Durable Objects
  रेट लिमिटिंग, WebAuthn परिधि, SLSA L3 उद्गम-प्रमाण।"

problem: >
  जैसे-जैसे AI एजेंट और MCP टूल बड़े पैमाने पर एज APIs को कॉल करना
  शुरू करते हैं, बैंकों को एक ऐसी परिधि की आवश्यकता है जो DORA-स्तर
  के ऑडिट प्रमाण से समझौता किए बिना स्वायत्त ट्रैफ़िक को संभाल सके।
  मौजूदा CDNs या तो मार्केटिंग भाषा या अपारदर्शी योजनाएँ प्रस्तुत
  करते हैं — कोई भी ऐसा संदर्भ कार्यान्वयन प्रदान नहीं करता जिसे
  सुरक्षा टीम पढ़, फोर्क और हस्ताक्षर कर सके।

what_i_built: >
  42 टूल वाला एक ओपन-सोर्स, शून्य-विश्वास MCP गेटवे, परमाणु Durable
  Objects रेट लिमिटिंग, WebAuthn पासकी परिधि, हस्ताक्षरित URLs, और
  SLSA Level 3 बिल्ड उद्गम-प्रमाण। 100 % कवरेज पर 3,185 परीक्षण,
  DORA अनुच्छेद 5, BCBS 239 जोखिम-डेटा एकत्रीकरण, और Basel III
  परिचालन जोखिम पूँजी से मैप किया गया।

