what_i_built: >
  Commercial & Investment Bank के अंदर HSBC के ट्रेज़री APIs और
  Banking-as-a-Service कार्यक्रम के उत्पाद और प्रौद्योगिकी कार्यधाराओं
  का नेतृत्व किया, बैंक की नियामक परिधि के विरुद्ध उत्पादन भुगतान,
  बैलेंस और तरलता APIs प्रदान कीं। आर्किटेक्चर, विक्रेता एकीकरण,
  पर्यवेक्षी प्रमाण और परिचालन-लचीलापन नियंत्रणों में काम किया जिन्हें
  DORA और SR 11-7 अब अनिवार्य करते हैं।

