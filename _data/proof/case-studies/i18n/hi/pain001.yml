pull_quote: >
  "EPAA Quantum-Safe Payments श्वेत पत्र (सितंबर 2025) में उद्धृत।
  ओपन-सोर्स, पहले दिन से ऑडिट किया गया — आपके ERP और क्लियरिंग नेटवर्क
  के बीच कोई स्वामित्व अनुवादक नहीं।"

problem: >
  वैश्विक MT → MX माइग्रेशन प्रत्येक बैंक और कॉर्पोरेट ट्रेज़री को
  संरचित pain.001 संदेश उत्पन्न करने के लिए बाध्य करता है। अधिकांश
  टीमें नाज़ुक XML हाथ से बनाती हैं या अपारदर्शी स्वामित्व अनुवादक
  खरीदती हैं। दोनों मार्ग क्लियरिंग नेटवर्क में भुगतान त्रुटियाँ भेजते
  हैं और कोई ऑडिट ट्रेल नहीं छोड़ते।

what_i_built: >
  एक ओपन-सोर्स Python लाइब्रेरी जो CSV / SQLite / Parquet से सत्यापित
  ISO 20022 pain.001 (Customer Credit Transfer Initiation) संदेश उत्पन्न
  करती है। प्री-फ़्लाइट XSD सत्यापन, IBAN / BIC चेकसम, PII मास्किंग,
  और पूर्ण XSD स्कीमा अनुरूपता — सब कुछ एक Python वर्कफ़्लो के अंदर
  जो मौजूदा ERP और ट्रेज़री पाइपलाइनों में सीधे एकीकृत होता है।

