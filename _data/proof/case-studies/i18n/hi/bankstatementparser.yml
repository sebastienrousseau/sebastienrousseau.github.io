problem: >
  कॉर्पोरेट ट्रेज़री टीमें दर्जनों बैंकों से CAMT, PAIN.001, MT940, OFX,
  CSV और स्कैन की गई PDF में बैंक स्टेटमेंट प्राप्त करती हैं। प्रत्येक
  प्रारूप में भिन्न फ़ील्ड शब्दार्थ, एन्कोडिंग और अस्पष्टताएँ होती हैं।
  अधिकांश टीमें प्रति-बैंक नाज़ुक पार्सर हाथ से बनाती हैं, जिससे
  वास्तविक-समय नकदी पूर्वानुमान, धोखाधड़ी का पता लगाना और ऑडिट-तैयार
  समाधान अवरुद्ध हो जाता है।

what_i_built: >
  एक ओपन-सोर्स Python टूलकिट जो हर सामान्य बैंक स्टेटमेंट प्रारूप को एक
  ही, सामान्यीकृत लेनदेन धारा में एकीकृत करता है। स्कीमा-सत्यापित CAMT /
  MT940 / PAIN पार्सर, स्कैन की गई PDF के लिए OCR फ़ॉलबैक, नियतात्मक
  फ़ील्ड मैपिंग, और प्रत्येक रूपांतरण चरण के लिए SR 11-7-स्तरीय ऑडिट
  प्रमाण।

