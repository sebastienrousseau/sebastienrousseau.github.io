  - "นำไปใช้โดย QGram (Quantum2pi) — เมสเซนเจอร์เพียร์ทูเพียร์ทนควอนตัมที่เข้ารหัสปลายทางถึงปลายทาง ซึ่งใช้ KyberLib สำหรับการเข้ารหัสข้อความ (ตรวจสอบได้ที่ f6s.com/software/qgram)"
