  - metric: "การคอมไพล์"
    value: "no_std — ฝังตัวใน HSM, secure enclaves, อุปกรณ์ฝังตัวได้"
  - metric: "ความคล่องตัวของการเข้ารหัส"
    value: "ขอบเขตการแยกส่วนรองรับการเปลี่ยนอัลกอริทึมโดยไม่ต้องเปลี่ยน API"
  - metric: "ใบอนุญาต"
    value: "Apache-2.0 / MIT"

