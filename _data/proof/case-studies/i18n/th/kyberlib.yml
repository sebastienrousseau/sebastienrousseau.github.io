title: "KyberLib — ML-KEM ระดับโปรดักชันบน Rust"
banner_alt: "การแลกเปลี่ยนกุญแจเข้ารหัสที่ทนต่อควอนตัม — สื่อถึงการย้ายระบบไปสู่ FIPS 203 ML-KEM ในวงการธนาคาร"
sector: "โอเพนซอร์ส · ธนาคาร · มาตรฐาน"
role: "ผู้เขียนและผู้ดูแลโครงการ"
status: "ใช้งานจริง อยู่ระหว่างการดูแลอย่างต่อเนื่อง"

outcome_highlights:
  - value: "FIPS 203"
    label: "สอดคล้องกับเส้นทางการเผยแพร่ของ NIST"
  - value: "Top 44 %"
    label: "จากไลบรารี PQC ราว 182 รายการ (Qtonic Lab)"
  - value: "no_std"
    label: "ฝังตัวใน HSM และ secure enclaves ได้"
  - value: "1 adopter"
    label: "QGram (Quantum2pi) เมสเซนเจอร์ทนควอนตัม"

pull_quote: >
  "ประเมินโดย Qtonic Quantum Lab — ทะเบียนการเข้ารหัสทนควอนตัมอิสระ —
  และนำไปใช้โดย QGram (Quantum2pi) สำหรับการส่งข้อความเข้ารหัสปลายทาง
  ถึงปลายทาง ตรวจสอบได้ทั้งสองรายการโดยไม่ต้องผ่านตัวผม"

problem: >
  ธนาคารต้องเผชิญกับการเปลี่ยนไปใช้ structured address ของ SWIFT ในวันที่
  14 พฤศจิกายน 2026 และหน้าต่างการย้ายระบบทนควอนตัมของ NIST ที่ยาวกว่านั้น
  การติดตั้ง PQC ที่มีอยู่ส่งมอบในรูปเอกสารเชิงนโยบาย โค้ดในห้องทดลอง
  หรือกล่องดำของ HSM ที่เป็นกรรมสิทธิ์ — ไม่มีรูปแบบใดที่สถาปนิกระบบชำระเงิน
  อ่าน ทดสอบ หรือลงนามได้

what_i_built: >
  KyberLib แปลง FIPS 203 ML-KEM (CRYSTALS-Kyber) ให้กลายเป็น Rust ที่
  ตรวจสอบได้ รองรับ handshake แบบไฮบริดคลาสสิก-บวก-ควอนตัม การคอมไพล์
  แบบ no_std สำหรับการฝังตัวใน HSM ขอบเขตการแยกส่วนแบบ crypto-agile
  และหลักฐานการกำกับดูแลตาม DORA มาตรา 5 ที่คณะกรรมการต้องการเพื่อ
  สนับสนุนการย้ายระบบ PQC โดยไม่ต้องแบกรับความเสี่ยงผู้จำหน่ายที่ไม่โปร่งใส

rigour:
  - metric: "มาตรฐานการเข้ารหัส"
