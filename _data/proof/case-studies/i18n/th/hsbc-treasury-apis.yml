title: "HSBC Treasury APIs — การชำระเงินและ Banking-as-a-Service"
banner_alt: "เส้นขอบฟ้านครลอนดอน — สื่อถึงแพลตฟอร์ม API บริหารเงินที่ส่งมอบภายใต้โครงการของ HSBC Commercial & Investment Bank"
sector: "ธนาคารพาณิชย์ Tier-1 · งานบริหารเงินองค์กร · การชำระเงินที่อยู่ภายใต้การกำกับ"
role: "ผู้นำอาวุโสด้านผลิตภัณฑ์ / เทคโนโลยี"
status: "ใช้งานจริงในระดับโปรดักชันที่ธนาคารระดับโลก Tier-1"

outcome_highlights:
  - value: "Tier-1"
    label: "ธนาคารระดับโลก Commercial & Investment Bank"
  - value: "FCA / PRA"
    label: "ขอบเขตการชำระเงินที่อยู่ภายใต้การกำกับ"
  - value: "Treasury / BaaS"
    label: "เงินสด สภาพคล่อง และช่องทางชำระเงินแบบโปรแกรมได้"
  - value: "Multi-year"
    label: "ผู้นำอาวุโสด้านผลิตภัณฑ์และเทคโนโลยี"

pull_quote: >
  "ส่งมอบ API การชำระเงิน ยอดคงเหลือ และสภาพคล่องในระดับโปรดักชัน
  ภายในขอบเขตการกำกับของธนาคาร — ครอบคลุมสถาปัตยกรรม การผสานผู้จำหน่าย
  หลักฐานเชิงกำกับดูแล และมาตรการความยืดหยุ่นทางปฏิบัติการที่ DORA
  และ SR 11-7 บังคับใช้ในปัจจุบัน"

problem: >
  ทีมบริหารเงินขององค์กรต้องการการเข้าถึงระบบจัดการเงินสด สภาพคล่อง
  และช่องทางชำระเงินแบบโปรแกรมได้ภายในธนาคาร Tier-1 — โดยไม่สูญเสีย
  ชั้นหลักฐานเชิงกำกับดูแลที่ตัวธนาคารเองต้องจัดทำ

what_i_built: >
  เป็นผู้นำสายงานผลิตภัณฑ์และเทคโนโลยีของโครงการ Treasury APIs และ
  Banking-as-a-Service ของ HSBC ภายใน Commercial & Investment Bank
  ส่งมอบ API การชำระเงิน ยอดคงเหลือ และสภาพคล่องในระดับโปรดักชันภายใต้
  ขอบเขตการกำกับของธนาคาร ทำงานครอบคลุมสถาปัตยกรรม การผสานผู้จำหน่าย
  หลักฐานเชิงกำกับดูแล และมาตรการความยืดหยุ่นทางปฏิบัติการที่ DORA
  และ SR 11-7 บังคับใช้ในปัจจุบัน

