title: "BankStatementParser — ระบบข่าวกรองธุรกรรมแบบรวมศูนย์สำหรับงานบริหารเงิน"
banner_alt: "สำนักงานการเงินสมัยใหม่ยามค่ำคืน — สื่อถึงระบบข่าวกรองธุรกรรมแบบรวมศูนย์ครอบคลุมรูปแบบใบแจ้งยอดธนาคาร CAMT, MT940, OFX และ CSV"
sector: "โอเพนซอร์ส · งานบริหารเงินองค์กร · การรวบรวมข้อมูลความเสี่ยง"
role: "ผู้เขียนและผู้ดูแลโครงการ"
status: "ใช้งานจริง อยู่ระหว่างการดูแลอย่างต่อเนื่อง"

outcome_highlights:
  - value: "6 formats"
    label: "CAMT (.052/.053/.054), MT940, OFX, CSV, OCR PDF"
  - value: "Per-field"
    label: "ที่มาของข้อมูล: บันทึกรูปแบบต้นทาง + เวอร์ชันของตัวแยกวิเคราะห์"
  - value: "BCBS 239"
    label: "สอดคล้องกับการรวบรวมข้อมูลความเสี่ยง"
  - value: "Apache-2.0 / MIT"
    label: "ใช้ได้ฟรี ปรับแก้ได้ ตรวจสอบได้"

pull_quote: >
  "ตัวแยกวิเคราะห์ CAMT / MT940 / PAIN ที่ตรวจสอบสคีมา ระบบสำรอง OCR
  สำหรับ PDF ที่สแกน การแมปฟิลด์แบบกำหนดได้ และหลักฐานการตรวจสอบระดับ
  SR 11-7 — ทุกขั้นตอนการแปลงข้อมูลถูกบันทึกและทำซ้ำได้"

problem: >
  ทีมบริหารเงินขององค์กรได้รับใบแจ้งยอดธนาคารในรูปแบบ CAMT, PAIN.001,
  MT940, OFX, CSV และ PDF ที่สแกนจากธนาคารหลายสิบแห่ง แต่ละรูปแบบมี
  ความหมายของฟิลด์ การเข้ารหัส และความกำกวมที่แตกต่างกัน ทีมส่วนใหญ่
  จึงสร้างตัวแยกวิเคราะห์เฉพาะธนาคารที่เปราะบางขึ้นมาเอง ซึ่งขัดขวาง
  การพยากรณ์กระแสเงินสดแบบเรียลไทม์ การตรวจจับการฉ้อโกง และการกระทบยอด
  ที่พร้อมตรวจสอบ

what_i_built: >
  ชุดเครื่องมือ Python แบบโอเพนซอร์สที่รวมรูปแบบใบแจ้งยอดธนาคารทั่วไป
  ทุกแบบให้กลายเป็นกระแสธุรกรรมเดียวที่ปรับมาตรฐานแล้ว ประกอบด้วยตัวแยก
  วิเคราะห์ CAMT / MT940 / PAIN ที่ตรวจสอบสคีมา ระบบสำรอง OCR สำหรับ PDF
  ที่สแกน การแมปฟิลด์แบบกำหนดได้ และหลักฐานการตรวจสอบระดับ SR 11-7
  สำหรับทุกขั้นตอนการแปลงข้อมูล

