title: "pain001 — สร้างไฟล์ชำระเงิน ISO 20022 แบบอัตโนมัติ"
banner_alt: "ภาพมุมสูงของเมืองยามพลบค่ำ — สื่อถึงการสร้างไฟล์ชำระเงินแบบมีโครงสร้างตาม ISO 20022 ข้ามเครือข่ายเคลียริ่งทั่วโลก"
sector: "โอเพนซอร์ส · งานบริหารเงินองค์กร · ISO 20022"
role: "ผู้เขียนและผู้ดูแลโครงการ"
status: "ใช้งานจริง อยู่ระหว่างการดูแลอย่างต่อเนื่อง"

