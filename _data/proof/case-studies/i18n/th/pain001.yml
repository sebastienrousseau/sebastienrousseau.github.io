pull_quote: >
  "อ้างอิงใน EPAA Quantum-Safe Payments white paper (กันยายน 2025)
  โอเพนซอร์ส ตรวจสอบได้ตั้งแต่วันแรก — ไม่มีตัวแปลที่เป็นกรรมสิทธิ์
  คั่นกลางระหว่างระบบ ERP ของคุณกับเครือข่ายเคลียริ่ง"

problem: >
  การย้ายระบบ MT → MX ทั่วโลกบังคับให้ทุกธนาคารและทีมบริหารเงินขององค์กร
  ต้องสร้างข้อความ pain.001 แบบมีโครงสร้าง ทีมส่วนใหญ่เขียน XML ที่เปราะบาง
  เองหรือซื้อตัวแปลที่เป็นกรรมสิทธิ์ซึ่งไม่โปร่งใส ทั้งสองทางส่งข้อผิดพลาด
  การชำระเงินเข้าสู่เครือข่ายเคลียริ่งและไม่ทิ้งร่องรอยการตรวจสอบไว้เลย

what_i_built: >
  ไลบรารี Python แบบโอเพนซอร์สที่สร้างข้อความ ISO 20022 pain.001
  (Customer Credit Transfer Initiation) ที่ผ่านการตรวจสอบจาก CSV /
  SQLite / Parquet พร้อมการตรวจสอบ XSD ล่วงหน้า เช็คซัม IBAN / BIC
  การปกปิดข้อมูล PII และความสอดคล้องกับสคีมา XSD อย่างเต็มรูปแบบ —
  ทั้งหมดอยู่ภายในเวิร์กโฟลว์ Python ที่เสียบเข้ากับไปป์ไลน์ ERP และ
  บริหารเงินที่มีอยู่ได้ทันที

