problem: >
  Corporate-treasuryteams eisen programmeerbare toegang tot
  cashmanagement, liquiditeit en betalingsrails binnen een Tier-1 bank
  — zonder in te leveren op de regulatoire bewijslaag die de bank zelf
  moet produceren.

what_i_built: >
  De product- en technologie-workstreams geleid voor de treasury-API's
  en het Banking-as-a-Service-programma van HSBC binnen de Commercial
  & Investment Bank, met de oplevering van productiebetaling-, saldo-
  en liquiditeits-API's binnen de regulatoire perimeter van de bank.
  Werkzaam over architectuur, leveranciersintegratie, toezichtbewijs
  en de operationele-veerkrachtcontroles die DORA en SR 11-7 nu
  voorschrijven.

