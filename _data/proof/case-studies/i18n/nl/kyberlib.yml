title: "KyberLib — ML-KEM van productiekwaliteit in Rust"
banner_alt: "Kwantumbestendige cryptografische sleuteluitwisseling — symbool voor de FIPS 203 ML-KEM-migratie in de bankensector"
sector: "Open source · Bankwezen · Standaarden"
role: "Auteur en beheerder"
status: "In productie, actief onderhouden"

outcome_highlights:
  - value: "FIPS 203"
