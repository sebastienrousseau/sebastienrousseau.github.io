pull_quote: >
  "Schema-gevalideerde CAMT-/MT940-/PAIN-parsers, OCR-terugval voor
  gescande PDF's, deterministische veldmapping en auditbewijs op
  SR 11-7-niveau — elke transformatiestap geregistreerd en
  reproduceerbaar."

problem: >
  Corporate-treasuryteams ontvangen bankafschriften in CAMT, PAIN.001,
  MT940, OFX, CSV en gescande PDF's van tientallen banken. Elk
  formaat hanteert andere veldsemantiek, codering en ambiguïteiten.
  De meeste teams bouwen handmatig broze parsers per bank, wat
  realtime kasprognoses, fraudedetectie en auditklare reconciliatie
  blokkeert.

what_i_built: >
  Een open-source Python-toolkit die elk gangbaar bankafschriftformaat
  samenbrengt in één genormaliseerde transactiestroom.
  Schema-gevalideerde CAMT-/MT940-/PAIN-parsers, OCR-terugval voor
  gescande PDF's, deterministische veldmapping en auditbewijs op
  SR 11-7-niveau voor elke transformatiestap.

