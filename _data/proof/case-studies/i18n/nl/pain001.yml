pull_quote: >
  "Geciteerd in de EPAA Quantum-Safe Payments-whitepaper (september
  2025). Open source en vanaf dag één geaudit — geen propriëtaire
  vertaler tussen uw ERP en het clearingnetwerk."

problem: >
  De wereldwijde MT → MX-migratie dwingt elke bank en corporate
  treasury tot het produceren van gestructureerde pain.001-berichten.
  De meeste teams schrijven broze XML met de hand of kopen
  ondoorzichtige propriëtaire vertalers. Beide routes leveren
  betalingsfouten af in clearingnetwerken en laten geen audittrail
  achter.

what_i_built: >
  Een open-source Python-bibliotheek die gevalideerde ISO 20022
  pain.001-berichten (Customer Credit Transfer Initiation) genereert
  vanuit CSV / SQLite / Parquet. Pre-flight XSD-validatie, IBAN-/BIC-
  checksums, PII-maskering en volledige conformiteit aan het
  XSD-schema — alles binnen een Python-workflow die direct aansluit
  op bestaande ERP- en treasury-pipelines.

