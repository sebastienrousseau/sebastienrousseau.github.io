  reproductible. »

problem: >
  Les équipes de trésorerie d'entreprise reçoivent des relevés bancaires
  en CAMT, PAIN.001, MT940, OFX, CSV et PDF numérisés depuis des dizaines
  de banques. Chaque format porte une sémantique de champs, un encodage
  et des ambiguïtés différents. La plupart des équipes construisent
  manuellement des parseurs fragiles par banque, ce qui bloque la
  prévision de trésorerie en temps réel, la détection de la fraude et
  la réconciliation prête pour l'audit.

what_i_built: >
  Une boîte à outils Python open source qui unifie tous les formats
  courants de relevés bancaires en un flux unique et normalisé de
  transactions. Parseurs CAMT / MT940 / PAIN validés par schéma, repli
  OCR pour les PDF numérisés, mappage déterministe des champs et preuves
  d'audit de niveau SR 11-7 pour chaque étape de transformation.

