pull_quote: >
  « Une implémentation de référence open source qu'une équipe sécurité
  peut lire, forker et signer — au lieu d'un PDF marketing. Limitation
  de débit atomique par Durable Objects, périmètre WebAuthn,
  provenance SLSA L3. »

problem: >
  À mesure que les agents IA et les outils MCP commencent à appeler des
  API edge à grande échelle, les banques ont besoin d'un périmètre qui
  survit au trafic autonome sans sacrifier les preuves d'audit de niveau
  DORA. Les CDN existants proposent soit du langage marketing, soit des
  plans opaques — aucun ne produit l'implémentation de référence qu'une
  équipe sécurité peut lire, forker et signer.

what_i_built: >
  Une passerelle MCP open source zero-trust avec 42 outils, limitation de
  débit atomique par Durable Objects, périmètre WebAuthn par passkeys,
  URL signées et provenance de build SLSA niveau 3. 3 185 tests à 100 %
  de couverture, cartographiés sur l'article 5 de DORA, l'agrégation des
  données de risque BCBS 239 et le capital de risque opérationnel Bâle III.

