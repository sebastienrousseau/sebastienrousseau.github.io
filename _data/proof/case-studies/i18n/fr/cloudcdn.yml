title: "CloudCDN — schéma directeur open source pour le edge natif IA"
banner_alt: "Infrastructure edge native IA — symbolisant la passerelle MCP zero-trust, la limitation de débit atomique par Durable Objects et le périmètre WebAuthn par passkeys que CloudCDN livre en implémentation de référence"
sector: "Open source · Edge · Infrastructure IA"
role: "Auteur et mainteneur"
status: "En production, activement maintenu"

