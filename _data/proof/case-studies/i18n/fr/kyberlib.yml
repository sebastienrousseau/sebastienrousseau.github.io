pull_quote: >
  « Évaluée par Qtonic Quantum Lab — registre indépendant de cryptographie
  post-quantique — et adoptée par QGram (Quantum2pi) pour la messagerie
  chiffrée de bout en bout. Les deux sont vérifiables sans passer par moi. »

problem: >
  Les banques font face à une bascule SWIFT d'adresses structurées au
  14 novembre 2026 et à une fenêtre plus longue de migration
  post-quantique NIST. Les implémentations PQC existantes se présentent
  sous forme de notes de politique, de code de laboratoire ou de boîtes
  noires HSM propriétaires — aucune qu'un architecte paiements ne puisse
  lire, tester ou signer.

what_i_built: >
  KyberLib transforme ML-KEM FIPS 203 (CRYSTALS-Kyber) en Rust
  inspectable. Handshakes hybrides classique + quantique, compilation
  no_std pour l'embarquement HSM, frontières d'abstraction crypto-agiles
  et les preuves de gouvernance article 5 de DORA dont les conseils ont
  désormais besoin pour soutenir la migration PQC sans s'exposer à un
  risque fournisseur opaque.

rigour:
  - metric: "Standard cryptographique"
    value: "FIPS 203 (ML-KEM, anciennement CRYSTALS-Kyber)"
  - metric: "Prise en charge du handshake hybride"
    value: "TLS classique + mode ML-KEM-768 X25519MLKEM768"
  - metric: "Compilation"
    value: "no_std — embarquable dans HSM, enclaves sécurisées et cibles embarquées"
  - metric: "Crypto-agilité"
    value: "Les frontières d'abstraction permettent un changement d'algorithme sans modification d'API"
