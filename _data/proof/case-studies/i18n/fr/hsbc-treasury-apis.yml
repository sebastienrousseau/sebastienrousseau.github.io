pull_quote: >
  « Livraison en production d'API de paiement, de solde et de liquidité
  conformes au périmètre réglementaire de la banque — couvrant
  l'architecture, l'intégration des fournisseurs, les preuves de
  supervision et les contrôles de résilience opérationnelle désormais
  imposés par DORA et SR 11-7. »

problem: >
  Les équipes de trésorerie d'entreprise exigent un accès programmable
  à la gestion de trésorerie, à la liquidité et aux rails de paiement
  au sein d'une banque Tier-1 — sans renoncer à la couche de preuves
  réglementaires que la banque elle-même doit produire.

what_i_built: >
  Direction des chantiers produit et technologie pour les API de
  trésorerie et le programme Banking-as-a-Service de HSBC au sein de
  Commercial & Investment Bank, avec livraison en production d'API de
  paiement, de solde et de liquidité conformes au périmètre
  réglementaire de la banque. Intervention transverse sur l'architecture,
  l'intégration des fournisseurs, les preuves de supervision et les
  contrôles de résilience opérationnelle désormais imposés par DORA et
  SR 11-7.

