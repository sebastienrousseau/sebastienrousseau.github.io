pull_quote: >
  « Citée dans le livre blanc EPAA Quantum-Safe Payments (septembre 2025).
  Open source, auditée dès le premier jour — aucun traducteur
  propriétaire entre votre ERP et le réseau de compensation. »

problem: >
  La migration mondiale MT → MX oblige chaque banque et chaque trésorerie
  d'entreprise à produire des messages pain.001 structurés. La plupart
  des équipes écrivent du XML fragile à la main ou achètent des
  traducteurs propriétaires opaques. Les deux voies envoient des erreurs
  de paiement dans les réseaux de compensation et ne laissent aucune
  piste d'audit.

what_i_built: >
  Une bibliothèque Python open source qui génère des messages ISO 20022
  pain.001 (Customer Credit Transfer Initiation) validés à partir de
  CSV / SQLite / Parquet. Validation XSD pré-vol, sommes de contrôle
  IBAN / BIC, masquage des données personnelles et conformité complète
  au schéma XSD — le tout dans un workflow Python qui s'intègre aux
  pipelines ERP et trésorerie existants.

