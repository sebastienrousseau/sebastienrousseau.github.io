pull_quote: >
  „Citat în documentul EPAA Quantum-Safe Payments (septembrie 2025).
  Open-source, auditat din prima zi — fără translator proprietar între
  ERP-ul dumneavoastră și rețeaua de compensare.”

problem: >
  Migrarea globală MT → MX obligă fiecare bancă și fiecare trezorerie
  corporativă să producă mesaje pain.001 structurate. Majoritatea
  echipelor scriu XML fragil manual sau cumpără translatoare
  proprietare opace. Ambele căi trimit erori de plată în rețelele de
  compensare și nu lasă nicio pistă de audit.

what_i_built: >
  O bibliotecă Python open-source care generează mesaje ISO 20022
  pain.001 (Customer Credit Transfer Initiation) validate, din CSV /
  SQLite / Parquet. Validare XSD pre-flight, sume de control IBAN /
  BIC, mascare a datelor cu caracter personal și conformitate completă
  cu schema XSD — toate într-un flux Python care se integrează în
  pipeline-urile ERP și de trezorerie existente.

