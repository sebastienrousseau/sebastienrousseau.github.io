problem: >
  Echipele de trezorerie corporativă primesc extrase bancare în CAMT,
  PAIN.001, MT940, OFX, CSV și PDF-uri scanate de la zeci de bănci.
  Fiecare format aduce semantici de câmp, codificări și ambiguități
  diferite. Majoritatea echipelor construiesc manual parsere fragile,
  specifice fiecărei bănci, blocând prognoza de numerar în timp real,
  detectarea fraudelor și reconcilierea pregătită pentru audit.

what_i_built: >
  Un set de instrumente Python open-source care unifică fiecare format
  obișnuit de extras bancar într-un flux unic, normalizat, de tranzacții.
  Parsere CAMT / MT940 / PAIN validate la schemă, alternativă OCR pentru
  PDF-urile scanate, mapare deterministă a câmpurilor și dovezi de audit
  la nivelul SR 11-7 pentru fiecare pas de transformare.

