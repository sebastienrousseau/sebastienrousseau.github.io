pull_quote: >
  „Am livrat în producție API-uri de plăți, solduri și lichiditate în
  perimetrul reglementat al băncii — acoperind arhitectura, integrarea
  furnizorilor, dovezile pentru supraveghere și controalele de
  reziliență operațională impuse acum de DORA și SR 11-7.”

problem: >
  Echipele de trezorerie corporativă cer acces programatic la gestiunea
  numerarului, la lichiditate și la canalele de plată din interiorul
  unei bănci Tier-1 — fără a renunța la stratul de dovezi de
  reglementare pe care banca însăși trebuie să îl producă.

what_i_built: >
  Am condus liniile de lucru de produs și tehnologie pentru API-urile
  de trezorerie și programul Banking-as-a-Service din cadrul Commercial
  & Investment Bank al HSBC, livrând în producție API-uri de plăți,
  solduri și lichiditate în perimetrul reglementat al băncii. Am
  acoperit arhitectura, integrarea furnizorilor, dovezile pentru
  supraveghere și controalele de reziliență operațională impuse acum
  de DORA și SR 11-7.

