pull_quote: >
  "은행의 규제 경계에 대응하는 프로덕션 결제, 잔액, 유동성 API를
  출시 — 아키텍처, 벤더 통합, 감독 증거, 그리고 DORA와 SR 11-7이
  현재 의무화하는 운영 복원력 통제 전반에 걸쳐 진행했습니다."

problem: >
  기업 트레저리 팀은 Tier-1 은행 내부의 현금 관리, 유동성, 결제 레일에
  대한 프로그래머블 액세스를 요구합니다 — 동시에 은행 자체가 생산해야
  하는 규제 증거 계층을 포기하지 않으면서 말입니다.

what_i_built: >
  HSBC Commercial & Investment Bank 내부에서 트레저리 API와
  Banking-as-a-Service 프로그램의 프로덕트 및 기술 워크스트림을
  이끌며, 은행의 규제 경계에 대응하는 프로덕션 결제, 잔액, 유동성
  API를 출시했습니다. 아키텍처, 벤더 통합, 감독 증거, 그리고 DORA와
  SR 11-7이 현재 의무화하는 운영 복원력 통제 전반에 걸쳐 작업했습니다.

