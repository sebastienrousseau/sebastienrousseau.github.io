pull_quote: >
  "스키마 검증된 CAMT / MT940 / PAIN 파서, 스캔된 PDF용 OCR 폴백,
  결정론적 필드 매핑, SR 11-7 수준의 감사 증거 — 모든 변환
  단계가 기록되고 재현 가능합니다."

problem: >
  기업 트레저리 팀은 수십 개의 은행으로부터 CAMT, PAIN.001,
  MT940, OFX, CSV 및 스캔된 PDF 형식으로 은행 명세서를 수신합니다.
  각 형식은 서로 다른 필드 의미론, 인코딩, 모호성을 수반합니다.
  대부분의 팀은 은행별로 취약한 파서를 수작업으로 구축하며,
  이는 실시간 현금 예측, 사기 탐지, 감사 가능한 조정 작업을 가로막습니다.

what_i_built: >
  모든 일반적인 은행 명세서 형식을 단일 정규화된 거래 스트림으로
  통합하는 오픈소스 Python 툴킷입니다. 스키마 검증된 CAMT / MT940 /
  PAIN 파서, 스캔된 PDF용 OCR 폴백, 결정론적 필드 매핑, 그리고
  모든 변환 단계에 대한 SR 11-7 수준의 감사 증거를 제공합니다.

