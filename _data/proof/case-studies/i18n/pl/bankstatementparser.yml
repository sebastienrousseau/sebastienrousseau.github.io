pull_quote: >
  "Parsery CAMT / MT940 / PAIN walidowane względem schematu, awaryjna ścieżka
  OCR dla skanowanych PDF, deterministyczne mapowanie pól oraz dowody
  audytowe klasy SR 11-7 — każdy krok transformacji zapisany i odtwarzalny."

problem: >
  Zespoły skarbu korporacyjnego otrzymują wyciągi bankowe w formatach CAMT,
  PAIN.001, MT940, OFX, CSV oraz jako skanowane PDF z dziesiątek banków.
  Każdy format niesie inną semantykę pól, kodowanie i niejednoznaczności.
  Większość zespołów buduje ręcznie kruche parsery per bank, co blokuje
  prognozowanie gotówki w czasie rzeczywistym, wykrywanie nadużyć
  i uzgodnienia gotowe do audytu.

what_i_built: >
  Otwartoźródłowy zestaw narzędzi w Pythonie, który ujednolica każdy
  popularny format wyciągu bankowego w jednolity, znormalizowany strumień
  transakcji. Parsery CAMT / MT940 / PAIN walidowane względem schematu,
  awaryjna ścieżka OCR dla skanowanych PDF, deterministyczne mapowanie
  pól oraz dowody audytowe klasy SR 11-7 dla każdego kroku transformacji.

