title: "BankStatementParser — zunifikowana analityka transakcji dla skarbu"
banner_alt: "Nowoczesne biuro finansowe nocą — symbolizuje zunifikowaną analitykę transakcji w formatach wyciągów bankowych CAMT, MT940, OFX i CSV"
sector: "Open source · Skarb korporacyjny · Agregacja danych ryzyka"
