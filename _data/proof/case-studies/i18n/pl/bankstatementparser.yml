outcome_highlights:
  - label: "CAMT (.052/.053/.054), MT940, OFX, CSV, OCR PDF"
  - label: "Proweniencja: format źródłowy i wersja parsera rejestrowane"
  - label: "Zgodne z agregacją danych ryzyka BCBS 239"
