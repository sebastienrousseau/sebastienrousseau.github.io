title: "pain001 — automatyzacja plików płatniczych ISO 20022"
banner_alt: "Panorama miasta o zmierzchu z lotu ptaka — symbolizuje automatyzację strukturyzowanych plików płatniczych ISO 20022 w globalnych sieciach rozliczeniowych"
sector: "Open source · Skarb korporacyjny · ISO 20022"
role: "Autor i opiekun projektu"
