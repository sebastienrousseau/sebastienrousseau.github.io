pull_quote: >
  "Cytowane w białej księdze EPAA Quantum-Safe Payments (wrzesień 2025).
  Open source, audytowane od pierwszego dnia — bez zastrzeżonego
  translatora między systemem ERP a siecią rozliczeniową."

problem: >
  Globalna migracja MT → MX zmusza każdy bank i skarbnika korporacyjnego
  do produkowania strukturyzowanych komunikatów pain.001. Większość
  zespołów ręcznie składa kruchy XML albo kupuje nieprzejrzyste
  zastrzeżone translatory. Obie drogi wprowadzają błędy płatnicze do
  sieci rozliczeniowych i nie zostawiają śladu audytowego.

what_i_built: >
  Otwartoźródłowa biblioteka Pythona generująca walidowane komunikaty
  ISO 20022 pain.001 (Customer Credit Transfer Initiation) z plików
  CSV / SQLite / Parquet. Walidacja XSD przed wysyłką, sumy kontrolne
  IBAN / BIC, maskowanie danych osobowych oraz pełna zgodność ze
  schematem XSD — wszystko w przepływie Pythona wpinającym się
  w istniejące pipeline’y ERP i skarbu.

