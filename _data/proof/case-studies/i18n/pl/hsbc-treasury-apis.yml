pull_quote: >
  "Wdrożone produkcyjnie API płatności, sald i płynności wewnątrz
  regulacyjnego perymetru banku — w architekturze, integracji
  z dostawcami, dowodach nadzorczych oraz kontrolach odporności
  operacyjnej, których wymagają teraz DORA i SR 11-7."

problem: >
  Zespoły skarbu korporacyjnego oczekują programowalnego dostępu do
  zarządzania gotówką, płynnością i szynami płatniczymi wewnątrz banku
  Tier-1 — bez rezygnacji z warstwy dowodów regulacyjnych, którą sam
  bank musi produkować.

what_i_built: >
  Prowadzenie strumieni produktowych i technologicznych dla programu
  treasury APIs i Banking-as-a-Service w HSBC Commercial & Investment
  Bank — dostarczenie produkcyjnych API płatności, sald i płynności
  wewnątrz regulacyjnego perymetru banku. Praca obejmowała
  architekturę, integrację z dostawcami, dowody nadzorcze oraz
  kontrole odporności operacyjnej wymagane teraz przez DORA i SR 11-7.

