title: "CloudCDN — otwartoźródłowy wzorzec dla brzegu sieci ery AI"
banner_alt: "Infrastruktura brzegowa ery AI — symbolizuje bramę MCP zero trust, atomowe ograniczanie przepustowości w Durable Objects oraz perymetr WebAuthn passkey, które CloudCDN dostarcza jako implementację referencyjną"
sector: "Open source · Brzeg sieci · Infrastruktura AI"
role: "Autor i opiekun projektu"
status: "Produkcja, aktywnie utrzymywane"

outcome_highlights:
  - label: "100 % pokrycia linii, gałęzi i funkcji"
  - label: "Proweniencja buildu + podpis Sigstore"
  - label: "Każde wywołanie audytowane z dowodem strukturalnym"
  - label: "Zmapowane na Artykuł 5 i agregację danych ryzyka"

pull_quote: >
  "Otwartoźródłowa implementacja referencyjna, którą zespół bezpieczeństwa
  może przeczytać, sforkować i podpisać — zamiast marketingowego PDF.
  Atomowe ograniczanie przepustowości w Durable Objects, perymetr
  WebAuthn, proweniencja SLSA L3."

problem: >
  Gdy agenci AI i narzędzia MCP zaczynają na masową skalę wywoływać API
  brzegowe, banki potrzebują perymetru, który wytrzyma ruch autonomiczny
  bez utraty dowodów audytowych klasy DORA. Istniejące CDN-y oferują
  albo język marketingowy, albo nieprzejrzyste plany — żadne z tych
  rozwiązań nie produkuje implementacji referencyjnej, którą zespół
  bezpieczeństwa może przeczytać, sforkować i podpisać.

what_i_built: >
  Otwartoźródłowa brama MCP w modelu zero trust z 42 narzędziami,
  atomowym ograniczaniem przepustowości w Durable Objects, perymetrem
  WebAuthn passkey, podpisanymi URL-ami i proweniencją buildu SLSA
  Level 3. 3 185 testów przy 100 % pokryciu, zmapowane na DORA
  Artykuł 5, agregację danych ryzyka BCBS 239 oraz kapitał z tytułu
  ryzyka operacyjnego według Bazylei III.

