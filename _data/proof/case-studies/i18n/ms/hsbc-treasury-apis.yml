title: HSBC Treasury APIs — pembayaran dan Banking-as-a-Service
banner_alt: Kaki langit City of London — melambangkan platform API perbendaharaan yang dihantar di bawah
  program Commercial & Investment Bank HSBC
sector: Bank perdagangan Peringkat 1 · Perbendaharaan korporat · Pembayaran dikawal selia
role: Ketua kanan produk dan teknologi
status: Beroperasi di sebuah bank global Peringkat 1
outcome_highlights:
- value: Peringkat 1
  label: Bank global, Commercial & Investment Bank
- label: Perimeter pembayaran dikawal selia
- value: Perbendaharaan / BaaS
  label: Tunai, kecairan dan landasan pembayaran boleh atur cara
- value: Pelbagai tahun
  label: Kepimpinan kanan produk dan teknologi
pull_quote: «Menghantar API pembayaran, baki dan kecairan ke operasi sebenar dalam perimeter kawal selia
  bank — merentas seni bina, penyepaduan pembekal, bukti penyeliaan dan kawalan ketahanan operasi yang
  kini diwajibkan oleh DORA dan SR 11-7.»
problem: Pasukan perbendaharaan korporat menuntut capaian boleh atur cara kepada pengurusan tunai, kecairan
  dan landasan pembayaran di dalam sebuah bank Peringkat 1 — tanpa melepaskan lapisan bukti kawal selia
  yang wajib dihasilkan oleh bank itu sendiri.
what_i_built: Mengetuai aliran kerja produk dan teknologi bagi API perbendaharaan dan program Banking-as-a-Service
  HSBC di dalam Commercial & Investment Bank, menghantar API pembayaran, baki dan kecairan ke operasi
  sebenar dalam perimeter kawal selia bank. Bekerja merentas seni bina, penyepaduan pembekal, bukti penyeliaan
  dan kawalan ketahanan operasi yang kini diwajibkan oleh DORA dan SR 11-7.
