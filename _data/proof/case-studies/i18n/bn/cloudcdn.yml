title: "CloudCDN — AI-নেটিভ এজের জন্য ওপেন-সোর্স ব্লুপ্রিন্ট"
banner_alt: "AI-নেটিভ এজ অবকাঠামো — শূন্য-বিশ্বাস MCP গেটওয়ে, পরমাণবিক Durable Objects রেট সীমিতকরণ এবং WebAuthn পাসকি পরিধির প্রতীক, যা CloudCDN একটি রেফারেন্স বাস্তবায়ন হিসেবে সরবরাহ করে"
sector: "ওপেন-সোর্স · এজ · AI অবকাঠামো"
role: "লেখক এবং রক্ষণাবেক্ষণকারী"
status: "উৎপাদনে, সক্রিয়ভাবে রক্ষণাবেক্ষিত"

outcome_highlights:
  - value: "3,185 tests"
    label: "100% লাইন, ব্রাঞ্চ, ফাংশন কভারেজ"
  - value: "SLSA L3"
    label: "বিল্ড উৎস + Sigstore স্বাক্ষর"
  - value: "42 MCP tools"
    label: "প্রতিটি কল কাঠামোবদ্ধ প্রমাণসহ নিরীক্ষা-লগকৃত"
  - value: "DORA / BCBS 239"
    label: "অনুচ্ছেদ 5 + ঝুঁকি-ডেটা সমন্বয়ের সঙ্গে ম্যাপকৃত"

pull_quote: >
  "একটি ওপেন-সোর্স রেফারেন্স বাস্তবায়ন যা একটি নিরাপত্তা দল পড়তে,
  ফর্ক করতে এবং স্বাক্ষর করতে পারে — মার্কেটিং PDF-এর পরিবর্তে।
  পরমাণবিক Durable Objects রেট সীমিতকরণ, WebAuthn পরিধি, SLSA L3
  উৎস।"

problem: >
  যখন AI এজেন্ট এবং MCP টুল বড় পরিসরে এজ API কল করতে শুরু করে,
  ব্যাঙ্কগুলির এমন একটি পরিধি প্রয়োজন যা DORA-গ্রেড নিরীক্ষা প্রমাণ
  ছাড়াই স্বায়ত্ত ট্র্যাফিক সামলাতে পারে। বিদ্যমান CDN-গুলি হয়
  মার্কেটিং ভাষা বা অস্বচ্ছ পরিকল্পনা সরবরাহ করে — কোনোটিই এমন
  রেফারেন্স বাস্তবায়ন তৈরি করে না যা একটি নিরাপত্তা দল পড়তে,
  ফর্ক করতে এবং স্বাক্ষর করতে পারে।

what_i_built: >
  42টি টুল, পরমাণবিক Durable Objects রেট সীমিতকরণ, WebAuthn পাসকি
  পরিধি, স্বাক্ষরিত URL এবং SLSA Level 3 বিল্ড উৎসসহ একটি ওপেন-সোর্স,
  শূন্য-বিশ্বাস MCP গেটওয়ে। 100% কভারেজে 3,185টি পরীক্ষা, DORA
  অনুচ্ছেদ 5, BCBS 239 ঝুঁকি-ডেটা সমন্বয় এবং Basel III পরিচালনাগত
  ঝুঁকি মূলধনের সঙ্গে ম্যাপকৃত।

rigour:
  - metric: "পরীক্ষা"
    value: >
      100% লাইন, ব্রাঞ্চ এবং ফাংশন কভারেজে 3,185টি পরীক্ষা।
  - metric: "সরবরাহ-শৃঙ্খল উৎস"
    value: >
      SLSA Level 3 বিল্ড উৎস + Sigstore স্বাক্ষর।
  - metric: "সরবরাহকৃত MCP টুল"
    value: >
      42টি টুল — প্রতিটি কল কাঠামোবদ্ধ প্রমাণসহ নিরীক্ষা-লগকৃত।
  - metric: "রেট সীমিতকরণ"
    value: >
      পরমাণবিক Durable Objects (কোনো রেস কন্ডিশন নেই, কোনো ডবল-কাউন্ট নেই)।
  - metric: "প্রমাণীকরণ"
    value: >
      WebAuthn পাসকি + স্বাক্ষরিত URL।
  - metric: "লাইসেন্স"
    value: >
      Apache-2.0 / MIT।

validation:
  - "2026-06-11 নিবন্ধে প্রদর্শিত: CloudCDN — AI-নেটিভ এজের জন্য একটি ওপেন-সোর্স ব্লুপ্রিন্ট"
  - "DORA অনুচ্ছেদ 5, BCBS 239, Basel III পরিচালনাগত ঝুঁকির সঙ্গে ম্যাপকৃত"
