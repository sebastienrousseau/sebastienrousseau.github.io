pull_quote: >
  "EPAA Quantum-Safe Payments শ্বেতপত্রে উদ্ধৃত (সেপ্টেম্বর 2025)।
  ওপেন-সোর্স, প্রথম দিন থেকে নিরীক্ষিত — আপনার ERP এবং ক্লিয়ারিং
  নেটওয়ার্কের মধ্যে কোনো মালিকানাধীন অনুবাদক নেই।"

problem: >
  বৈশ্বিক MT → MX মাইগ্রেশন প্রতিটি ব্যাঙ্ক এবং কর্পোরেট ট্রেজারিকে
  কাঠামোবদ্ধ pain.001 বার্তা উৎপাদন করতে বাধ্য করে। অধিকাংশ দল
  ভঙ্গুর XML হাতে তৈরি করে অথবা অস্বচ্ছ মালিকানাধীন অনুবাদক কিনে।
  উভয় পথই ক্লিয়ারিং নেটওয়ার্কে পেমেন্ট ত্রুটি পাঠায় এবং কোনো
  নিরীক্ষা ট্রেইল রাখে না।

what_i_built: >
  একটি ওপেন-সোর্স Python লাইব্রেরি যা CSV / SQLite / Parquet থেকে
  যাচাইকৃত ISO 20022 pain.001 (গ্রাহক ক্রেডিট ট্রান্সফার
  ইনিশিয়েশন) বার্তা তৈরি করে। প্রি-ফ্লাইট XSD যাচাইকরণ, IBAN / BIC
  চেকসাম, PII মাস্কিং এবং পূর্ণ XSD স্কিমা সঙ্গতি — সবই একটি
  Python ওয়ার্কফ্লোর ভেতরে যা বিদ্যমান ERP ও ট্রেজারি পাইপলাইনে
  সংযুক্ত হয়।

