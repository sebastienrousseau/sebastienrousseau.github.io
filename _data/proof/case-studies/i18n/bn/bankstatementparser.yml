title: "BankStatementParser — ট্রেজারির জন্য একীভূত লেনদেন গোয়েন্দা তথ্য"
banner_alt: "রাতে আধুনিক অর্থায়ন কার্যালয় — CAMT, MT940, OFX এবং CSV ব্যাঙ্ক স্টেটমেন্ট ফরম্যাটে একীভূত লেনদেন গোয়েন্দা তথ্যের প্রতীক"
sector: "ওপেন-সোর্স · কর্পোরেট ট্রেজারি · ঝুঁকি-ডেটা সমন্বয়"
role: "লেখক এবং রক্ষণাবেক্ষণকারী"
status: "উৎপাদনে, সক্রিয়ভাবে রক্ষণাবেক্ষিত"

outcome_highlights:
  - value: "6 formats"
    label: "CAMT (.052/.053/.054), MT940, OFX, CSV, OCR PDF"
  - value: "Per-field"
    label: "উৎস: উৎস ফরম্যাট + পার্সার সংস্করণ লগ করা"
  - value: "BCBS 239"
    label: "ঝুঁকি-ডেটা সমন্বয়ের সঙ্গে সংগতিপূর্ণ"
  - value: "Apache-2.0 / MIT"
    label: "ব্যবহার, ফর্ক ও নিরীক্ষার জন্য বিনামূল্যে"

pull_quote: >
  "স্কিমা-যাচাইকৃত CAMT / MT940 / PAIN পার্সার, স্ক্যান করা PDF-এর
  জন্য OCR ফলব্যাক, নির্ধারিত ফিল্ড ম্যাপিং, SR 11-7-গ্রেড নিরীক্ষা
  প্রমাণ — প্রতিটি রূপান্তর ধাপ রেকর্ডকৃত ও পুনরুৎপাদনযোগ্য।"

problem: >
  কর্পোরেট ট্রেজারি দলগুলি কয়েক ডজন ব্যাঙ্ক থেকে CAMT, PAIN.001,
  MT940, OFX, CSV এবং স্ক্যান করা PDF আকারে ব্যাঙ্ক স্টেটমেন্ট
  পায়। প্রতিটি ফরম্যাটে আলাদা ফিল্ড সিম্যান্টিক্স, এনকোডিং এবং
  অস্পষ্টতা থাকে। অধিকাংশ দল প্রতি-ব্যাঙ্কে ভঙ্গুর পার্সার হাতে
  তৈরি করে, যা রিয়েল-টাইম নগদ পূর্বাভাস, জালিয়াতি শনাক্তকরণ এবং
  নিরীক্ষা-প্রস্তুত মিলকরণ আটকে রাখে।

what_i_built: >
  একটি ওপেন-সোর্স Python টুলকিট যা প্রতিটি সাধারণ ব্যাঙ্ক
  স্টেটমেন্ট ফরম্যাটকে একটি একক, প্রমিত লেনদেন স্ট্রিমে একীভূত
  করে। স্কিমা-যাচাইকৃত CAMT / MT940 / PAIN পার্সার, স্ক্যান করা
  PDF-এর জন্য OCR ফলব্যাক, নির্ধারিত ফিল্ড ম্যাপিং এবং প্রতিটি
  রূপান্তর ধাপের জন্য SR 11-7-গ্রেড নিরীক্ষা প্রমাণ।

rigour:
  - metric: "সমর্থিত ফরম্যাট"
    value: >
      CAMT (.052, .053, .054), MT940, OFX, CSV, স্ক্যান করা PDF (OCR)।
  - metric: "প্রমিতকরণ লক্ষ্য"
    value: >
      একক একীভূত লেনদেন রেকর্ড স্কিমা।
  - metric: "নিরীক্ষা ট্রেইল"
    value: >
      প্রতি-ফিল্ড উৎস — প্রতিটি সারিতে উৎস ফরম্যাট + পার্সার
      সংস্করণ লগ করা।
  - metric: "লাইসেন্স"
    value: >
      Apache-2.0 / MIT।

