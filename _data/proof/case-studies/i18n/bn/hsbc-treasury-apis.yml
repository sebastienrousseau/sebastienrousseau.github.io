    label: "সিনিয়র প্রোডাক্ট + প্রযুক্তি নেতৃত্ব"

pull_quote: >
  "ব্যাঙ্কের নিয়ন্ত্রক পরিধির বিরুদ্ধে উৎপাদন পেমেন্ট, ব্যালেন্স
  এবং তারল্য API সরবরাহ করেছি — স্থাপত্য, বিক্রেতা সংহতকরণ,
  তত্ত্বাবধান প্রমাণ এবং DORA ও SR 11-7 এখন বাধ্যতামূলক করা
  পরিচালনাগত-স্থিতিস্থাপকতা নিয়ন্ত্রণসমূহ জুড়ে।"

problem: >
  কর্পোরেট ট্রেজারি দলগুলি একটি টিয়ার-1 ব্যাঙ্কের ভেতরে নগদ
  ব্যবস্থাপনা, তারল্য এবং পেমেন্ট রেলের প্রোগ্রামেবল অ্যাক্সেসের
  দাবি জানায় — ব্যাঙ্কের নিজেকেই উৎপাদন করতে হওয়া নিয়ন্ত্রক
  প্রমাণ স্তর ছাড়াই।

what_i_built: >
  Commercial & Investment Bank-এর ভেতরে HSBC-র ট্রেজারি API ও
  Banking-as-a-Service প্রোগ্রামের জন্য প্রোডাক্ট ও প্রযুক্তি
  কর্মধারা নেতৃত্ব দিয়েছি, ব্যাঙ্কের নিয়ন্ত্রক পরিধির বিরুদ্ধে
  উৎপাদন পেমেন্ট, ব্যালেন্স এবং তারল্য API সরবরাহ করেছি। স্থাপত্য,
  বিক্রেতা সংহতকরণ, তত্ত্বাবধান প্রমাণ এবং DORA ও SR 11-7 এখন
  বাধ্যতামূলক করা পরিচালনাগত-স্থিতিস্থাপকতা নিয়ন্ত্রণসমূহ জুড়ে
  কাজ করেছি।

