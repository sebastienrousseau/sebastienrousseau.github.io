title: "KyberLib — Rust-এ উৎপাদন-গ্রেড ML-KEM"
banner_alt: "কোয়ান্টাম-নিরাপদ ক্রিপ্টোগ্রাফিক কী বিনিময় — ব্যাঙ্কিংয়ে FIPS 203 ML-KEM মাইগ্রেশনের প্রতীক"
sector: "ওপেন-সোর্স · ব্যাঙ্কিং · স্ট্যান্ডার্ড"
role: "লেখক এবং রক্ষণাবেক্ষণকারী"
status: "উৎপাদনে, সক্রিয়ভাবে রক্ষণাবেক্ষিত"

outcome_highlights:
  - value: "FIPS 203"
    label: "NIST প্রকাশনা ট্র্যাকের সঙ্গে সংগতিপূর্ণ"
  - value: "Top 44 %"
    label: "~182টি PQC লাইব্রেরির মধ্যে (Qtonic Lab)"
  - value: "no_std"
    label: "HSM ও সুরক্ষিত এনক্লেভে এম্বেড করে"
  - value: "1 adopter"
    label: "QGram (Quantum2pi) পোস্ট-কোয়ান্টাম মেসেঞ্জার"

pull_quote: >
  "Qtonic Quantum Lab — স্বাধীন পোস্ট-কোয়ান্টাম ক্রিপ্টোগ্রাফি
  রেজিস্ট্রি — দ্বারা মূল্যায়িত, এবং প্রান্ত-থেকে-প্রান্ত এনক্রিপ্ট
  করা মেসেজিংয়ের জন্য QGram (Quantum2pi) দ্বারা গৃহীত। দুটিই
  আমার মাধ্যম ছাড়া যাচাইযোগ্য।"

problem: >
  ব্যাঙ্কগুলি একটি 2026 সালের 14 নভেম্বরের SWIFT কাঠামোবদ্ধ-ঠিকানা
  কাটওভার এবং একটি দীর্ঘতর NIST পোস্ট-কোয়ান্টাম মাইগ্রেশন উইন্ডোর
  মুখোমুখি। বিদ্যমান PQC বাস্তবায়নগুলি নীতি কাগজপত্র, ল্যাব কোড,
  বা মালিকানাধীন HSM ব্ল্যাক বক্স হিসেবে সরবরাহ হয় — যার কোনোটিই
  একজন পেমেন্ট স্থপতি পড়তে, পরীক্ষা করতে বা স্বাক্ষর করতে পারেন না।

what_i_built: >
  KyberLib FIPS 203 ML-KEM (CRYSTALS-Kyber)-কে পরিদর্শনযোগ্য Rust-এ
  রূপান্তরিত করে। হাইব্রিড ক্লাসিকাল-প্লাস-কোয়ান্টাম হ্যান্ডশেক,
  HSM এম্বেডিংয়ের জন্য no_std সংকলন, ক্রিপ্টো-চটপটে অ্যাবস্ট্র্যাকশন
  সীমা এবং অস্বচ্ছ বিক্রেতার ঝুঁকি না নিয়ে PQC মাইগ্রেশন সমর্থনের
  জন্য বোর্ডের এখন প্রয়োজন DORA অনুচ্ছেদ 5 শাসন প্রমাণ।

rigour:
  - metric: "ক্রিপ্টোগ্রাফিক স্ট্যান্ডার্ড"
    value: >
      FIPS 203 (ML-KEM, পূর্বে CRYSTALS-Kyber)।
  - metric: "হাইব্রিড হ্যান্ডশেক সমর্থন"
    value: >
      ক্লাসিকাল TLS + ML-KEM-768 X25519MLKEM768 মোড।
  - metric: "সংকলন"
    value: >
      no_std — HSM, সুরক্ষিত এনক্লেভ, এম্বেডেড লক্ষ্যে এম্বেড করে।
  - metric: "ক্রিপ্টো-চটপটে"
    value: >
      অ্যাবস্ট্র্যাকশন সীমা API পরিবর্তন ছাড়াই অ্যালগরিদম অদলবদল
      সক্ষম করে।
  - metric: "লাইসেন্স"
    value: >
      Apache-2.0 / MIT।

validation:
  - "EPAA Quantum-Safe Payments শ্বেতপত্রে উদ্ধৃত (সেপ্টেম্বর 2025)"
  - "2026-06-12 নিবন্ধে প্রদর্শিত: KyberLib এবং পোস্ট-কোয়ান্টাম ব্যাঙ্কিং মাইগ্রেশন"
  - "NIST FIPS 203 / 204 / 205 প্রকাশনা ট্র্যাকের সঙ্গে সংগতিপূর্ণ"
  - "Qtonic Quantum Lab দ্বারা মূল্যায়িত — স্বাধীন পোস্ট-কোয়ান্টাম ক্রিপ্টোগ্রাফি মূল্যায়ন রেজিস্ট্রি, ~182টি PQC লাইব্রেরি মূল্যায়িত (শীর্ষ 44%, কোনো বিক্রেতা পে-ফর-ইনক্লুশন নেই)"
  - "QGram (Quantum2pi) দ্বারা গৃহীত — একটি পোস্ট-কোয়ান্টাম প্রান্ত-থেকে-প্রান্ত এনক্রিপ্ট করা পিয়ার-টু-পিয়ার মেসেঞ্জার যা বার্তা এনক্রিপশনের জন্য KyberLib ব্যবহার করে (f6s.com/software/qgram-এ যাচাইযোগ্য)"
