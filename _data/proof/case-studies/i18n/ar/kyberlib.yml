title: "KyberLib — ML-KEM بدرجة إنتاج في Rust"
banner_alt: "تبادل مفاتيح تشفيري آمن كمومياً — يرمز إلى ترحيل المصارف إلى FIPS 203 ML-KEM"
sector: "مفتوح المصدر · المصارف · المعايير"
role: "المؤلف والمشرف على المشروع"
status: "قيد الإنتاج، صيانة مستمرة"

pull_quote: >
  "قُيِّمت من Qtonic Quantum Lab — السجل المستقل لتشفير ما بعد الكم —
  واعتمدتها QGram (Quantum2pi) للمراسلة المُشفَّرة طرفاً إلى طرف. كلاهما
  قابل للتحقق دون المرور بي."

problem: >
  تواجه المصارف موعد التحوُّل النهائي إلى العناوين البنيوية في SWIFT
  في 14 نوفمبر 2026، فضلاً عن نافذة ترحيل أطول إلى تشفير ما بعد الكم
  وفق NIST. تأتي تطبيقات PQC القائمة على هيئة أوراق سياسات، أو شيفرة
  مختبرات، أو صناديق سوداء مملوكة في HSM — ولا يستطيع مهندس مدفوعات
  قراءة أيٍّ منها أو اختبارها أو توقيعها.

what_i_built: >
  KyberLib يحوِّل FIPS 203 ML-KEM (CRYSTALS-Kyber) إلى Rust قابل
  للتفتيش. مصافحات هجينة كلاسيكية مع كمومية، وتجميع no_std للتضمين
  في HSM، وحدود تجريد رشيقة تشفيرياً، وأدلة حوكمة المادة 5 من DORA
  التي تحتاجها مجالس الإدارة لدعم ترحيل PQC دون تحمُّل مخاطر موردين
  غامضة.

