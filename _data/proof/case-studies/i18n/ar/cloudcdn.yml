title: "CloudCDN — مخطَّط مرجعي مفتوح المصدر للحافة الأصلية للذكاء الاصطناعي"
banner_alt: "بنية تحتية للحافة أصلية للذكاء الاصطناعي — ترمز إلى بوابة MCP بانعدام الثقة، والحد من المعدل الذري عبر Durable Objects، ومحيط مفاتيح المرور WebAuthn الذي يقدِّمه CloudCDN بوصفه تطبيقاً مرجعياً"
sector: "مفتوح المصدر · الحافة · بنية تحتية للذكاء الاصطناعي"
role: "المؤلف والمشرف على المشروع"
status: "قيد الإنتاج، صيانة مستمرة"

pull_quote: >
  "تطبيق مرجعي مفتوح المصدر يستطيع فريق الأمن قراءته واشتقاقه وتوقيعه —
  بدلاً من ملف PDF تسويقي. حد معدل ذري عبر Durable Objects، ومحيط
  WebAuthn، وإثبات مصدر SLSA L3."

problem: >
  مع بدء وكلاء الذكاء الاصطناعي وأدوات MCP استدعاء واجهات API على الحافة
  بنطاق واسع، تحتاج البنوك إلى محيط يصمد أمام حركة مرور مستقلة دون
  التضحية بأدلة تدقيق بمستوى DORA. شبكات توصيل المحتوى القائمة تقدِّم
  إما لغة تسويقية أو خططاً غامضة — ولا تنتج أيٌّ منهما التطبيق المرجعي
  الذي يستطيع فريق الأمن قراءته واشتقاقه وتوقيعه.

what_i_built: >
  بوابة MCP مفتوحة المصدر بانعدام الثقة، مع 42 أداة، وحد معدل ذري عبر
  Durable Objects، ومحيط مفاتيح مرور WebAuthn، وعناوين URL موقَّعة،
  وإثبات بناء بمستوى SLSA Level 3. ‏3,185 اختباراً بتغطية 100%،
  مُربَطة بالمادة 5 من DORA، وتجميع بيانات المخاطر وفق BCBS 239،
  ورأس مال المخاطر التشغيلية في Basel III.

