title: "HSBC Treasury APIs — المدفوعات والخدمات المصرفية كخدمة"
banner_alt: "أفق مدينة لندن — يرمز إلى منصة واجهات API للخزانة المُسلَّمة ضمن برنامج Commercial & Investment Bank في HSBC"
sector: "بنك تجاري من الفئة Tier-1 · خزانة الشركات · مدفوعات مُنظَّمة"
role: "قائد منتج / تكنولوجيا أول"
status: "قيد التشغيل في إنتاج بنك عالمي من الفئة Tier-1"

pull_quote: >
  "تسليم واجهات API إنتاجية للمدفوعات والأرصدة والسيولة ضمن المحيط
  التنظيمي للبنك — عبر البنية المعمارية، وتكامل الموردين، وأدلة الرقابة،
  وضوابط المرونة التشغيلية التي تُلزِم بها الآن DORA وSR 11-7."

problem: >
  تطالب فِرَق خزانة الشركات بوصول قابل للبرمجة إلى إدارة النقد، والسيولة،
  وقضبان المدفوعات داخل بنك من الفئة Tier-1 — دون التنازل عن طبقة الأدلة
  التنظيمية التي يتعيَّن على البنك نفسه إنتاجها.

what_i_built: >
  قيادة مسارات المنتج والتكنولوجيا لواجهات API الخاصة بالخزانة وبرنامج
  الخدمات المصرفية كخدمة (Banking-as-a-Service) في HSBC داخل
  Commercial & Investment Bank، مع تسليم واجهات API إنتاجية للمدفوعات
  والأرصدة والسيولة ضمن المحيط التنظيمي للبنك. عمل يمتد عبر البنية
  المعمارية، وتكامل الموردين، وأدلة الرقابة، وضوابط المرونة التشغيلية
  التي تُلزِم بها الآن DORA وSR 11-7.

