title: "BankStatementParser — ذكاء معاملات موحَّد لإدارة الخزانة"
banner_alt: "مكتب مالي حديث ليلاً — يرمز إلى ذكاء المعاملات الموحَّد عبر صيغ كشوف الحسابات المصرفية CAMT وMT940 وOFX وCSV"
sector: "مفتوح المصدر · خزانة الشركات · تجميع بيانات المخاطر"
role: "المؤلف والمشرف على المشروع"
status: "قيد الإنتاج، صيانة مستمرة"

pull_quote: >
  "مُحلِّلات CAMT / MT940 / PAIN مُتحقَّق منها وفق المخطَّط، مع OCR احتياطي
  لملفات PDF الممسوحة، وتعيين حقول حتمي، وأدلة تدقيق بمستوى SR 11-7 —
  كل خطوة تحويل مسجَّلة وقابلة لإعادة الإنتاج."

problem: >
  تتلقَّى فِرَق خزانة الشركات كشوف الحسابات المصرفية بصيغ CAMT وPAIN.001
  وMT940 وOFX وCSV، إضافة إلى ملفات PDF الممسوحة، من عشرات البنوك.
  كل صيغة تحمل دلالات حقول وترميزات وغموضاً مختلفاً. وتلجأ معظم الفِرَق
  إلى بناء مُحلِّلات هشَّة لكل بنك يدوياً، مما يُعطِّل التنبؤ النقدي في
  الوقت الفعلي، وكشف الاحتيال، والمطابقة الجاهزة للتدقيق.

what_i_built: >
  مجموعة أدوات Python مفتوحة المصدر تُوحِّد كل صيغة كشف حساب مصرفي شائعة
  في تيار معاملات واحد مُعيَّر. مُحلِّلات CAMT / MT940 / PAIN مُتحقَّق منها
  وفق المخطَّط، مع OCR احتياطي لملفات PDF الممسوحة، وتعيين حقول حتمي،
  وأدلة تدقيق بمستوى SR 11-7 لكل خطوة تحويل.

