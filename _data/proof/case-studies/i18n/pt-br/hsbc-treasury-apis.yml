pull_quote: >
  "Entreguei em produção APIs de pagamento, saldo e liquidez dentro do
  perímetro regulatório do banco — abrangendo arquitetura, integração
  de fornecedores, evidência supervisória e os controles de resiliência
  operacional que DORA e SR 11-7 agora exigem."

problem: >
  As equipes de tesouraria corporativa exigem acesso programável a
  gestão de caixa, liquidez e trilhos de pagamentos dentro de um
  banco Tier-1 — sem abrir mão da camada de evidência regulatória
  que o próprio banco precisa produzir.

what_i_built: >
  Liderei os workstreams de produto e tecnologia para as APIs de
  tesouraria e o programa de Banking-as-a-Service do HSBC dentro do
  Commercial & Investment Bank, entregando em produção APIs de
  pagamento, saldo e liquidez dentro do perímetro regulatório do
  banco. Atuei em arquitetura, integração de fornecedores, evidência
  supervisória e nos controles de resiliência operacional que DORA e
  SR 11-7 agora exigem.

