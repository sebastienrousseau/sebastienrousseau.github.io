pull_quote: >
  "Parsers CAMT / MT940 / PAIN validados por schema, fallback OCR para
  PDFs digitalizados, mapeamento de campos determinístico e evidência
  de auditoria de grau SR 11-7 — cada etapa de transformação registrada
  e reproduzível."

problem: >
  As equipes de tesouraria corporativa recebem extratos bancários nos
  formatos CAMT, PAIN.001, MT940, OFX, CSV e PDFs digitalizados de
  dezenas de bancos. Cada formato carrega semânticas de campo,
  codificações e ambiguidades distintas. A maioria das equipes constrói
  manualmente parsers frágeis por banco, bloqueando a previsão de
  caixa em tempo real, a detecção de fraudes e a reconciliação pronta
  para auditoria.

what_i_built: >
  Um toolkit Python de código aberto que unifica todos os formatos
  comuns de extrato bancário em um único fluxo de transações
  normalizado. Parsers CAMT / MT940 / PAIN validados por schema,
  fallback OCR para PDFs digitalizados, mapeamento de campos
  determinístico e evidência de auditoria de grau SR 11-7 para cada
  etapa de transformação.

