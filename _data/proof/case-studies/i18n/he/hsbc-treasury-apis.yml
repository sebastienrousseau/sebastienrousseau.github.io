what_i_built: >
  הובלתי קווי עבודה במוצר וטכנולוגיה עבור ממשקי ה-API לגזברות ותוכנית
  ה-Banking-as-a-Service של HSBC בתוך Commercial & Investment Bank,
  וסיפקתי בייצור ממשקי API לתשלומים, יתרות ונזילות מול היקף הרגולציה
  של הבנק. עבדתי לרוחב ארכיטקטורה, אינטגרציית ספקים, ראיות פיקוחיות
  ובקרות החוסן התפעולי שהיום נדרשות לפי DORA ו-SR 11-7.

