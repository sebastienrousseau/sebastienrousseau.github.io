title: "KyberLib — ML-KEM ברמת ייצור ב-Rust"
banner_alt: "החלפת מפתחות קריפטוגרפית עמידה-קוונטית — מסמלת את הגירת FIPS 203 ML-KEM בענף הבנקאות"
sector: "קוד פתוח · בנקאות · תקנים"
role: "מחבר ומתחזק"
status: "בייצור, מתוחזק באופן פעיל"

outcome_highlights:
  - label: "מיושר למסלול הפרסום של NIST"
  - label: "מתוך ~182 ספריות PQC (Qtonic Lab)"
  - label: "ניתן להטמעה ב-HSM ובמובלעות מאובטחות"
  - label: "מסר עמיד-קוונטית QGram (Quantum2pi)"

pull_quote: >
  "הוערכה על-ידי Qtonic Quantum Lab — מרשם עצמאי לקריפטוגרפיה
  פוסט-קוונטית — ואומצה על-ידי QGram (Quantum2pi) למסרים מוצפנים
  מקצה-לקצה. שניהם ניתנים לאימות ללא תלות בי."

problem: >
  בנקים ניצבים בפני מועד מעבר של SWIFT לכתובת מובנית ב-14 בנובמבר 2026
  ובחלון הגירה ארוך יותר של NIST לפוסט-קוונטית. יישומי PQC קיימים
  מסופקים כמסמכי מדיניות, קוד מעבדה או קופסאות שחורות קנייניות
  של HSM — שאף אחד מהם אינו מאפשר לארכיטקט תשלומים לקרוא, לבדוק
  או לחתום.

what_i_built: >
  KyberLib הופכת את FIPS 203 ML-KEM (CRYSTALS-Kyber) ל-Rust ניתן
  לבדיקה. לחיצות יד היברידיות קלאסיות-פלוס-קוונטיות, קומפילציית
  no_std להטמעה ב-HSM, גבולות הפשטה גמישים-קריפטוגרפית וראיות הממשל
  לפי סעיף 5 של DORA שדירקטוריונים זקוקים להן כעת כדי לתמוך
  בהגירת PQC ללא קבלת סיכון ספק אטום.

rigour:
