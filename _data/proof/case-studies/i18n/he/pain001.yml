outcome_highlights:
  - label: "Customer Credit Transfer Initiation"
  - label: "אימות מקדים לכל מסר"
  - label: "סכומי ביקורת ISO 7064 Modulo 97-10"
  - label: "חופשי לשימוש, פיצול וביקורת"

pull_quote: >
  "צוטטה ב-EPAA Quantum-Safe Payments white paper (ספטמבר 2025).
  קוד פתוח, מבוקר מהיום הראשון — ללא מתרגם קנייני בין מערכת ה-ERP
  שלך לרשת הסליקה."

problem: >
  הגירת ה-MT → MX הגלובלית מחייבת כל בנק וגזברות תאגידית לייצר
  מסרי pain.001 מובנים. רוב הצוותים מייצרים ידנית XML שביר או רוכשים
  מתרגמים קנייניים אטומים. שני המסלולים מזרימים שגיאות תשלום לרשתות
  הסליקה ואינם משאירים מסלול ביקורת.

what_i_built: >
  ספריית Python בקוד פתוח המייצרת מסרי ISO 20022 pain.001 מאומתים
  (Customer Credit Transfer Initiation) מ-CSV / SQLite / Parquet.
  אימות XSD מקדים, סכומי ביקורת IBAN / BIC, מיסוך PII והתאמה מלאה
  לסכמת XSD — הכול בתוך זרימת עבודה ב-Python המשתלבת בצנרות ERP
  וגזברות קיימות.

