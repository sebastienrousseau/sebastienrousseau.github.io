title: "pain001 — אוטומציה של קבצי תשלום ISO 20022"
banner_alt: "נוף עירוני מהאוויר בשעת בין-ערביים — מסמל אוטומציה של קבצי תשלום מובנים תחת ISO 20022 ברשתות סליקה גלובליות"
sector: "קוד פתוח · גזברות תאגידית · ISO 20022"
role: "מחבר ומתחזק"
