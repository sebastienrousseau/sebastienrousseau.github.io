pull_quote: >
  "מפענחי CAMT / MT940 / PAIN מאומתי-סכמה, גיבוי OCR ל-PDF סרוקים,
  מיפוי שדות דטרמיניסטי, ראיות ביקורת ברמת SR 11-7 — כל שלב טרנספורמציה
  מתועד וניתן לשחזור."

problem: >
  צוותי גזברות תאגידית מקבלים דפי בנק בפורמטים CAMT, PAIN.001,
  MT940, OFX, CSV ו-PDF סרוקים מעשרות בנקים. כל פורמט נושא
  סמנטיקת שדות, קידודים ועמימויות שונות. רוב הצוותים בונים ידנית
  מפענחים שבירים לכל בנק, וחוסמים בכך תחזית מזומנים בזמן אמת,
  זיהוי הונאות והתאמה מוכנה לביקורת.

what_i_built: >
  ערכת כלים פתוחה ב-Python המאחדת כל פורמט דף בנק נפוץ לזרם עסקאות
  אחד מנורמל. מפענחי CAMT / MT940 / PAIN מאומתי-סכמה, גיבוי OCR
  ל-PDF סרוקים, מיפוי שדות דטרמיניסטי וראיות ביקורת ברמת SR 11-7
  לכל שלב טרנספורמציה.

