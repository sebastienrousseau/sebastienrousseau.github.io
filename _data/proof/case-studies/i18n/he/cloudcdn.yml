title: "CloudCDN — תכנון פתוח לקצה ילידי-AI"
banner_alt: "תשתית קצה ילידת-AI — מסמלת את שער ה-MCP מבוסס zero-trust, הגבלת קצב אטומית של Durable Objects, והיקף WebAuthn מבוסס מפתחות-גישה ש-CloudCDN מספקת כיישום ייחוס"
sector: "קוד פתוח · קצה · תשתית AI"
role: "מחבר ומתחזק"
status: "בייצור, מתוחזק באופן פעיל"

outcome_highlights:
  - label: "כיסוי 100% של שורות, ענפים ופונקציות"
  - label: "מקור בנייה + חתימת Sigstore"
  - label: "כל קריאה מתועדת ביומן ביקורת עם ראיות מובנות"
  - label: "ממופה לסעיף 5 + אגירת נתוני סיכון"

pull_quote: >
  "יישום ייחוס בקוד פתוח שצוות אבטחה יכול לקרוא, לפצל ולחתום עליו —
  במקום מסמך PDF שיווקי. הגבלת קצב אטומית של Durable Objects,
  היקף WebAuthn, מקור SLSA L3."

problem: >
  כאשר סוכני AI וכלי MCP מתחילים לקרוא ל-API של הקצה בקנה מידה גדול,
  בנקים זקוקים להיקף השורד תעבורה אוטונומית מבלי לוותר על ראיות ביקורת
  ברמת DORA. רשתות CDN קיימות מציעות שפה שיווקית או תוכניות אטומות —
  ואף אחת מהן אינה מייצרת את יישום הייחוס שצוות אבטחה יכול לקרוא,
  לפצל ולחתום עליו.

what_i_built: >
  שער MCP בקוד פתוח, מבוסס zero-trust, עם 42 כלים, הגבלת קצב אטומית
  של Durable Objects, היקף WebAuthn מבוסס מפתחות-גישה, כתובות URL
  חתומות ומקור בנייה ברמת SLSA Level 3. 3,185 בדיקות בכיסוי 100%,
  ממופה לסעיף 5 של DORA, אגירת נתוני סיכון לפי BCBS 239 והון
  סיכון תפעולי לפי Basel III.

rigour:
