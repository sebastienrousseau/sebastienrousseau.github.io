  प्रवेश मागतात — आणि तोही बँकेला स्वतःला तयार करावा लागणारा पर्यवेक्षी पुरावा स्तर न गमावता.
what_i_built: Commercial & Investment Bank अंतर्गत HSBC च्या ट्रेझरी API आणि Banking-as-a-Service कार्यक्रमासाठी
  उत्पादन व तंत्रज्ञान कार्यप्रवाहांचे नेतृत्व केले, आणि बँकेच्या नियामक परिघाच्या आत उत्पादनातील देयक,
  शिल्लक व तरलता API पुरवले. वास्तुरचना, पुरवठादार एकात्मता, पर्यवेक्षी पुरावे आणि DORA व SR 11-7 आता
  आवश्यक करत असलेल्या परिचालन लवचिकता नियंत्रणांवर काम केले.
