title: CloudCDN — AI-केंद्री किनाऱ्यासाठी ओपन सोर्स आराखडा
banner_alt: AI-केंद्री किनारा पायाभूत सुविधा — शून्य-विश्वास MCP प्रवेशद्वार, अणु Durable Objects दर मर्यादा
  आणि WebAuthn पासकी परीघ यांचे प्रतीक, जे CloudCDN संदर्भ अंमलबजावणी म्हणून पुरवते
sector: ओपन सोर्स · किनारा · AI पायाभूत सुविधा
role: लेखक आणि देखभालकर्ता
status: उत्पादनात, सक्रियपणे देखभाल केलेले
outcome_highlights:
- value: ३,१८५ चाचण्या
  label: १०० % ओळ, शाखा आणि फलन व्याप्ती
- label: बिल्ड उगम + Sigstore स्वाक्षरी
- value: ४२ MCP साधने
  label: प्रत्येक हाक संरचित पुराव्यासह नोंदवली जाते
- label: कलम ५ आणि जोखीम-डेटा एकत्रीकरणाशी जोडलेले
pull_quote: «एक ओपन सोर्स संदर्भ अंमलबजावणी जी सुरक्षा संघ वाचू, फोर्क करू आणि स्वाक्षरी करू शकतो — विपणन
  PDF ऐवजी. अणु Durable Objects दर मर्यादा, WebAuthn परीघ, SLSA L3 उगम.»
problem: AI घटक आणि MCP साधने मोठ्या प्रमाणावर किनारा API ना हाक मारू लागताच, बँकांना असा परीघ हवा जो
  स्वायत्त वाहतूक सहन करेल आणि DORA दर्जाचे लेखापरीक्षण पुरावे गमावणार नाही. विद्यमान CDN एकतर विपणन भाषा
  देतात किंवा अपारदर्शक योजना — यांपैकी कोणतीही ती संदर्भ अंमलबजावणी तयार करत नाही जी सुरक्षा संघ वाचू,
  फोर्क करू आणि स्वाक्षरी करू शकेल.
what_i_built: ४२ साधनांसह ओपन सोर्स, शून्य-विश्वास MCP प्रवेशद्वार; अणु Durable Objects दर मर्यादा, WebAuthn
  पासकी परीघ, स्वाक्षरी केलेल्या URL आणि SLSA स्तर ३ बिल्ड उगम. ३,१८५ चाचण्या १०० % व्याप्तीसह, DORA कलम
  ५, BCBS 239 जोखीम-डेटा एकत्रीकरण आणि बेसल III परिचालन जोखीम भांडवलाशी जोडलेल्या.
rigour:
- metric: चाचणी व्याप्ती
  value: ३,१८५ चाचण्या १०० % ओळ, शाखा आणि फलन व्याप्तीसह
- metric: पुरवठा साखळी अखंडता
  value: SLSA स्तर ३ बिल्ड उगम + Sigstore स्वाक्षरी
- metric: MCP पृष्ठभाग
  value: ४२ साधने — प्रत्येक हाक संरचित पुराव्यासह नोंदवली जाते
- metric: दर मर्यादा
  value: अणु Durable Objects (शर्यत परिस्थिती नाही, दुहेरी मोजणी नाही)
- metric: प्रवेश नियंत्रण
  value: WebAuthn पासकी + स्वाक्षरी केलेल्या URL
- metric: परवाना
validation:
- '११/०६/२०२६ च्या लेखात सादर: CloudCDN — An Open-Source Blueprint for the AI-Native Edge'
- DORA कलम ५, BCBS 239 आणि बेसल III परिचालन जोखमीशी जोडलेले
