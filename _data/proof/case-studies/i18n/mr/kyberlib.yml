title: KyberLib — Rust मध्ये उत्पादन-दर्जाचे ML-KEM
banner_alt: क्वांटम-सुरक्षित क्रिप्टोग्राफिक की देवाणघेवाण — बँकिंगमधील FIPS 203 ML-KEM स्थलांतराचे प्रतीक
sector: ओपन सोर्स · बँकिंग · मानके
role: लेखक आणि देखभालकर्ता
status: उत्पादनात, सक्रियपणे देखभाल केलेले
outcome_highlights:
- label: NIST प्रकाशन मार्गाशी सुसंगत
- value: वरचे ४४ %
  label: सुमारे १८२ PQC लायब्ररींपैकी (Qtonic Lab)
- label: HSM आणि सुरक्षित कक्षांमध्ये बसते
- value: १ स्वीकारकर्ता
  label: QGram (Quantum2pi) पोस्ट-क्वांटम संदेशवाहक
pull_quote: «Qtonic Quantum Lab — स्वतंत्र पोस्ट-क्वांटम क्रिप्टोग्राफी नोंदवही — यांनी मूल्यमापन केले,
  आणि QGram (Quantum2pi) ने अखेरपासून अखेरपर्यंत कूटबद्ध संदेशवहनासाठी स्वीकारले. दोन्ही माझ्यामार्फत
  न जाता पडताळता येतात.»
problem: बँकांसमोर १४ नोव्हेंबर २०२६ ची SWIFT संरचित पत्ता संक्रमणाची मुदत आणि NIST ची अधिक दीर्घ पोस्ट-क्वांटम
  स्थलांतर मुदत आहे. विद्यमान PQC अंमलबजावण्या धोरण दस्तऐवज, प्रयोगशाळेतील कोड किंवा मालकीच्या HSM काळ्या
  पेट्या म्हणून येतात — यांपैकी काहीही देयक वास्तुविशारद वाचू, तपासू किंवा मान्य करू शकत नाही.
what_i_built: KyberLib FIPS 203 ML-KEM (CRYSTALS-Kyber) ला तपासता येणाऱ्या Rust मध्ये रूपांतरित करते.
  संकरित अभिजात-अधिक-क्वांटम हस्तांदोलन, HSM मध्ये बसवण्यासाठी no_std संकलन, क्रिप्टो-लवचिक अमूर्तन सीमा,
  आणि DORA कलम ५ अंतर्गत ती प्रशासन पुरावे जी संचालक मंडळांना आता अपारदर्शक पुरवठादार जोखीम न घेता PQC
  स्थलांतराला पाठिंबा देण्यासाठी लागतात.
rigour:
- metric: मानक
- metric: संकरित पद्धत
  value: अभिजात TLS + ML-KEM-768, X25519MLKEM768 पद्धतीत
- metric: अंतर्भाव
  value: no_std — HSM, सुरक्षित कक्ष आणि अंतर्भूत लक्ष्यांमध्ये बसते
- metric: क्रिप्टो लवचिकता
  value: अमूर्तन सीमा API न बदलता अल्गोरिदम बदलू देतात
- metric: परवाना
validation:
- EPAA Quantum-Safe Payments श्वेतपत्रिकेत उल्लेख (सप्टेंबर २०२५)
- '१२/०६/२०२६ च्या लेखात सादर: KyberLib and the Post-Quantum Banking Migration'
- NIST FIPS 203 / 204 / 205 प्रकाशन मार्गाशी सुसंगत
- Qtonic Quantum Lab यांनी मूल्यमापन केले — स्वतंत्र पोस्ट-क्वांटम क्रिप्टोग्राफी मूल्यमापन नोंदवही, सुमारे
  १८२ PQC लायब्ररींचे परीक्षण (वरचे ४४ %, समावेशासाठी पैसे घेतले जात नाहीत)
- QGram (Quantum2pi) ने स्वीकारले — पोस्ट-क्वांटम, अखेरपासून अखेरपर्यंत कूटबद्ध, समवयस्क-ते-समवयस्क संदेशवाहक
  जो संदेश कूटबद्ध करण्यासाठी KyberLib वापरतो (f6s.com/software/qgram येथे पडताळता येते)
