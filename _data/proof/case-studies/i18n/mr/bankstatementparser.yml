title: BankStatementParser — ट्रेझरीसाठी एकत्रित व्यवहार बुद्धिमत्ता
banner_alt: रात्रीचे आधुनिक वित्त कार्यालय — CAMT, MT940, OFX आणि CSV बँक विवरण स्वरूपांतील एकत्रित व्यवहार
  बुद्धिमत्तेचे प्रतीक
sector: ओपन सोर्स · कंपनी ट्रेझरी · जोखीम-डेटा एकत्रीकरण
role: लेखक आणि देखभालकर्ता
status: उत्पादनात, सक्रियपणे देखभाल केलेले
outcome_highlights:
- value: ६ स्वरूपे
  label: CAMT (.052/.053/.054), MT940, OFX, CSV, OCR PDF
- value: प्रत्येक क्षेत्रासाठी
  label: 'उगम: स्रोत स्वरूप आणि विश्लेषक आवृत्ती नोंदवली जाते'
- label: जोखीम-डेटा एकत्रीकरणाशी सुसंगत
- label: वापर, फोर्क आणि लेखापरीक्षणासाठी मुक्त
pull_quote: «स्कीमाने पडताळलेले CAMT / MT940 / PAIN विश्लेषक, स्कॅन केलेल्या PDF साठी OCR पर्याय, नियतिवादी
  क्षेत्र मांडणी, SR 11-7 दर्जाचे लेखापरीक्षण पुरावे — प्रत्येक रूपांतरण पायरी नोंदवलेली आणि पुनरुत्पादनीय.»
problem: कंपनी ट्रेझरी संघांना डझनभर बँकांकडून CAMT, PAIN.001, MT940, OFX, CSV आणि स्कॅन केलेल्या PDF
  स्वरूपांत बँक विवरणे मिळतात. प्रत्येक स्वरूपात वेगळे क्षेत्र अर्थ, वेगळी सांकेतिकरणे आणि संदिग्धता असते.
  बहुतेक संघ प्रत्येक बँकेसाठी ठिसूळ विश्लेषक हाताने बांधतात, ज्यामुळे प्रत्यक्ष वेळेतील रोख अंदाज, फसवणूक
  शोध आणि लेखापरीक्षणक्षम ताळमेळ अडतो.
what_i_built: एक ओपन सोर्स पायथन साधनसंच जो प्रत्येक सामान्य बँक विवरण स्वरूपाला एकाच, प्रमाणित व्यवहार
  प्रवाहात एकत्र आणतो. स्कीमाने पडताळलेले CAMT / MT940 / PAIN विश्लेषक, स्कॅन केलेल्या PDF साठी OCR पर्याय,
  नियतिवादी क्षेत्र मांडणी, आणि प्रत्येक रूपांतरण पायरीसाठी SR 11-7 दर्जाचे लेखापरीक्षण पुरावे.
