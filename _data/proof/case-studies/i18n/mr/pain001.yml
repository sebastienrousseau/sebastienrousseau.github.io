title: pain001 — ISO 20022 देयक फायलींचे स्वयंचलन
banner_alt: संधिप्रकाशातील शहराचे हवाई दृश्य — जागतिक निवाडा जाळ्यांमध्ये ISO 20022 अंतर्गत संरचित देयक
  फायलींच्या स्वयंचलनाचे प्रतीक
sector: ओपन सोर्स · कंपनी ट्रेझरी · ISO 20022
role: लेखक आणि देखभालकर्ता
status: उत्पादनात, सक्रियपणे देखभाल केलेले
outcome_highlights:
- label: Customer Credit Transfer Initiation
- value: XSD ने पडताळलेले
  label: प्रत्येक संदेशावर पूर्वतपासणी
- label: ISO 7064 Modulo 97-10 तपासबेरजा
- label: वापर, फोर्क आणि लेखापरीक्षणासाठी मुक्त
pull_quote: «EPAA Quantum-Safe Payments श्वेतपत्रिकेत (सप्टेंबर २०२५) उल्लेख. ओपन सोर्स, पहिल्या दिवसापासून
  लेखापरीक्षित — तुमची ERP प्रणाली आणि निवाडा जाळे यांच्यामध्ये कोणताही मालकीचा अनुवादक नाही.»
problem: जागतिक MT → MX स्थलांतर प्रत्येक बँकेला आणि कंपनी ट्रेझरीला संरचित pain.001 संदेश तयार करण्यास
  भाग पाडते. बहुतेक संघ एकतर हाताने ठिसूळ XML लिहितात किंवा अपारदर्शक मालकीचे अनुवादक विकत घेतात. दोन्ही
  मार्ग निवाडा जाळ्यांमध्ये देयक चुका पाठवतात आणि कोणताही लेखापरीक्षण माग मागे ठेवत नाहीत.
what_i_built: एक ओपन सोर्स पायथन लायब्ररी जी CSV / SQLite / Parquet मधून पडताळलेले ISO 20022 pain.001
  (Customer Credit Transfer Initiation) संदेश तयार करते. पूर्वतपासणी XSD पडताळणी, IBAN / BIC तपासबेरजा,
  वैयक्तिक माहितीचे आच्छादन आणि संपूर्ण XSD स्कीमा अनुपालन — हे सर्व अशा पायथन कार्यप्रवाहात, जो विद्यमान
  ERP आणि ट्रेझरी वाहिन्यांमध्ये बसतो.
rigour:
- metric: समर्थित ISO 20022 संदेश
- metric: स्कीमा अनुपालन
  value: प्रत्येक संदेशावर अधिकृत XSD पडताळणीची पूर्वतपासणी
- metric: पुरवलेले पडताळणीकर्ते
  value: IBAN तपासअंक + BIC आणि LEI तपासबेरीज (ISO 7064 Modulo 97-10)
- metric: परवाना
  value: Apache-2.0 / MIT — वापर, फोर्क आणि लेखापरीक्षणासाठी मुक्त
validation:
- EPAA Quantum-Safe Payments श्वेतपत्रिकेत उल्लेख (सप्टेंबर २०२५)
- sebastienrousseau.com वर ०९/२०२३ पासून प्रकाशित लेखांत सादर
