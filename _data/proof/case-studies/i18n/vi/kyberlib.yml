    value: "TLS cổ điển + chế độ ML-KEM-768 X25519MLKEM768"
  - metric: "Biên dịch"
    value: "no_std — nhúng được vào HSM, secure enclave và mục tiêu nhúng"
  - metric: "Linh hoạt mật mã"
    value: "Ranh giới trừu tượng cho phép thay thuật toán mà không đổi API"
  - metric: "Giấy phép"
    value: "Apache-2.0 / MIT"

validation:
  - "Được trích dẫn trong sách trắng EPAA Quantum-Safe Payments (tháng 9 năm 2025)"
  - "Được giới thiệu trong bài viết ngày 2026-06-12: KyberLib and the Post-Quantum Banking Migration"
  - "Đồng nhịp với lộ trình công bố của NIST FIPS 203 / 204 / 205"
  - "Được Qtonic Quantum Lab đánh giá — sổ đăng ký đánh giá mật mã hậu lượng tử độc lập, khoảng 182 thư viện PQC được khảo sát (top 44%, không thu phí để có mặt)"
  - "Được QGram (Quantum2pi) chọn dùng — trình nhắn tin ngang hàng mã hoá đầu-cuối hậu lượng tử sử dụng KyberLib để mã hoá tin nhắn (kiểm chứng tại f6s.com/software/qgram)"
