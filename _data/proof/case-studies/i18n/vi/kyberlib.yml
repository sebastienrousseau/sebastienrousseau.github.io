title: "KyberLib — ML-KEM cấp độ sản xuất bằng Rust"
banner_alt: "Trao đổi khoá mật mã an toàn lượng tử — biểu trưng cho quá trình chuyển đổi sang FIPS 203 ML-KEM trong ngành ngân hàng"
sector: "Mã nguồn mở · Ngân hàng · Tiêu chuẩn"
role: "Tác giả và người duy trì dự án"
status: "Đang vận hành thực tế, được duy trì tích cực"

outcome_highlights:
  - value: "FIPS 203"
    label: "Đồng nhịp với lộ trình công bố của NIST"
  - value: "Top 44 %"
    label: "Trong khoảng 182 thư viện PQC (Qtonic Lab)"
  - value: "no_std"
