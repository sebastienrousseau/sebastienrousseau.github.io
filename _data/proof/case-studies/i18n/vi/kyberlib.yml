  - value: "1 adopter"
    label: "Trình nhắn tin hậu lượng tử QGram (Quantum2pi)"

pull_quote: >
  "Được Qtonic Quantum Lab — sổ đăng ký mật mã hậu lượng tử độc lập —
  đánh giá, và được QGram (Quantum2pi) chọn dùng cho nhắn tin mã hoá
  đầu-cuối. Cả hai đều có thể kiểm chứng mà không cần thông qua tôi."

problem: >
  Các ngân hàng phải đối mặt với mốc chuyển đổi địa chỉ có cấu trúc của
  SWIFT vào ngày 14 tháng 11 năm 2026, cùng với cửa sổ chuyển đổi hậu
  lượng tử dài hơn của NIST. Các triển khai PQC hiện có lại xuất hiện
  dưới dạng tài liệu chính sách, mã thử nghiệm trong phòng lab, hoặc
  hộp đen HSM độc quyền — không loại nào để một kiến trúc sư thanh
  toán có thể đọc, kiểm thử hay ký.

what_i_built: >
  KyberLib chuyển FIPS 203 ML-KEM (CRYSTALS-Kyber) thành mã Rust có
  thể kiểm tra được. Bắt tay lai cổ điển + lượng tử, biên dịch no_std
  để nhúng vào HSM, ranh giới trừu tượng cho phép linh hoạt thay đổi
  thuật toán, và bằng chứng quản trị theo Điều 5 của DORA mà các hội
  đồng cần để hỗ trợ chuyển đổi PQC mà không phải gánh chịu rủi ro nhà
  cung cấp mờ đục.

rigour:
  - metric: "Tiêu chuẩn mật mã"
