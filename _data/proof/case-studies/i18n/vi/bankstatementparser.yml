pull_quote: >
  "Trình phân tích CAMT / MT940 / PAIN được xác thực theo lược đồ, cơ chế
  dự phòng OCR cho PDF quét, ánh xạ trường có tính tất định, bằng chứng
  kiểm toán đạt chuẩn SR 11-7 — mọi bước biến đổi đều được ghi lại và
  có thể tái lập."

problem: >
  Các bộ phận ngân quỹ doanh nghiệp tiếp nhận sao kê ngân hàng dưới định
  dạng CAMT, PAIN.001, MT940, OFX, CSV và PDF quét từ hàng chục ngân
  hàng. Mỗi định dạng có ngữ nghĩa trường, mã hoá và điểm mơ hồ khác
  nhau. Phần lớn các nhóm tự xây trình phân tích riêng cho từng ngân
  hàng — vốn dễ vỡ — khiến việc dự báo dòng tiền theo thời gian thực,
  phát hiện gian lận và đối chiếu sẵn sàng kiểm toán bị tắc nghẽn.

what_i_built: >
  Bộ công cụ Python mã nguồn mở hợp nhất mọi định dạng sao kê ngân hàng
  phổ biến thành một luồng giao dịch duy nhất đã được chuẩn hoá. Bao gồm
  trình phân tích CAMT / MT940 / PAIN xác thực theo lược đồ, cơ chế dự
  phòng OCR cho PDF quét, ánh xạ trường có tính tất định, và bằng chứng
  kiểm toán đạt chuẩn SR 11-7 cho mọi bước biến đổi.

