title: "HSBC Treasury APIs — thanh toán và Banking-as-a-Service"
banner_alt: "Đường chân trời City of London — biểu trưng cho nền tảng API ngân quỹ được triển khai trong khuôn khổ chương trình Ngân hàng Thương mại và Đầu tư của HSBC"
