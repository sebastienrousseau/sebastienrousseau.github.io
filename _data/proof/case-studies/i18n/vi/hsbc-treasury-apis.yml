pull_quote: >
  "Đã đưa vào vận hành các API thanh toán, số dư và thanh khoản trong
  vành đai pháp lý của ngân hàng — xuyên suốt kiến trúc, tích hợp nhà
  cung cấp, bằng chứng giám sát và các biện pháp kiểm soát khả năng
  phục hồi vận hành mà DORA và SR 11-7 hiện đang yêu cầu."

problem: >
  Các bộ phận ngân quỹ doanh nghiệp đòi hỏi quyền truy cập có thể lập
  trình vào quản lý tiền mặt, thanh khoản và kênh thanh toán bên trong
  một ngân hàng Tier-1 — mà không phải đánh đổi lớp bằng chứng pháp lý
  mà chính ngân hàng phải tạo ra.

what_i_built: >
  Dẫn dắt các luồng công việc về sản phẩm và công nghệ cho chương trình
  Treasury APIs và Banking-as-a-Service của HSBC trong khối Ngân hàng
  Thương mại và Đầu tư, đưa các API thanh toán, số dư và thanh khoản
  vào vận hành thực tế trong vành đai pháp lý của ngân hàng. Phối hợp
  xuyên suốt kiến trúc, tích hợp nhà cung cấp, bằng chứng giám sát và
  các biện pháp kiểm soát khả năng phục hồi vận hành mà DORA và SR
  11-7 hiện đang yêu cầu.

