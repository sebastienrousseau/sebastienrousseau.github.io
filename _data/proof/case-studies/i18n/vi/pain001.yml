title: "pain001 — tự động hoá tệp thanh toán ISO 20022"
banner_alt: "Cảnh thành phố nhìn từ trên cao lúc hoàng hôn — biểu trưng cho việc tự động hoá tệp thanh toán có cấu trúc theo ISO 20022 xuyên suốt các mạng thanh toán bù trừ toàn cầu"
