pull_quote: >
  "Được trích dẫn trong sách trắng EPAA Quantum-Safe Payments (tháng 9
  năm 2025). Mã nguồn mở, được kiểm toán ngay từ ngày đầu — không có
  trình chuyển đổi độc quyền nào nằm giữa hệ thống ERP và mạng thanh
  toán bù trừ."

problem: >
  Quá trình chuyển đổi toàn cầu từ MT sang MX buộc mọi ngân hàng và bộ
  phận ngân quỹ doanh nghiệp phải tạo ra các thông điệp pain.001 có
  cấu trúc. Phần lớn các nhóm tự viết tay XML dễ vỡ hoặc mua trình
  chuyển đổi độc quyền mờ đục. Cả hai con đường đều đẩy lỗi thanh toán
  vào mạng bù trừ và không để lại dấu vết kiểm toán nào.

what_i_built: >
  Một thư viện Python mã nguồn mở sinh ra các thông điệp pain.001
  (Customer Credit Transfer Initiation) ISO 20022 đã được xác thực từ
  CSV / SQLite / Parquet. Kiểm tra XSD trước khi gửi, tổng kiểm tra
  IBAN / BIC, che dữ liệu cá nhân và tuân thủ đầy đủ lược đồ XSD — tất
  cả nằm trong một quy trình Python tích hợp được vào các đường ống
  ERP và ngân quỹ hiện có.

