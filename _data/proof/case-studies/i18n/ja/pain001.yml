pull_quote: >
  「EPAA Quantum-Safe Payments ホワイトペーパー (2025 年 9 月) にて引用。
  初日からオープンソースで監査済み — ERP とクリアリング・ネットワークの
  間に独自仕様のトランスレーターを介在させません。」

problem: >
  グローバルな MT → MX 移行により、すべての銀行および企業トレジャリーは
  構造化された pain.001 メッセージの生成を迫られています。多くのチームは
  脆弱な XML を手作業で生成するか、不透明な独自仕様のトランスレーターを
  購入しています。いずれの経路も、決済エラーをクリアリング・ネットワークへ
  送り込み、監査証跡を残しません。

what_i_built: >
  CSV / SQLite / Parquet から検証済みの ISO 20022 pain.001 (顧客信用振替
  開始) メッセージを生成する、オープンソースの Python ライブラリです。
  事前 XSD 検証、IBAN / BIC チェックサム、PII マスキング、完全な XSD
  スキーマ適合 — これらすべてを、既存の ERP およびトレジャリー・
  パイプラインに組み込める Python ワークフローの中で提供します。

