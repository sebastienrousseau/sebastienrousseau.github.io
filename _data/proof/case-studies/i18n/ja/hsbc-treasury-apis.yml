pull_quote: >
  「銀行の規制境界に対して、本番稼働の決済、残高、流動性 API を提供しま
  した — アーキテクチャ、ベンダー統合、監督当局向け証跡、そして DORA と
  SR 11-7 が現在求めているオペレーショナル・レジリエンス統制にわたる
  領域で。」

problem: >
  企業トレジャリー部門は、Tier-1 銀行内で資金管理、流動性、決済レール
  へのプログラマブルなアクセスを求めています。同時に、銀行自身が
  生成しなければならない規制対応の証跡レイヤーを犠牲にすることは
  許されません。

what_i_built: >
  HSBC の法人・投資銀行部門内で、トレジャリー API および
  Banking-as-a-Service プログラムのプロダクトとテクノロジーの
  ワークストリームを率い、銀行の規制境界に対して本番稼働の決済、残高、
  流動性 API を提供しました。アーキテクチャ、ベンダー統合、監督当局向け
  証跡、そして DORA と SR 11-7 が現在求めているオペレーショナル・
  レジリエンス統制にわたって従事しました。

