pull_quote: >
  「スキーマ検証済みの CAMT / MT940 / PAIN パーサー、スキャン PDF に対する
  OCR フォールバック、決定論的なフィールドマッピング、SR 11-7 水準の監査
  証跡 — すべての変換ステップが記録され、再現可能です。」

problem: >
  企業トレジャリー部門は、数十行の銀行から CAMT、PAIN.001、MT940、OFX、
  CSV、スキャン PDF など多様な形式で明細書を受け取ります。各形式は
  フィールドの意味、エンコーディング、曖昧性が異なります。多くのチームは
  銀行ごとに脆弱なパーサーを手作りしており、リアルタイムのキャッシュ
  予測、不正検知、監査対応の照合を妨げています。

what_i_built: >
  あらゆる主要な銀行明細書フォーマットを単一の正規化されたトランザクション・
  ストリームに統合する、オープンソースの Python ツールキットです。
  スキーマ検証済みの CAMT / MT940 / PAIN パーサー、スキャン PDF に対する
  OCR フォールバック、決定論的なフィールドマッピング、そしてすべての
  変換ステップに対する SR 11-7 水準の監査証跡を提供します。

