pull_quote: >
  "Schemavaliderade parsrar för CAMT, MT940 och PAIN, OCR-fallback för
  skannade PDF-filer, deterministisk fältmappning och granskningsbevis
  på SR 11-7-nivå — varje transformationssteg loggat och reproducerbart."

problem: >
  Corporate treasury-team tar emot kontoutdrag i CAMT, PAIN.001, MT940,
  OFX, CSV och som skannade PDF-filer från dussintals banker. Varje
  format har egen fältsemantik, egen kodning och egna tvetydigheter.
  De flesta team handbygger sköra bankspecifika parsrar, vilket blockerar
  kassaprognoser i realtid, bedrägeridetektion och granskningsfärdig
  avstämning.

what_i_built: >
  Ett Python-verktyg med öppen källkod som förenar alla vanliga
  kontoutdragsformat till en enda normaliserad transaktionsström.
  Schemavaliderade parsrar för CAMT, MT940 och PAIN, OCR-fallback för
  skannade PDF-filer, deterministisk fältmappning och granskningsbevis
  på SR 11-7-nivå för varje transformationssteg.

