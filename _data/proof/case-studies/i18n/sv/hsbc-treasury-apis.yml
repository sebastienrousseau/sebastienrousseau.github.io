pull_quote: >
  "Levererade produktiva API:er för betalningar, saldon och likviditet
  mot bankens regulatoriska perimeter — över arkitektur, leverantörsintegration,
  tillsynsbevis och de operativa motståndskraftskontroller som DORA och
  SR 11-7 nu kräver."

problem: >
  Corporate treasury-team kräver programmerbar åtkomst till cash management,
  likviditet och betalningsskenor inuti en Tier 1-bank — utan att ge upp
  det regulatoriska bevisskikt som banken själv måste producera.

what_i_built: >
  Ledde produkt- och teknikspår för HSBC:s treasury-API:er och
  Banking-as-a-Service-program inom Commercial & Investment Bank, och
  levererade produktiva API:er för betalningar, saldon och likviditet
  mot bankens regulatoriska perimeter. Arbetade tvärs över arkitektur,
  leverantörsintegration, tillsynsbevis och de operativa
  motståndskraftskontroller som DORA och SR 11-7 nu kräver.

