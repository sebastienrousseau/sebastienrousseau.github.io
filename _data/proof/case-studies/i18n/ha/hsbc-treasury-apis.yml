  - metric: "Saman haɗin gwiwa"
    value: "Treasury APIs, ma'auni / kula da kuɗi, rabon BaaS"
  - metric: "Masu sauraro"
    value: "Masu kula da kuɗi na kamfanoni masu yawan ƙasashe da bankuna na matakin biyu"

