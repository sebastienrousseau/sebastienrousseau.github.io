pull_quote: >
  "An ambato shi a takardar fararen takarda ta EPAA Quantum-Safe Payments
  (Satumba 2025). Buɗaɗɗen tushe, an bincika tun rana ta farko — babu mai
  fassara mai mallaka tsakanin ERP ɗinka da hanyar sadarwa ta tsabtacewa."

problem: >
  Ƙaurar duniya daga MT zuwa MX ta tilasta wa kowane banki da ma'aikatar
  kuɗi ta kamfani su samar da saƙonnin pain.001 masu tsari. Yawancin
  ƙungiyoyi suna gina XML mai rauni da hannu ko siyan masu fassara masu
  mallaka marasa fahimta. Hanyoyi biyu suna aika kurakuran biyan kuɗi
  cikin hanyoyin tsabtacewa kuma sun bar babu hanyar bincike.

what_i_built: >
  Ɗakin karatu na Python na buɗaɗɗen tushe wanda ke samar da saƙonnin
  pain.001 (Fara Canja Wurin Bashi na Abokin Ciniki) na ISO 20022 da aka
  tabbatar daga CSV / SQLite / Parquet. Tabbatarwar XSD kafin tashi,
  cak na IBAN / BIC, ɓoye PII, da cikakkiyar daidaitawa da tsarin XSD —
  duk a cikin tafarkin Python wanda ke shiga cikin tafarkin ERP da
  ma'aikatar kuɗi da ke akwai.

