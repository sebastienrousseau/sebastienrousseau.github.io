title: "BankStatementParser — haɗaɗɗiyar fahimtar mu'amaloli ga ma'aikatar kuɗi"
banner_alt: "Ofishin kuɗi na zamani da dare — alama ce ta haɗaɗɗiyar fahimtar mu'amaloli a tsakanin tsarurrukan bayanan banki na CAMT, MT940, OFX, da CSV"
