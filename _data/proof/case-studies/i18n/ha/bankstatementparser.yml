pull_quote: >
  "Parsers na CAMT / MT940 / PAIN da aka tabbatar da tsarin, OCR a matsayin
  madadin don PDF da aka sikanin, taswirar fili mai tabbaci, shaidar bincike
  mai matsayin SR 11-7 — kowane mataki na canji an yi rajistarsa kuma yana
  iya sake faruwa."

problem: >
  Ƙungiyoyin ma'aikatar kuɗi na kamfanoni suna karɓar bayanan banki a tsarin
  CAMT, PAIN.001, MT940, OFX, CSV, da PDF da aka sikanin daga bankuna da
  dama. Kowane tsari yana ɗauke da ma'anonin fili daban-daban, hanyoyin
  ɓoyewa, da rashin tabbas. Yawancin ƙungiyoyi suna gina parsers masu rauni
  ga kowane banki da hannu, abin da ke hana hasashen kuɗi a ainihin lokaci,
  gano zamba, da daidaitawa wadda ta dace da bincike.

what_i_built: >
  Kayan aikin Python na buɗaɗɗen tushe wanda ke haɗa kowane tsarin bayanan
  banki na yau da kullum cikin rafi guda ɗaya na mu'amaloli da aka tsara.
  Parsers na CAMT / MT940 / PAIN da aka tabbatar da tsarin, OCR a matsayin
  madadin don PDF da aka sikanin, taswirar fili mai tabbaci, da shaidar
  bincike mai matsayin SR 11-7 ga kowane mataki na canji.

