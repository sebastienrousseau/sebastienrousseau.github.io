title: pain001 — ISO 20022 கட்டணக் கோப்புகளைத் தன்னியக்கமாக்குதல்
banner_alt: அந்தி நேரத்தில் நகரின் வான்வழிக் காட்சி — உலகளாவிய தீர்வு வலையமைப்புகளில் ISO 20022 கீழ் கட்டமைக்கப்பட்ட
  கட்டணக் கோப்புகளின் தன்னியக்கத்தின் குறியீடு
sector: திறந்த மூலம் · நிறுவனக் கருவூலம் · ISO 20022
role: ஆசிரியரும் பராமரிப்பாளரும்
status: உற்பத்திச் சூழலில், செயலூக்கமாகப் பராமரிக்கப்படுகிறது
outcome_highlights:
- label: Customer Credit Transfer Initiation
- value: XSD-ஆல் சரிபார்க்கப்பட்டது
  label: ஒவ்வொரு செய்திக்கும் முன்னோட்டச் சரிபார்ப்பு
- label: ISO 7064 Modulo 97-10 சரிபார்ப்புத் தொகைகள்
- label: பயன்படுத்தவும், பிரிக்கவும், தணிக்கை செய்யவும் இலவசம்
pull_quote: «EPAA Quantum-Safe Payments வெண்ணறிக்கையில் (செப்டம்பர் 2025) மேற்கோள் காட்டப்பட்டது. திறந்த
  மூலம், முதல் நாளிலிருந்தே தணிக்கை செய்யப்பட்டது — உங்கள் ERP-க்கும் தீர்வு வலையமைப்புக்கும் இடையே எந்தத்
  தனியுரிமை மொழிபெயர்ப்பானும் இல்லை.»
problem: உலகளாவிய MT → MX இடமாற்றம் ஒவ்வொரு வங்கியையும் நிறுவனக் கருவூலத்தையும் கட்டமைக்கப்பட்ட pain.001
  செய்திகளை உருவாக்கும்படி கட்டாயப்படுத்துகிறது. பெரும்பாலான குழுக்கள் உடையக்கூடிய XML-ஐக் கையால் எழுதுகின்றன,
  அல்லது ஒளிபுகா தனியுரிமை மொழிபெயர்ப்பான்களை வாங்குகின்றன. இரு வழிகளுமே தீர்வு வலையமைப்புகளுக்குக் கட்டணப்
  பிழைகளை அனுப்புகின்றன, எந்தத் தணிக்கைத் தடத்தையும் விட்டுச் செல்வதில்லை.
what_i_built: CSV / SQLite / Parquet-இலிருந்து சரிபார்க்கப்பட்ட ISO 20022 pain.001 (Customer Credit Transfer
  Initiation) செய்திகளை உருவாக்கும் ஒரு திறந்த மூல Python நூலகம். முன்னோட்ட XSD சரிபார்ப்பு, IBAN / BIC
  சரிபார்ப்புத் தொகைகள், தனிநபர் தரவு மறைப்பு, முழுமையான XSD திட்டவரை இணக்கம் — இவை அனைத்தும் ஏற்கெனவே
  உள்ள ERP மற்றும் கருவூலக் குழாய்களில் பொருந்தும் ஒரு Python பணிப்பாய்வுக்குள்.
rigour:
- metric: ஆதரிக்கப்படும் ISO 20022 செய்திகள்
- metric: திட்டவரை இணக்கம்
  value: ஒவ்வொரு செய்திக்கும் அதிகாரப்பூர்வ XSD சரிபார்ப்பு முன்னோட்டமாக
- metric: வழங்கப்பட்ட சரிபார்ப்பான்கள்
  value: IBAN சரிபார்ப்பு இலக்கம் + BIC மற்றும் LEI சரிபார்ப்புத் தொகை (ISO 7064 Modulo 97-10)
- metric: உரிமம்
  value: Apache-2.0 / MIT — பயன்படுத்தவும், பிரிக்கவும், தணிக்கை செய்யவும் இலவசம்
validation:
- EPAA Quantum-Safe Payments வெண்ணறிக்கையில் மேற்கோள் (செப்டம்பர் 2025)
- sebastienrousseau.com-இல் 09/2023 முதல் வெளியான கட்டுரைகளில் இடம்பெற்றது
