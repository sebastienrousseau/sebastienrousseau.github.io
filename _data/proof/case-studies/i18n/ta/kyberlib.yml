title: KyberLib — Rust-இல் உற்பத்தித் தரத்திலான ML-KEM
banner_alt: குவாண்டம்-பாதுகாப்பான மறையாக்கச் சாவி பரிமாற்றம் — வங்கியியலில் FIPS 203 ML-KEM இடமாற்றத்தின்
  குறியீடு
sector: திறந்த மூலம் · வங்கியியல் · தரநிலைகள்
role: ஆசிரியரும் பராமரிப்பாளரும்
status: உற்பத்திச் சூழலில், செயலூக்கமாகப் பராமரிக்கப்படுகிறது
outcome_highlights:
- label: NIST வெளியீட்டுப் பாதையுடன் ஒத்திசைந்தது
- value: மேல் 44 %
  label: சுமார் 182 PQC நூலகங்களில் (Qtonic Lab)
- label: HSM மற்றும் பாதுகாப்பான அறைகளில் பொருந்தும்
- value: 1 ஏற்பாளர்
  label: QGram (Quantum2pi) பிந்தைய-குவாண்டம் செய்தியாளர்
pull_quote: «Qtonic Quantum Lab — சுயாதீன பிந்தைய-குவாண்டம் மறையாக்கவியல் பதிவேடு — மதிப்பீடு செய்தது;
  முனையிலிருந்து முனை வரை மறையாக்கப்பட்ட செய்தியனுப்பலுக்கு QGram (Quantum2pi) ஏற்றுக்கொண்டது. இரண்டையும்
  என் வழியாகச் செல்லாமல் சரிபார்க்க முடியும்.»
problem: 2026 நவம்பர் 14-இல் SWIFT கட்டமைக்கப்பட்ட முகவரி மாற்றமும், அதைவிட நீண்ட NIST பிந்தைய-குவாண்டம்
  இடமாற்றக் காலமும் வங்கிகளுக்கு முன்னால் உள்ளன. இருக்கும் PQC செயலாக்கங்கள் கொள்கை ஆவணங்களாகவோ, ஆய்வக
  நிரலாகவோ, தனியுரிமை HSM கருப்புப் பெட்டிகளாகவோ வருகின்றன — இவற்றில் எதையும் ஒரு கட்டண கட்டமைப்பாளர்
  படிக்கவோ, சோதிக்கவோ, ஒப்புதல் அளிக்கவோ முடியாது.
what_i_built: KyberLib, FIPS 203 ML-KEM (CRYSTALS-Kyber) தரநிலையை ஆய்வு செய்யக்கூடிய Rust ஆக மாற்றுகிறது.
  கலப்பு பாரம்பரிய-மற்றும்-குவாண்டம் கைகுலுக்கல்கள், HSM-இல் பொதிக்க no_std தொகுப்பு, மறையாக்க நெகிழ்வுத்தன்மை
  கொண்ட சுருக்க எல்லைகள், மேலும் ஒளிபுகா வழங்குநர் இடரை ஏற்காமல் PQC இடமாற்றத்துக்கு ஆதரவளிக்க இயக்குநர்
  குழுக்களுக்கு இப்போது தேவைப்படும் DORA பிரிவு 5 ஆளுகைச் சான்றுகள்.
rigour:
- metric: தரநிலை
- metric: கலப்புப் பயன்முறை
  value: பாரம்பரிய TLS + ML-KEM-768, X25519MLKEM768 பயன்முறையில்
- metric: பொதிவு
  value: no_std — HSM, பாதுகாப்பான அறைகள், பொதிக்கப்பட்ட இலக்குகளில் பொருந்தும்
- metric: மறையாக்க நெகிழ்வு
  value: சுருக்க எல்லைகள் API-ஐ மாற்றாமல் வழிமுறையை மாற்ற அனுமதிக்கின்றன
- metric: உரிமம்
validation:
- EPAA Quantum-Safe Payments வெண்ணறிக்கையில் மேற்கோள் (செப்டம்பர் 2025)
- '12/06/2026 கட்டுரையில் இடம்பெற்றது: KyberLib and the Post-Quantum Banking Migration'
- NIST FIPS 203 / 204 / 205 வெளியீட்டுப் பாதையுடன் ஒத்திசைந்தது
- Qtonic Quantum Lab மதிப்பீடு செய்தது — சுயாதீன பிந்தைய-குவாண்டம் மறையாக்கவியல் மதிப்பீட்டுப் பதிவேடு,
  சுமார் 182 PQC நூலகங்கள் மதிப்பிடப்பட்டன (மேல் 44 %, சேர்ப்பதற்குக் கட்டணம் இல்லை)
- QGram (Quantum2pi) ஏற்றுக்கொண்டது — செய்திகளை மறையாக்க KyberLib-ஐப் பயன்படுத்தும், முனையிலிருந்து முனை
  வரை மறையாக்கப்பட்ட, சமநிலை-முதல்-சமநிலை பிந்தைய-குவாண்டம் செய்தியாளர் (f6s.com/software/qgram-இல் சரிபார்க்கலாம்)
