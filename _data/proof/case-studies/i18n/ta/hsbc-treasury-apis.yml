title: HSBC Treasury APIs — கட்டணங்களும் Banking-as-a-Service-உம்
banner_alt: லண்டன் நகர வானளாவிய காட்சி — HSBC-இன் Commercial & Investment Bank திட்டத்தின் கீழ் வழங்கப்பட்ட
  கருவூல API தளத்தின் குறியீடு
sector: முதல் நிலை வணிக வங்கி · நிறுவனக் கருவூலம் · ஒழுங்குபடுத்தப்பட்ட கட்டணங்கள்
role: மூத்த தயாரிப்பு மற்றும் தொழில்நுட்பத் தலைவர்
status: முதல் நிலை உலகளாவிய வங்கியில் உற்பத்திச் சூழலில் இயங்குகிறது
outcome_highlights:
- value: முதல் நிலை
  label: உலகளாவிய வங்கி, Commercial & Investment Bank
- label: ஒழுங்குபடுத்தப்பட்ட கட்டண எல்லை
- value: கருவூலம் / BaaS
  label: நிரல்படுத்தக்கூடிய பணம், பணப்புழக்கம், கட்டணத் தடங்கள்
- value: பல ஆண்டுகள்
  label: மூத்த தயாரிப்பு மற்றும் தொழில்நுட்பத் தலைமை
pull_quote: «வங்கியின் ஒழுங்குமுறை எல்லைக்குள் உற்பத்திச் சூழலில் கட்டணம், இருப்பு, பணப்புழக்க API-களை
  வழங்கினேன் — கட்டமைப்பு, வழங்குநர் ஒருங்கிணைப்பு, மேற்பார்வைச் சான்று, மேலும் DORA-வும் SR 11-7-உம்
  இப்போது கட்டாயமாக்கும் செயல்பாட்டு பின்னடைவுக் கட்டுப்பாடுகள் வரை.»
problem: நிறுவனக் கருவூலக் குழுக்கள் ஒரு முதல் நிலை வங்கிக்குள் பண மேலாண்மை, பணப்புழக்கம், கட்டணத் தடங்களுக்கு
  நிரல்படுத்தக்கூடிய அணுகலைக் கோருகின்றன — வங்கியே உருவாக்க வேண்டிய மேற்பார்வைச் சான்று அடுக்கை விட்டுக்கொடுக்காமல்.
what_i_built: Commercial & Investment Bank-க்குள் HSBC-இன் கருவூல API-கள் மற்றும் Banking-as-a-Service
  திட்டத்துக்கான தயாரிப்பு மற்றும் தொழில்நுட்பப் பணிப்பாய்வுகளுக்குத் தலைமை தாங்கினேன்; வங்கியின் ஒழுங்குமுறை
  எல்லைக்குள் உற்பத்திச் சூழலில் கட்டணம், இருப்பு, பணப்புழக்க API-களை வழங்கினேன். கட்டமைப்பு, வழங்குநர்
  ஒருங்கிணைப்பு, மேற்பார்வைச் சான்று, மேலும் DORA-வும் SR 11-7-உம் இப்போது கட்டாயமாக்கும் செயல்பாட்டு
  பின்னடைவுக் கட்டுப்பாடுகள் ஆகியவற்றில் பணியாற்றினேன்.
rigour:
- metric: பங்கு
  value: CIB-க்குள் மூத்த தயாரிப்பு மற்றும் தொழில்நுட்பத் தலைமை
- metric: சூழல்
  value: FCA / PRA ஒழுங்குபடுத்திய கட்டணத் தளம்
- metric: பரப்பு
  value: கருவூல API-கள், இருப்பு மற்றும் பண மேலாண்மை, BaaS விநியோகம்
- metric: பயனர்கள்
  value: பன்னாட்டு நிறுவனங்கள் மற்றும் இரண்டாம் நிலை வங்கிகளில் உள்ள நிறுவனக் கருவூலர்கள்
validation:
- HSBC Commercial & Investment Bank-இல் பொதுப் பங்கு — LinkedIn வழியாகச் சரிபார்க்கலாம்
- திட்டப் பரப்பு பற்றி / அனுபவம் பகுதியில் குறிப்பிடப்பட்டுள்ளது
