title: BankStatementParser — கருவூலத்துக்கான ஒருங்கிணைந்த பரிவர்த்தனை நுண்ணறிவு
banner_alt: இரவில் நவீன நிதி அலுவலகம் — CAMT, MT940, OFX, CSV வங்கி அறிக்கை வடிவங்களில் ஒருங்கிணைந்த பரிவர்த்தனை
  நுண்ணறிவின் குறியீடு
sector: திறந்த மூலம் · நிறுவனக் கருவூலம் · இடர்-தரவுத் தொகுப்பு
role: ஆசிரியரும் பராமரிப்பாளரும்
status: உற்பத்திச் சூழலில், செயலூக்கமாகப் பராமரிக்கப்படுகிறது
outcome_highlights:
- value: 6 வடிவங்கள்
  label: CAMT (.052/.053/.054), MT940, OFX, CSV, OCR PDF
- value: புலம் வாரியாக
  label: 'மூலம்: மூல வடிவமும் பாகுபடுத்தி பதிப்பும் பதிவு செய்யப்படுகின்றன'
- label: இடர்-தரவுத் தொகுப்புடன் ஒத்திசைந்தது
- label: பயன்படுத்தவும், பிரிக்கவும், தணிக்கை செய்யவும் இலவசம்
pull_quote: «திட்டவரையால் சரிபார்க்கப்பட்ட CAMT / MT940 / PAIN பாகுபடுத்திகள், வருடிய PDF-களுக்கு OCR
  மாற்று, உறுதிநிலைப் புல வரைபடம், SR 11-7 தரத்திலான தணிக்கைச் சான்று — ஒவ்வொரு மாற்றப் படியும் பதிவு
  செய்யப்பட்டு மீள்உருவாக்கக்கூடியது.»
problem: நிறுவனக் கருவூலக் குழுக்கள் டஜன் கணக்கான வங்கிகளிடமிருந்து CAMT, PAIN.001, MT940, OFX, CSV மற்றும்
  வருடிய PDF வடிவங்களில் வங்கி அறிக்கைகளைப் பெறுகின்றன. ஒவ்வொரு வடிவமும் வெவ்வேறு புல பொருள்களையும், குறியாக்கங்களையும்,
  தெளிவின்மைகளையும் கொண்டுள்ளது. பெரும்பாலான குழுக்கள் ஒவ்வொரு வங்கிக்கும் உடையக்கூடிய பாகுபடுத்திகளைக்
  கையால் கட்டுகின்றன; இது நிகழ்நேர பணப்புழக்க முன்னறிவிப்பையும், மோசடி கண்டறிதலையும், தணிக்கைக்குத் தயாரான
  ஒப்பீட்டையும் தடுக்கிறது.
what_i_built: ஒவ்வொரு பொதுவான வங்கி அறிக்கை வடிவத்தையும் ஒரே, இயல்பாக்கப்பட்ட பரிவர்த்தனை ஓட்டமாக ஒருங்கிணைக்கும்
  ஒரு திறந்த மூல Python கருவித்தொகுப்பு. திட்டவரையால் சரிபார்க்கப்பட்ட CAMT / MT940 / PAIN பாகுபடுத்திகள்,
  வருடிய PDF-களுக்கு OCR மாற்று, உறுதிநிலைப் புல வரைபடம், மேலும் ஒவ்வொரு மாற்றப் படிக்கும் SR 11-7 தரத்திலான
  தணிக்கைச் சான்று.
