title: CloudCDN — செயற்கை நுண்ணறிவு சார்ந்த விளிம்புக்கான திறந்த மூல வரைபடம்
banner_alt: செயற்கை நுண்ணறிவு சார்ந்த விளிம்புக் கட்டமைப்பு — CloudCDN ஒரு மேற்கோள் செயலாக்கமாக வழங்கும்
  பூஜ்ஜிய-நம்பிக்கை MCP நுழைவாயில், அணு Durable Objects வீத வரம்பு, WebAuthn கடவுச்சாவி எல்லை ஆகியவற்றின்
  குறியீடு
sector: திறந்த மூலம் · விளிம்பு · செயற்கை நுண்ணறிவுக் கட்டமைப்பு
role: ஆசிரியரும் பராமரிப்பாளரும்
status: உற்பத்திச் சூழலில், செயலூக்கமாகப் பராமரிக்கப்படுகிறது
outcome_highlights:
- value: 3,185 சோதனைகள்
  label: 100 % வரி, கிளை, செயற்கூறு பரப்பளவு
- label: கட்டமைப்பு மூலமும் Sigstore கையொப்பமும்
- value: 42 MCP கருவிகள்
  label: ஒவ்வொரு அழைப்பும் கட்டமைந்த சான்றுடன் பதிவு செய்யப்படுகிறது
- label: பிரிவு 5 மற்றும் இடர்-தரவுத் தொகுப்புடன் இணைக்கப்பட்டது
pull_quote: «ஒரு பாதுகாப்புக் குழு படிக்கவும், பிரிக்கவும், கையொப்பமிடவும் கூடிய திறந்த மூல மேற்கோள் செயலாக்கம்
  — சந்தைப்படுத்தல் PDF அல்ல. அணு Durable Objects வீத வரம்பு, WebAuthn எல்லை, SLSA L3 மூலம்.»
problem: செயற்கை நுண்ணறிவு முகவர்களும் MCP கருவிகளும் பெரிய அளவில் விளிம்பு API-களை அழைக்கத் தொடங்கும்போது,
  DORA தரத்திலான தணிக்கைச் சான்றை இழக்காமல் தன்னாட்சிப் போக்குவரத்தைத் தாங்கும் ஓர் எல்லை வங்கிகளுக்குத்
  தேவை. இருக்கும் CDN-கள் சந்தைப்படுத்தல் மொழியையோ ஒளிபுகா திட்டங்களையோ வழங்குகின்றன — எதுவும் ஒரு பாதுகாப்புக்
  குழு படிக்கவும், பிரிக்கவும், கையொப்பமிடவும் கூடிய மேற்கோள் செயலாக்கத்தை உருவாக்குவதில்லை.
what_i_built: 42 கருவிகளுடன் கூடிய திறந்த மூல, பூஜ்ஜிய-நம்பிக்கை MCP நுழைவாயில்; அணு Durable Objects வீத
  வரம்பு, WebAuthn கடவுச்சாவி எல்லை, கையொப்பமிட்ட URL-கள், SLSA நிலை 3 கட்டமைப்பு மூலம். 100 % பரப்பளவுடன்
  3,185 சோதனைகள்; DORA பிரிவு 5, BCBS 239 இடர்-தரவுத் தொகுப்பு, பாசல் III செயல்பாட்டு இடர் மூலதனம் ஆகியவற்றுடன்
  இணைக்கப்பட்டவை.
rigour:
