  value: 100 % வரி, கிளை, செயற்கூறு பரப்பளவுடன் 3,185 சோதனைகள்
- metric: விநியோகச் சங்கிலி ஒருமை
  value: SLSA நிலை 3 கட்டமைப்பு மூலம் + Sigstore கையொப்பம்
- metric: MCP பரப்பு
  value: 42 கருவிகள் — ஒவ்வொரு அழைப்பும் கட்டமைந்த சான்றுடன் பதிவு செய்யப்படுகிறது
- metric: வீத வரம்பு
  value: அணு Durable Objects (போட்டி நிலைகள் இல்லை, இரட்டைக் கணக்கீடு இல்லை)
- metric: அணுகல் கட்டுப்பாடு
  value: WebAuthn கடவுச்சாவிகள் + கையொப்பமிட்ட URL-கள்
- metric: உரிமம்
validation:
- '11/06/2026 கட்டுரையில் இடம்பெற்றது: CloudCDN — An Open-Source Blueprint for the AI-Native Edge'
- DORA பிரிவு 5, BCBS 239, பாசல் III செயல்பாட்டு இடருடன் இணைக்கப்பட்டது
