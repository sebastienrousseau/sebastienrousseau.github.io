problem: >
  Corporate treasury teams receive bank statements in CAMT, PAIN.001,
  MT940, OFX, CSV, and scanned PDFs from dozens of banks. Each format
  carries different field semantics, encodings, and ambiguities.
  Most teams hand-build brittle per-bank parsers, blocking real-time
  cash forecasting, fraud detection, and audit-ready reconciliation.

what_i_built: >
  An open-source Python toolkit that unifies every common bank
  statement format into a single, normalised transaction stream.
  Schema-validated CAMT / MT940 / PAIN parsers, OCR fallback for
  scanned PDFs, deterministic field mapping, and SR 11-7-grade audit
  evidence for every transformation step.

