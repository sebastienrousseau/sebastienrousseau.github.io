slug: pain001
title: "pain001 — automating ISO 20022 payment files"
banner: "https://cloudcdn.pro/stocks/images/ben-o-bro-wpU4veNGnHg.webp"
banner_alt: "Aerial view of the City of London at dusk — symbolising structured payment file automation under ISO 20022"
role: "Author and maintainer"
period: "2023 – present"
status: "Production, actively maintained"

problem: >
  The global MT → MX migration forces every bank and corporate treasury
  to produce structured pain.001 messages. Most teams hand-roll brittle
  XML or buy opaque proprietary translators. Both routes ship payment
  errors into clearing networks and leave no audit trail.

what_i_built: >
  An open-source Python library that generates validated ISO 20022
  pain.001 (Customer Credit Transfer Initiation) messages from CSV /
  SQLite / Parquet. Pre-flight XSD validation, IBAN / BIC checksums,
  PII masking, and full XSD schema conformance — all inside a Python
  workflow that drops into existing ERP and treasury pipelines.

