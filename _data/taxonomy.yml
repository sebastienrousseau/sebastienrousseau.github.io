# ----------------------------------------------------------------- #
# Canonical tag taxonomy for sebastienrousseau.com                  #
# ----------------------------------------------------------------- #
#
# Source of truth for /tags/<slug>/ landing pages, per-tag RSS/Atom/
# JSON Feed/news-sitemap, /categories/<cat>/ pages, and the article-
# foot tag strip (inject_tag_strip, WS2 commit 7 follow-up).
#
# Curation rules (per ~/Drop/editorial-overhaul-plan.md §4 WS3):
#
# 1. Every post's `tags:` frontmatter string MUST resolve through
#    aliases to exactly one canonical slug below. Orphans fail CI
#    (test_taxonomy_parity.py in WS3 commit 10).
#
# 2. Canonical tags with **<3 posts** after alias-collapse do NOT
#    get a /tags/<slug>/ landing page; they're surfaced as anchors
#    on the /tags/ cover only. Keeps the URL set ≈ 28 × ~30 = ~840
#    pages instead of 500+ near-empty tags.
#
# 3. Each entry's `category` puts it under one of six pillars
#    (ai, payments, infra, policy, open-source, leadership). The
#    /categories/<pillar>/ landings aggregate every tag in that
#    pillar.
#
# 4. Per locale, `slugs.json` carries the localised path segment
#    (e.g. fr: post-quantum-cryptography → cryptographie-post-quantique).
#    Slugs here are EN-canonical; locale forks live in
#    _data/i18n/<lang>/slugs.json under tags.<canonical>.
#
# Audit baseline (2026-06-13):
#   89 posts, 618 raw tag tokens, 503 singletons.
#   Top 12 canonical tags cover ~80 % of tagged content.
#
# Fields:
#   name         — Display name (capitalised as it appears in body
#                  text and the tag landing h1)
#   plural       — Plural for headings ("12 articles tagged
#                  Stablecoins")
#   description  — 1–2 line summary that appears on the tag landing
#                  page's deck and feeds out to the per-tag RSS
#                  channel description
#   aliases      — Spellings / casings / synonyms collapsed into
#                  this canonical at build time
#   category     — One of { ai | payments | infra | policy |
#                  open-source | leadership }
#
# ----------------------------------------------------------------- #

