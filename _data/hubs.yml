applied-ai:
  path: "/applied-ai/"
  title: "Agentic AI in Banking and AI in Payments Operations"
  description: "Agentic AI in banking and AI in payments operations: EU AI Act, FCA and Fed positions, FSB sound practices, and reading paths for boards, engineers and risk."
  h1: "Applied AI and agentic AI in banking"
  answer: >-
    Agentic AI describes AI systems that plan and act across payments,
    treasury and back-office workflows under delegated authority. It
    matters to banks now because adoption is broad, while rules on
    accountability, transparency and model risk are still settling. This
    hub gives verified regulatory positions, reading paths by role and
    direct answers on governance and operations.
  at_a_glance:
    - text: "In a 2024 Bank of England and FCA survey, 75% of UK financial firms were already using AI and a further 10% planned to within three years."
      source: "https://www.bankofengland.co.uk/report/2024/artificial-intelligence-in-uk-financial-services-2024"
      last_verified: "2026-11-10"
    - text: "The EU AI Act entered into force on 1 August 2024; Annex III high-risk rules now apply from 2 December 2027 after the AI Omnibus."
      source: "https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai"
      last_verified: "2026-11-10"
    - text: "The European Commission lists credit scoring that can deny people a loan as an example of a high-risk AI use."
      source: "https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai"
      last_verified: "2026-11-10"
    - text: "The FCA does not plan extra regulations for AI and relies on existing frameworks such as the Consumer Duty and SM&CR."
      source: "https://www.fca.org.uk/firms/innovation/ai-approach"
      last_verified: "2026-11-10"
    - text: "US model risk guidance SR 26-2 (17 April 2026) states that generative and agentic AI models are not within its scope."
      source: "https://www.federalreserve.gov/supervisionreg/srletters/SR2602a1.pdf"
      last_verified: "2026-11-10"
    - text: "The FSB consulted on 12 sound practices for responsible AI adoption on 10 June 2026, including questions on agentic AI."
      source: "https://www.fsb.org/2026/06/sound-practices-for-responsible-adoption-of-artificial-intelligence-ai-consultation-report/"
      last_verified: "2026-11-10"
  paths:
    - audience: "Boards and executives"
      slugs:
        - "2026-05-17-agentic-engineering-banks-blueprint-2026"
        - "2026-07-01-agentic-ai-index-banks-measuring-autonomy-2026"
        - "2026-06-25-global-payments-outlook-agentic-invisible-real-time-2026"
        - "2026-10-25-agentic-ai-breaks-the-assumption-behind-every-task-exposure-forecast"
    - audience: "Engineers and architects"
      slugs:
        - "2026-05-27-ai-operating-system-payments-fraud-routing-resilience-compliance-2026"
        - "2026-05-23-agentic-payments-banking-consent-liability-new-payment-ux-2026"
        - "2026-07-07-corporate-banking-api-standard-agentic-mcp-2026"
        - "2026-06-27-agentic-treasury-co-pilots-autonomous-treasury-production-2026"
    - audience: "Risk, compliance and regulators"
      slugs:
        - "2026-05-28-dora-ai-act-data-sovereignty-banking-compliance-stack-2026"
        - "2026-08-02-ai-act-article-50-transparency-banks-omnibus-2026"
        - "2026-07-30-model-risk-management-generative-ai-out-of-scope-2026"
        - "2026-10-28-why-the-fca-is-regulating-ai-without-an-ai-rulebook"
  tags:
    - "ai"
    - "agentic-ai"
    - "generative-ai"
    - "llm"
    - "ai-governance"
    - "agentic-payments"
  faq:
    - q: "What is agentic AI in banking?"
      a: "Agentic AI means AI agents that plan and carry out multi-step tasks, such as payments, treasury or back-office work, under delegated authority rather than only answering questions. The banking questions it raises are consent, liability, audit trails and interoperability."
    - q: "Where is AI used in payments operations?"
      a: "In fraud prevention, payment repair, routing, liquidity forecasting and compliance screening, and increasingly in controls for agent-initiated payments. The deciding factor is design discipline: which data, rails, controls and liabilities sit together."
    - q: "How widely do UK financial firms use AI?"
      a: "A 2024 Bank of England and FCA survey found 75% of firms already using AI, with a further 10% planning to within three years. Foundation models accounted for 17% of use cases."
    - q: "When do EU AI Act high-risk rules apply to banks?"
      a: "After the AI Omnibus, which entered into force on 27 July 2026, high-risk rules for Annex III systems apply from 2 December 2027. Credit scoring is listed as a high-risk use."
    - q: "Did the AI Omnibus delay everything?"
      a: "No. The AI Act's transparency rules took effect in August 2026, so customer-facing chatbots and generated content carry obligations now, even though the high-risk deadline moved."
    - q: "Does the FCA plan AI-specific rules?"
      a: "No. The FCA says it does not plan extra regulations for AI and relies on existing frameworks, including the Consumer Duty and the Senior Managers and Certification Regime."
    - q: "Does US model risk guidance cover generative and agentic AI?"
      a: "Not directly. SR 26-2, issued on 17 April 2026, says generative and agentic AI models are not within its scope and that a bank's wider risk management and governance practices should guide their controls."
    - q: "What is the difference between human-in-the-loop and human-on-the-loop?"
      a: "Human-in-the-loop means the agent cannot act without explicit human approval. Human-on-the-loop means the agent acts autonomously while a human monitors and can intervene; every high-risk agent needs a stated position on which applies."
    - q: "Who is liable when an AI agent makes a payment?"
      a: "That question is not yet settled, because payment law was written for transactions decided by humans. Emerging protocols try to capture the user's instructions and final approval as auditable evidence of intent before money moves."
    - q: "Are there international principles for AI in finance?"
      a: "The Financial Stability Board consulted in June 2026 on 12 sound practices for responsible AI adoption, covering governance and the AI lifecycle. NIST's AI Risk Management Framework, released in January 2023, is another widely used reference."
