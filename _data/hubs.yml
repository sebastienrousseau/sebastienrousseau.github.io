  tags:
    - "iso-20022"
    - "cbpr-plus"
    - "pacs-008"
    - "pain-001"
  faq:
    - q: "What is ISO 20022?"
      a: "ISO 20022 is the financial messaging standard now used by CHAPS, T2 and the Fedwire Funds Service, and by Swift for cross-border payments. It carries richer, structured data than the MT and proprietary formats it replaced."
    - q: "Is the ISO 20022 migration finished?"
      a: "The rail migrations are: T2 went live in March 2023, CHAPS on 19 June 2023 and Fedwire in July 2025, and Swift MT/MX coexistence for cross-border payments ended in November 2025. What remains is data work, such as structured addresses, purpose codes and LEIs."
    - q: "What happened to the November 2026 structured-address deadline?"
      a: "It was postponed. Swift delayed its November 2026 Standards Release on 27 August 2026, the Bank of England deferred its November 2026 RTGS release in full, and the EPC removed its 15 November 2026 end date for unstructured addresses without setting a new one."
    - q: "Should banks pause address remediation?"
      a: "No. The requirement has been deferred, not withdrawn: the Bank of England expects a 12-month deferral, subject to confirmation, and the EPC will set a new end date in due course. Address quality is an upstream customer-data problem that takes longer to fix than the message layer."
    - q: "What is the difference between structured, hybrid and unstructured addresses?"
      a: "A structured address puts each component in its own element, such as StrtNm, TwnNm and Ctry. A hybrid address puts at least Town Name and Country in structured fields and the rest in up to two free-text AdrLine elements. An unstructured address uses free-text lines only."
    - q: "What enhanced data does CHAPS require?"
      a: "Since May 2025 the Bank of England has mandated Purpose Codes and LEIs for payments between financial institutions, and Purpose Codes for property transactions. From November 2027 Purpose Codes extend to all CHAPS payments, while structured remittance will not be mandated from that date."
    - q: "What are the CPMI harmonised ISO 20022 data requirements?"
      a: "They are a common set of ISO 20022 data requirements for cross-border payments, published by the BIS Committee on Payments and Market Infrastructures under the G20 programme. Full alignment is targeted for end-2027 at the latest."
    - q: "Which ISO 20022 messages matter most for payments teams?"
      a: "Corporates initiate payments with pain.001; banks exchange customer credit transfers as pacs.008, institution transfers as pacs.009 and returns as pacs.004. Investigations now run on structured camt messages such as camt.029 instead of MT free-format messages."
    - q: "Where does the business value of ISO 20022 come from?"
      a: "From using the structured data, not just carrying it. Structured party data improves sanctions screening and reduces manual repair, and structured investigation messages shorten exception handling, but only if the back office keeps the data instead of mapping it back to legacy formats."
