iso-20022:
  path: "/iso-20022/"
  title: "ISO 20022 Migration Guide for Banks: Dates and Data"
  description: "An ISO 20022 migration guide for banks: verified CHAPS, T2, Fedwire and Swift dates, the delayed structured-address deadline, and what banks should do next."
  h1: "ISO 20022 for banks: a migration guide"
  answer: >-
    ISO 20022 is the messaging standard now used by CHAPS, T2, the
    Fedwire Funds Service and Swift cross-border payments. The rail
    migrations are done; the work left is data quality, from structured
    addresses to purpose codes and LEIs. This hub gives verified dates,
    reading paths by role and practical answers for banks planning the
    next releases.
  at_a_glance:
    - text: "CHAPS and the Bank of England's RTGS system migrated to ISO 20022 on 19 June 2023."
      source: "https://www.bankofengland.co.uk/payments/rtgs-renewal-programme/iso-20022"
      last_verified: "2026-11-10"
    - text: "T2 launched in March 2023, replacing TARGET2, and uses ISO 20022 in common with T2S, TIPS and ECMS."
      source: "https://www.ecb.europa.eu/paym/target/t2/html/index.en.html"
      last_verified: "2026-11-10"
    - text: "The Fedwire Funds Service migrated to ISO 20022 in July 2025."
      source: "https://www.federalreserve.gov/econres/notes/feds-notes/a-decade-of-u-s-cross-border-payments-efforts-20260826.html"
      last_verified: "2026-11-10"
    - text: "On 27 August 2026 Swift delayed its November 2026 Standards Release, and the Bank of England deferred its November 2026 RTGS release in full."
      source: "https://www.bankofengland.co.uk/news/2026/august/delay-to-the-november-2026-rtgs-standards-release"
      last_verified: "2026-11-10"
    - text: "The EPC will keep accepting unstructured addresses in all five SEPA schemes beyond 15 November 2026; no new end date is set yet."
      source: "https://www.europeanpaymentscouncil.eu/sites/default/files/kb/file/2026-09/EPC016-06%202025%20SDD%20Core%20Rulebook%20version%201.2.pdf"
      last_verified: "2026-11-10"
    - text: "The CPMI targets full alignment with its harmonised ISO 20022 data requirements for cross-border payments by end-2027 at the latest."
      source: "https://www.bis.org/cpmi/publ/d218.htm"
      last_verified: "2026-11-10"
  roadmap:
    - date: "2023-06-19"
      text: "CHAPS and RTGS migrate to ISO 20022."
      source: "https://www.bankofengland.co.uk/payments/rtgs-renewal-programme/iso-20022"
      last_verified: "2026-11-10"
    - date: "2025-07"
      text: "Fedwire Funds Service migrates to ISO 20022."
