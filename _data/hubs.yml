post-quantum-cryptography:
  path: "/post-quantum-cryptography/"
  title: "Post-Quantum Cryptography for Payments and Banking"
  description: "Post-quantum cryptography for payments and quantum-safe banking: NIST standards, NCSC and EU migration deadlines, and reading paths for boards and engineers."
  h1: "Post-quantum cryptography for payments and banking"
  answer: >-
    Post-quantum cryptography replaces the public-key algorithms that a
    future quantum computer could break, such as RSA and elliptic
    curves. It matters to banks now because data captured today can be
    decrypted later, and regulators have set migration dates. This hub
    gives verified standards and deadlines, reading paths by role and
    direct answers.
  at_a_glance:
    - text: "NIST published FIPS 203 (ML-KEM), FIPS 204 (ML-DSA) and FIPS 205 (SLH-DSA) on 13 August 2024."
      source: "https://www.nist.gov/news-events/news/2024/08/nist-releases-first-3-finalized-post-quantum-encryption-standards"
      last_verified: "2026-11-10"
    - text: "NIST selected HQC on 11 March 2025 as a backup to ML-KEM; a final standard is expected in 2027."
      source: "https://www.nist.gov/news-events/news/2025/03/nist-selects-hqc-fifth-algorithm-post-quantum-encryption"
      last_verified: "2026-11-10"
    - text: "The NCSC asks organisations to define migration goals by 2028, carry out early, highest-priority migration by 2031 and complete migration by 2035."
      source: "https://www.ncsc.gov.uk/guidance/pqc-migration-timelines"
      last_verified: "2026-11-10"
    - text: "Under the EU coordinated roadmap, Member States should start moving to PQC by the end of 2026 and protect high-risk use cases by the end of 2030."
      source: "https://digital-strategy.ec.europa.eu/en/policies/post-quantum-cryptography"
      last_verified: "2026-11-10"
    - text: "The BIS published a quantum-readiness roadmap for the financial system on 7 July 2025, starting with awareness and a cryptographic inventory."
      source: "https://www.bis.org/publ/bppdf/bispap158.htm"
      last_verified: "2026-11-10"
    - text: "NIST IR 8547, Transition to Post-Quantum Cryptography Standards, was published in final form on 27 October 2026."
      source: "https://csrc.nist.gov/pubs/ir/8547/final"
      last_verified: "2026-11-10"
  roadmap:
    - date: "2024-08-13"
      text: "NIST publishes the first three post-quantum standards: FIPS 203, 204 and 205."
      source: "https://www.nist.gov/news-events/news/2024/08/nist-releases-first-3-finalized-post-quantum-encryption-standards"
      last_verified: "2026-11-10"
    - date: "2025-03-20"
      text: "NCSC publishes its PQC migration timelines (2028, 2031, 2035)."
      source: "https://www.ncsc.gov.uk/guidance/pqc-migration-timelines"
      last_verified: "2026-11-10"
    - date: "2025-06-23"
      text: "EU publishes the Coordinated Implementation Roadmap for the transition to post-quantum cryptography."
      source: "https://digital-strategy.ec.europa.eu/en/library/coordinated-implementation-roadmap-transition-post-quantum-cryptography"
      last_verified: "2026-11-10"
    - date: "2026-10-27"
      text: "NIST IR 8547 (Final), Transition to Post-Quantum Cryptography Standards, is published."
      source: "https://csrc.nist.gov/pubs/ir/8547/final"
      last_verified: "2026-11-10"
    - date: "2026-12"
      text: "EU Member States should have started the transition to PQC (end of 2026)."
      source: "https://digital-strategy.ec.europa.eu/en/policies/post-quantum-cryptography"
      last_verified: "2026-11-10"
    - date: "2030-12"
      text: "EU high-risk use cases should have moved to PQC (no later than the end of 2030)."
      source: "https://digital-strategy.ec.europa.eu/en/policies/post-quantum-cryptography"
      last_verified: "2026-11-10"
  paths:
    - audience: "Boards and executives"
      slugs:
        - "2026-05-14-securing-the-ledger-post-quantum-migration-corporate-finance"
        - "2026-06-04-quantum-safe-banking-index-pqc-qkd-crypto-agility-2026"
        - "2026-06-29-post-quantum-security-scorecard-board-level-fiduciary-agility-2026"
        - "2026-05-31-post-quantum-payments-infrastructure-replace-rather-than-retrofit-2026"
    - audience: "Engineers and architects"
      slugs:
        - "2023-11-19-crystals-kyber-the-safeguarding-algorithm-in-a-quantum-age"
        - "2023-11-28-kyberlib-a-rust-powered-shield-against-quantum-threats"
        - "2026-06-12-kyberlib-post-quantum-banking-migration-standards-code-2026"
        - "2026-06-25-quantum-dawn-cib-kyberlib-quantum-resilient-payments-stack-2026"
        - "2026-05-31-post-quantum-payments-infrastructure-replace-rather-than-retrofit-2026"
    - audience: "Risk, compliance and regulators"
      slugs:
        - "2026-04-11-quantum-thresholds-are-moving-again"
        - "2025-09-01-quantum-safe-payments-epaa"
        - "2026-05-18-quantum-cryptography-standards-developments-2026"
        - "2026-06-26-post-quantum-banking-resilience-index-eo-14409-fiduciary-crypto-agility-2026"
  tags:
    - "post-quantum-cryptography"
    - "ml-kem"
    - "ml-dsa"
    - "crypto-agility"
    - "hndl"
    - "quantum-computing"
  faq:
    - q: "What is post-quantum cryptography?"
      a: "It is public-key cryptography designed to resist attacks from quantum computers. NIST published the first three standards, ML-KEM, ML-DSA and SLH-DSA, on 13 August 2024."
    - q: "Why does it matter to banks now and not later?"
      a: "Because of harvest-now, decrypt-later: an attacker can collect and store encrypted data today and decrypt it once a capable quantum computer exists. Payment and settlement data with long-lived sensitivity is already exposed to that risk."
    - q: "Which algorithms are at risk?"
      a: "The asymmetric algorithms, RSA, elliptic-curve cryptography and Diffie-Hellman, which underpin TLS, PKI, code signing and interbank authentication. Symmetric encryption such as AES-256 remains sound if key lengths are maintained."
    - q: "What are the migration deadlines?"
      a: "The UK NCSC asks organisations to define migration goals by 2028, carry out early, highest-priority migration by 2031 and complete migration by 2035. The EU roadmap asks Member States to start by the end of 2026 and protect high-risk use cases by the end of 2030."
    - q: "What is ML-KEM?"
      a: "ML-KEM is the Module-Lattice-Based Key-Encapsulation Mechanism standardised in FIPS 203, formerly known as CRYSTALS-Kyber. NIST selected HQC in March 2025 as a backup to it."
    - q: "Should banks use hybrid schemes?"
      a: "The NCSC says a hybrid post-quantum and traditional scheme should be an interim measure, used within a flexible framework that allows a straightforward later move to post-quantum only. Hybrid deployment preserves compatibility while the ecosystem migrates."
    - q: "What is crypto-agility?"
      a: "Crypto-agility is the ability to change algorithms without redesigning the system. In practice the algorithm becomes a configuration choice rather than a load-bearing assumption, so the next migration is cheaper than this one."
    - q: "Why might legacy payment rails need replacing rather than patching?"
      a: "Post-quantum keys and signatures are much larger: an ML-KEM-768 public key is 1,184 bytes and an ML-DSA-65 signature is 3,309 bytes. Many message formats, HSM estates and certificate hierarchies were not sized for that."
    - q: "Where should a bank start?"
      a: "With awareness and an inventory of where cryptography is used, as the BIS quantum-readiness roadmap recommends. The inventory drives prioritisation by data lifetime and system criticality, and the migration plan follows from it."
    - q: "Is quantum key distribution an alternative?"
      a: "Not in the near term for most uses. The BIS roadmap notes that QKD may have long-term potential but faces infrastructure limits, and presents post-quantum cryptography as the practical near-term option."
