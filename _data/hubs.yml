    - date: "2026-08-27"
      text: "Swift delays its November 2026 Standards Release; the Bank of England defers its November 2026 RTGS release, including CHAPS messaging changes."
      source: "https://www.bankofengland.co.uk/news/2026/august/delay-to-the-november-2026-rtgs-standards-release"
      last_verified: "2026-11-10"
    - date: "2026-09-30"
      text: "EPC rulebook updates remove the 15 November 2026 end date for unstructured addresses across its payment schemes."
      source: "https://www.europeanpaymentscouncil.eu/sites/default/files/kb/file/2026-09/EPC016-06%202025%20SDD%20Core%20Rulebook%20version%201.2.pdf"
      last_verified: "2026-11-10"
    - date: "2027-11"
      text: "Bank of England expands mandatory Purpose Codes to all CHAPS payments, for initiation channels within direct participants' control."
      source: "https://www.bankofengland.co.uk/paper/2025/ps/expanding-mandatory-iso-20022-enhanced-data-in-chaps-from-2027"
      last_verified: "2026-11-10"
