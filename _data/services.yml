# The "Work with me" pages (plan F-4): one hub and two detail pages, rendered
# by scripts/generators/build_services.py into public/work-with-me/. Speaking
# keeps its own page (/speaking/), linked from the hub.
#
# Copy rules: British English; facts only from _data/profile.yml and the
# site's own data (download figures come from _data/proof/metrics.json at
# build time); no prices, client names or outcomes that are not published.
# Decision D-4: no advisory page. The FAQ entries are the visible text the
# FAQPage JSON-LD is built from, word for word.

disclosure: >-
  These are personal activities, separate from my role at HSBC. The views I
  share are my own.

hub:
  path: /work-with-me/
  title: "Work with me | Sebastien Rousseau"
  description: >-
    Speaking, research collaboration and open-source support on payments,
    ISO 20022, post-quantum cryptography and applied AI, from a payments
    leader.
  eyebrow: Work with me
  h1: Speaking, research and open-source support.
  answer: >-
    I work with banks, payment service providers, fintechs, regulators and
    industry bodies in three ways: talks on payments, post-quantum security
    and applied AI; research collaboration, from co-authoring a paper to
    reviewing a draft; and help for teams adopting my open-source ISO 20022
    and post-quantum libraries.
  cards:
    - title: Speaking
      href: /speaking/
      body: >-
        Keynotes, panels and expert comment on quantum-safe payments,
        ISO 20022 and agentic AI in banking. Every talk is available to book.
      link: See the talks
    - title: Research collaboration
      href: /work-with-me/research/
      body: >-
        Co-authoring, draft review and working-group contributions, with the
        EPAA quantum-safe payments white paper as the reference.
      link: How research collaboration works
    - title: Open-source support
      href: /work-with-me/open-source/
      body: >-
        Help adopting the ISO 20022 MCP suite and the post-quantum libraries:
        integration questions, issues and security reports.
      link: How open-source support works

pages:
  - key: research
    path: /work-with-me/research/
    subject: papers
    service_type: Research collaboration
    service_name: Research collaboration on payments, post-quantum cryptography and applied AI
    title: "Research collaboration | Sebastien Rousseau"
    description: >-
      Co-authoring, draft review and working-group contributions on payments,
      ISO 20022, post-quantum cryptography and applied AI, for banks and
      industry bodies.
    eyebrow: Work with me
    h1: Research collaboration on payments and quantum-safe security.
    answer: >-
      Research collaboration means working together on a paper, a
      working-group output or a technical review in payments, ISO 20022,
      post-quantum cryptography or applied AI. It suits industry bodies,
      banks, fintechs and academic teams that want a practitioner's view.
      You get a co-author, a reviewer or a working-group contributor, with
      the EPAA white paper as the reference.
    audiences:
      - heading: Banks
        body: >-
          Payments, security and architecture teams preparing a position
          paper or an internal review on quantum-safe migration or
          ISO 20022, who want a reader who has built payments products and
          the open-source tools around them.
      - heading: Fintechs and payment service providers
        body: >-
          Teams publishing research on payment rails, open banking or
          agentic payments, who want a co-author or reviewer from the bank
          side of the table.
      - heading: Regulators and industry bodies
        body: >-
          Working groups and associations drafting guidance or white papers,
          who want a contributor with hands-on payments and post-quantum
          cryptography experience.
    deliverables:
      - lead: Co-authoring.
        body: >-
          A section or a full paper on a topic in my focus areas, written in
          plain English with every claim sourced.
      - lead: Draft review.
        body: >-
          A structured review of your draft: what holds, what needs a
          source, and where a payments practitioner would push back.
      - lead: Working-group contributions.
        body: >-
          Regular participation in a working group, as with the EPAA
          Quantum-Safe Cryptography Working Group.
      - lead: Open data and code.
        body: >-
          Where it helps the paper, the open-source libraries and datasets I
          maintain can be cited, inspected and reused.
    steps:
      - Send a short note through the contact form with the topic, the output you have in mind and the timeline.
      - We agree the scope, the credit and the publication terms in writing before any work starts.
      - I contribute to the agreed drafts until the paper or output is published.
    proof: [epaa, fiap, downloads]
    faq:
      - q: What topics do you cover?
        a: >-
          ISO 20022, SWIFT gpi, SEPA Instant Payments, Open Banking,
          cross-border payment rails, post-quantum cryptography and agentic
          AI in banking.
      - q: Can you co-author in French?
        a: Yes. I write in English and French, both at native level.
      - q: How is a contribution credited?
        a: >-
          As we agree in writing before work starts, usually as a named
          contributor, as on the EPAA white paper.
      - q: Does this involve HSBC?
        a: >-
          No. Research collaboration is a personal activity, separate from my
          role at HSBC, and the views are my own.
      - q: How do I start?
        a: >-
          Use the contact form and choose "White paper / research
          collaboration". The typical first response is within 48 hours.

  - key: open-source
    path: /work-with-me/open-source/
    subject: product
    service_type: Open-source support
    service_name: Support for the ISO 20022 MCP suite and post-quantum libraries
    title: "Open-source support | Sebastien Rousseau"
    description: >-
      Help adopting the ISO 20022 MCP suite and the post-quantum libraries:
      integration questions, issues, security reports and provenance evidence
      for your review.
    eyebrow: Work with me
    h1: Support for teams adopting the open-source libraries.
    answer: >-
      Open-source support helps teams adopt the ISO 20022 MCP suite and my
      post-quantum and developer libraries: answering integration questions,
      triaging issues and handling security reports. It suits engineering
      teams at banks, payment service providers and fintechs that are
      evaluating the code. You get public answers on GitHub, a private route
      for vulnerabilities and provenance evidence for your review.
    audiences:
      - heading: Banks
        body: >-
          Engineering and security teams evaluating the libraries for
          internal tools, who need the provenance, licensing and governance
          evidence a vendor-risk review asks for.
      - heading: Fintechs and payment service providers
        body: >-
          Teams building ISO 20022 messaging or quantum-safe features, who
          want integration questions answered by the maintainer.
      - heading: Regulators and industry bodies
        body: >-
          Groups that want inspectable reference code for ISO 20022 messages
          or post-quantum algorithms to point their members to.
    deliverables:
      - lead: Integration questions.
        body: >-
          Answered in public on GitHub, so the next team with the same
          question finds the answer.
      - lead: Issues and fixes.
        body: >-
          Bugs reported on GitHub are triaged by the maintainer and fixed in
          the open, with each change in the release notes.
      - lead: Security reports.
        body: >-
          A private route for vulnerabilities, set out in each repository's
          security policy, so a report is never made public before a fix.
      - lead: Evidence for your review.
        body: >-
          SBOMs, build-provenance attestations, Sigstore signatures and
          licences, collected on the Trust page.
    steps:
      - Open an issue on the library's GitHub repository, or use the contact form and choose "Open-source project question".
      - I reply with an answer, a fix or a pointer to the documentation, in public where the question is not sensitive.
      - Fixes ship in a tagged release with notes, so your team can upgrade and verify it.
    proof: [downloads, trust]
    faq:
      - q: Is the ISO 20022 MCP suite free to use?
        a: >-
          Yes. The libraries are open source; the Trust page lists each one's
          licence.
      - q: Where do I report a security vulnerability?
        a: >-
          Privately, through the security policy in the repository. Please do
          not open a public issue for a vulnerability.
      - q: Do you answer integration questions in private?
        a: >-
          Public answers on GitHub come first, so others benefit. Use the
          contact form for anything you cannot share in public.
      - q: Does this involve HSBC?
        a: >-
          No. The libraries and this support are a personal activity,
          separate from my role at HSBC.
      - q: How do I start?
        a: >-
          Open an issue on GitHub, or use the contact form and choose
          "Open-source project question". The typical first response is
          within 48 hours.
