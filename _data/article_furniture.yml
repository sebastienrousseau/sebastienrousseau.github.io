# Which article furniture postbuild adds (plan C-4). Each panel is useful;
# together they pushed the text down and repeated the same actions, so the
# share rail, action rail, syndication panel and byline strap give way to
# one "Share · Cite" menu under the title. The functions and their tests
# stay; flip a flag to bring a panel back. Read by
# scripts/postbuild/postbuild_lib/article_flags.py.
eyebrow: true          # one pillar label above the title
deck: true
byline_strap: false    # duplicates the author card
share_rail: false      # in the tools menu
action_rail: false     # Save PDF and Cite are in the tools menu
syndicate_panel: false
cite_popover: true     # the menu's "Cite" jumps to it
reuse_panel: true      # the menu's reuse link jumps to it
tools_menu: true       # one <details> with share, Save PDF, cite and reuse
