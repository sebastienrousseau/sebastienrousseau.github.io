# --------------------------------------------------------------------- bios
# Third person. The media kit, Speaking page and conference submissions use
# these; the author box uses `short`.
bios:
  one_line: >-
    Senior payments and financial services leader; leads wholesale payments
    API products at HSBC and works on quantum-safe payments with the EPAA.
  short: >-
    Sebastien Rousseau is a senior payments and financial services leader
    with more than 20 years in payments, banking and digital technology. He
    leads wholesale payments API products at HSBC and is a member of the
    Emerging Payments Association Asia's Quantum-Safe Cryptography Working
    Group.
  long: >-
    Sebastien Rousseau is a senior payments and financial services leader
    with more than 20 years in payments, banking and digital technology. At
    HSBC he leads wholesale payments API products in Commercial & Investment
    Banking, which he joined in 2016 as API Engineering Lead. Before that he
    founded and ran Reedia Ltd as Chief Executive Officer, shaped PayPal's
    HCE and tokenisation strategy with tier-one banks, led a mobile banking
    transformation at Barclays Corporate Banking, was Head of Mobile at
    Shazam, and headed AKQA's mobile technology division for clients
    including Nike, RBS and Nokia. He is a member of the EPAA Quantum-Safe
    Cryptography Working Group, a Fellow of the Institution of Analysts and
    Programmers, and the maintainer of widely used open-source payments and
    cryptography libraries. He speaks and writes on ISO 20022, post-quantum
    migration and agentic AI in banking.

